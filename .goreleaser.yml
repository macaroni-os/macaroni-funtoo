project_name: Macaroni OS
build:
  skip: true
release:
  header: |
    ## Macaroni OS {{ .Tag }}!

    A new release of Terragon branch is out!

    Another important release that confirm the big work done in MARK with a lot of security fix.

    In evidence:

      * Ollama 0.12.0

      * Llama-CPP 0.0.6527

      * Upx 5.0.1

      * Go 1.23.12, 1.24.7

      * Zig (upstream tarball) 0.14.1

      * BackRest 1.9.2

      * Gitea 1.24.6

      * Gogs 0.13.3

      * Forgejo 12.0.4

      * Caddy 2.10.2

      * OpenSSH 10.0_p2

      * OpenSSL 1.1.1w

      * Nodejs 20.19.2, 22.16.0

      * OpenVPN 2.6.14

      * Bind 9.21.12

      * Tor 0.4.8.19

      * Git 2.49.0

      * PostgreSQL 13.21, 16.9

      * MySQL Community 8.0.42

      * Incus 6.13

      * Cryptography 46.0.2

      * CoreDNS 1.13.1

      * Kubectl 1.33.1

      * Minio 2025.08.13

      * Wireguard Tools 1.0.20250521

    See the above list for all upgrade details.

    Many thanks to all Macaroni OS devs and contributors that are the sap of all this.

    Any user that wants to support our work for Macaroni could do this through the Github [Sponsor](https://github.com/sponsors/geaaru) or [Liberapay](https://liberapay.com/geaaru/).
    Thanks.

changelog:
  sort: asc
  groups:
    - title: New packages
      regexp: ".*new.*"
      order: 1
    - title: Reverts
      regexp: '.*Revert.*'
      order: 2
    - title: Packages
      regexp: ".*Bump.*"
      order: 3
    - title: Others
      order: 9999
  filters:
    exclude:
      - '^.github'
      - '^github'
      - '^portage-converter'
      - '^.gorelease'
