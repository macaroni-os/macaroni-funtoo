project_name: Macaroni OS
build:
  skip: true
release:
  header: |
    ## Macaroni OS {{ .Tag }}!

    A new release of Terragon branch is out!

    Macaroni Terragon tree now use the new *mark-xl* branch!

    In evidence:

      * LLVM/CLANG 16.0.6

      * Upx 5.0.0

      * Go 1.22.12, 1.23.7, 1.24.1

      * Gitea 1.23.5

      * Apache 2.4.63

      * Caddy 2.9.1

      * Util-linux 2.40.4

      * OpenSSH 9.9

      * Haproxy 2.9.15

      * Nodejs 20.19.0, 22.14.0

      * OpenVPN 2.6.13

      * Bind 9.20.7

      * Git 2.48.1

      * PostgreSQL 13.20, 16.8

      * MySQL Community 8.0.41

      * Incus 6.10.1

      * Ruby 3.1.5

      * Prometheus 3.2.1

      * Grafana 11.6.0

      * Kubectl 1.32.3

      * Minio 2025.03.12

    See the above list for all upgrade details.

    Many thanks to all Macaroni OS devs and contributors that are the sap of all this.

    Any user that wants to support our work for Macaroni could do this through the Github [Sponsor](https://github.com/sponsors/geaaru).
    Thanks.

changelog:
  sort: asc
  groups:
    - title: New packages
      regexp: ".*new.*"
      order: 1
    - title: Reverts
      regexp: '.*Revert.*'
      order: 2
    - title: Packages
      regexp: ".*Bump.*"
      order: 3
    - title: Others
      order: 9999
  filters:
    exclude:
      - '^.github'
      - '^github'
      - '^portage-converter'
      - '^.gorelease'
