project_name: Macaroni Eagle
build:
  skip: true
release:
  header: |
    ## Macaroni {{ .Tag }}!

    A new release of Macaroni Eagle is out!

    The first release using GLIBC 2.41 with all packages compiled
    with the new `anise-build` tool and a lot of new packages in
    the AI area, Telemetry area and K8s area.

    In evidence:

      * Go 1.25.14, 1.26.11, 1.27.4

      * NodeJS 22.23.5, 24.23.3a

      * Bind 9.21.25

      * Strongswan 6.1.0

      * OpenVPN 2.7.9

      * Tor 0.4.9.15

      * Coreutils 9.12

      * Upx (Upstream) 5.3.0

      * Docker 29.9.1

      * LXD 6.10.1

      * QEmu 10.2.2

      * Incus 7.6.0

      * Alert Manager (Upstream) 0.35.1

      * Rust 1.96.1

      * Erlang 28.5.0.6

      * Zig (Upstream) 0.17.0

      * OpenSSL 3.0.22

      * Cryptography 50.0.2

      * CoreDNS 1.14.7

      * Nftables 1.1.7

      * Silo 2026.09.16 (Replace minio)

      * Rclone 1.76.0

      * Shadow 4.20.3

      * Caddy 2.11.7

      * Grafana (Upstream) 13.3.2

      * Backrest 1.14.1

      * Prometheus (Upstream) 3.16.0

    See the above list for all upgrade details.

    Many thanks to all Macaroni OS devs and contributors that are the sap of all this.

    Enjoy!

    Any user that wants to support our work for Macaroni could do this through the Github [Sponsor](https://github.com/sponsors/geaaru) or [Liberapay](https://liberapay.com/geaaru/).

changelog:
  sort: asc
  groups:
    - title: New packages
      regexp: ".*new.*"
      order: 1
    - title: Reverts
      regexp: '.*Revert.*'
      order: 3
    - title: Packages
      regexp: ".*Bump.*"
      order: 2
    - title: Others
      order: 9999
  filters:
    exclude:
      - '^.github'
      - '^github'
      - '^portage-converter'
      - '^.gorelease'
