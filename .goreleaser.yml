project_name: Macaroni Funtoo
build:
  skip: true
release:
  header: |
    ## Macaroni OS {{ .Tag }}!

    A new release of Phoenix branch is out!!

    This release signs another important step of the Macaroni OS story.
    The release 25.06 is now based on `mark-iii`. The M.A.R.K. stack is
    born as independent tree under the Macaroni Organization's umbrella.

    A lot is been done in this year over the MARK stack and this is the
    reason of the delay of this release. We hope that this reborn of the
    Phoenix will give us more power and fun to evolve.

    There are importants news of this upgrade as the migration to GCC 12.3.0
    and LLVM 16. Due to this change the full tree is been rebuilt.
    We suggest to follow the steps described in our website for the upgrade.

    A lot must be done yet but we hope with the help of the contributors
    and with donations the project will be an important alternative to the
    existing distros.

    In evidence:

      * GCC 12.3.0

      * LLVM 16.0.6

      * Incus 6.12

      * Virtualbox 7.1.8.168469

      * PHP 8.2.28, 8.1.32

      * Go 1.22.12, 1.23.8, 1.24.2

      * Nodejs 20.19.1, 22.14.0

      * Python 3.9.21

      * ZFS 2.3.0

      * Blender 4.4.3

      * Grafana 12.0.0

      * Prometheus 3.4.0

      * Gitea 1.23.8

      * Apache 2.4.63

      * Nginx 1.26.2

      * Minio 2025.04.22

      * Bind 9.20.7

      * Qt 5.15.16, 6.8.3

      * Xorg 21.1.16

      * Iptables 1.8.11

      * Nftables 1.1.1

      * Iproute2 6.13.0

      * Flatpak 1.16.1

      * Util-Linux 2.40.4

      * Brave 1.78.97

      * Firefox 135.0

      * Google Chrome 136.0.7103.113

      * libSDL 3.2.10

      * Deno 2.2.11

    See the above list for all upgrade details.

    Enjoy!

changelog:
  sort: asc
  groups:
    - title: New packages
      regexp: ".*new.*"
      order: 1
    - title: Packages
      regexp: ".*Bump.*"
      order: 2
    - title: Reverts
      regexp: '^Revert.*'
      order: 3
    - title: Others
      order: 9999
  filters:
    exclude:
      - '^.github'
      - '^github'
      - '^portage-converter'
      - '^.gorelease'
