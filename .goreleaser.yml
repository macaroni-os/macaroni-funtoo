project_name: Macaroni OS
build:
  skip: true
release:
  header: |
    ## Macaroni OS {{ .Tag }}!

    A new release of Terragon branch is out!

    In evidence:

      * QEMU 10.2.0

      * Go 1.25.7

      * Nodejs 22.22.0

      * Bind 9.21.17

      * Prometheus 3.9.1

      * Grafana 12.3.3

      * Forgejo 14.0.2

      * Gogs 0.14.1

      * Portage 4.0.2

      * Shadow 4.19.3

      * Coreutils 9.10

      * OpenVPN 2.7.0

      * BackRest 1.11.2

      * CoreDNS 1.14.0

      * Rclone 1.73.1

      * Upx 5.1.0

      * Ollama 0.15.6

      * Urllib3 2.6.3 - CVE-2026-21441, CVE-2025-66418, CVE-2025-66471

    See the above list for all upgrade details.

    Many thanks to all Macaroni OS devs and contributors that are the sap of all this.

    Any user that wants to support our work for Macaroni could do this through the Github [Sponsor](https://github.com/sponsors/geaaru) or [Liberapay](https://liberapay.com/geaaru/).
    Thanks.

changelog:
  sort: asc
  groups:
    - title: New packages
      regexp: ".*new.*"
      order: 1
    - title: Reverts
      regexp: '.*Revert.*'
      order: 2
    - title: Packages
      regexp: ".*Bump.*"
      order: 3
    - title: Others
      order: 9999
  filters:
    exclude:
      - '^.github'
      - '^github'
      - '^portage-converter'
      - '^.gorelease'
