project_name: Macaroni OS
build:
  skip: true
release:
  header: |
    ## Macaroni OS {{ .Tag }}!

    A new release of Terragon branch is out!

    In evidence:

      * LLVM/CLANG 20.1.8

      * Go 1.24.11, 1.25.5

      * Nodejs 22.21.1, 20.19.6

      * CMake 3.31.9

      * Bind 9.21.15

      * Prometheus 3.8.1

      * Grafana 12.3.1

      * Forgejo 13.0.3

      * Gitea 1.25.3

      * OpenSSH 10.2

      * OpenVPN 2.6.17

      * Zig-Big 0.15.2

      * BackRest 1.10.1

      * CoreDNS 1.13.2

      * Rclone 1.72.1

      * Urllib3 2.6.2 - CVE-2025-66418, CVE-2025-66471

    See the above list for all upgrade details.

    Many thanks to all Macaroni OS devs and contributors that are the sap of all this.

    Any user that wants to support our work for Macaroni could do this through the Github [Sponsor](https://github.com/sponsors/geaaru) or [Liberapay](https://liberapay.com/geaaru/).
    Thanks.

changelog:
  sort: asc
  groups:
    - title: New packages
      regexp: ".*new.*"
      order: 1
    - title: Reverts
      regexp: '.*Revert.*'
      order: 2
    - title: Packages
      regexp: ".*Bump.*"
      order: 3
    - title: Others
      order: 9999
  filters:
    exclude:
      - '^.github'
      - '^github'
      - '^portage-converter'
      - '^.gorelease'
