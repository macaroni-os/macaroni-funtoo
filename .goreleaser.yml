project_name: Macaroni Eagle
build:
  skip: true
release:
  header: |
    ## Macaroni {{ .Tag }}!

    A new release of Macaroni Eagle is out!

    This release migrate to LLVM/CLANG 20 and it's the
    last release using OpenSSL 1.1.

    In evidence:

      * LLVM/CLANG 20

      * Go 1.24.11, 1.25.5

      * NodeJS 22.21.1

      * Bind 9.21.15

      * Strongswan 6.0.4

      * OpenSSH 10.2p1

      * OpenVPN 2.6.17

      * Tor 0.4.8.21

      * CMake 3.31.9

      * Meson 1.7.2

      * Ninja 1.13.1

      * Backrest 1.10.1

      * Cryptography 46.0.3

      * Zig (Upstream) 0.15.2

      * Prometheus 3.9.1

      * Grafana 12.3.1

      * CoreDNS 1.14.0

      * Upx (Upstream) 5.0.2

    Security fixes:
    * CVE-2025-66418 (urlib3 2.6.0)
    * CVE-2025-66471 (urlib3 2.6.0)
    * CVE-2025-61729 (Go <1.24.11)
    * CVE-2025-61727 (Go <1.24.11)

    See the above list for all upgrade details.

    Many thanks to all Macaroni OS devs and contributors that are the sap of all this.

    Enjoy!

    Any user that wants to support our work for Macaroni could do this through the Github [Sponsor](https://github.com/sponsors/geaaru) or [Liberapay](https://liberapay.com/geaaru/).

changelog:
  sort: asc
  groups:
    - title: New packages
      regexp: ".*new.*"
      order: 1
    - title: Reverts
      regexp: '.*Revert.*'
      order: 3
    - title: Packages
      regexp: ".*Bump.*"
      order: 2
    - title: Others
      order: 9999
  filters:
    exclude:
      - '^.github'
      - '^github'
      - '^portage-converter'
      - '^.gorelease'
