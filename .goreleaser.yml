project_name: Macaroni OS
build:
  skip: true
release:
  header: |
    ## Macaroni OS {{ .Tag }}!

    A new release of Terragon branch is out!

    Terragon is now been migrated to Openssl 3.0!

    In evidence:

      * Nodejs 20.20.2, 22.22.2

      * Go 1.24.13, 1.25.9, 1.26.2

      * RClone 1.74.1

      * OpenSSH 10.2

      * Minio 2026.04.17 (Pgsty Fork)

      * CoreDNS 1.14.2

      * Grafana 13.0.1

      * Prometheus 3.12.0

      * Caddy 2.11.3

      * Bind 9.21.21

      * Incus 6.23

      * LXD 6.7

      * LXC 6.0.6

      * MySQL Community 8.0.45

      * Backrest 1.13.0

      * Forgejo 15.0.2

    See the above list for all upgrade details.

    Many thanks to all Macaroni OS devs and contributors that are the sap of all this.

    Any user that wants to support our work for Macaroni could do this through the Github [Sponsor](https://github.com/sponsors/geaaru) or [Liberapay](https://liberapay.com/geaaru/).
    Thanks.

changelog:
  sort: asc
  groups:
    - title: New packages
      regexp: ".*new.*"
      order: 1
    - title: Reverts
      regexp: '.*Revert.*'
      order: 2
    - title: Packages
      regexp: ".*Bump.*"
      order: 3
    - title: Others
      order: 9999
  filters:
    exclude:
      - '^.github'
      - '^github'
      - '^portage-converter'
      - '^.gorelease'
