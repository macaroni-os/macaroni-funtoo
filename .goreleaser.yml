project_name: Macaroni OS
build:
  skip: true
release:
  header: |
    ## Macaroni OS {{ .Tag }}!

    A new release of Terragon branch is out!

    Patch release with security fix.

    In evidence:

      * Go 1.26.4

      * Cryptography 46.0.7

      * Iptables 1.8.13

      * Minio 2026.06.18 (Pgsty Fork)

      * Tor 0.4.9.8

      * Upx 5.2.0 (upstream binary)

      * Ollama 0.30.8

      * llama-cpp 0.0.9628

    Security notices:

      * CVE-2026-42499 (Go <1.24.3)
      * CVE-2026-33811 (Go <1.24.3)
      * CVE-2026-33814 (Go <1.24.3)
      * CVE-2026-39820 (Go <1.24.3)
      * CVE-2026-39836 (Go <1.24.3)
      * CVE-2026-42504 (Go <1.24.3)
      * CVE-2026-27145 (Go <1.24.3)
      * CVE-2026-39823 (Go <1.24.3)
      * CVE-2026-39826 (Go <1.24.3)
      * CVE-2026-42507 (Go <1.24.3)
      * CVE-2026-39825 (Go <1.24.3)
      * CVE-2026-39892 (Cryptography <46.0.7)

    See the above list for all upgrade details.

    Many thanks to all Macaroni OS devs and contributors that are the sap of all this.

    Any user that wants to support our work for Macaroni could do this through the Github [Sponsor](https://github.com/sponsors/geaaru) or [Liberapay](https://liberapay.com/geaaru/).
    Thanks.

changelog:
  sort: asc
  groups:
    - title: New packages
      regexp: ".*new.*"
      order: 1
    - title: Reverts
      regexp: '.*Revert.*'
      order: 2
    - title: Packages
      regexp: ".*Bump.*"
      order: 3
    - title: Others
      order: 9999
  filters:
    exclude:
      - '^.github'
      - '^github'
      - '^portage-converter'
      - '^.gorelease'
