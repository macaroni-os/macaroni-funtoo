project_name: Macaroni OS
build:
  skip: true
release:
  header: |
    ## Macaroni OS {{ .Tag }}!

    A new release of Terragon branch is out!

    The first release using GLIBC 2.41 with all packages compiled
    with the new `anise-build` tool.

    In evidence:

      * Go 1.27.3, 1.26.10, 1.25.14

      * Rust 1.96.1

      * Zig 0.17.0 (upstream binary)

      * OpenSSL 3.0.22

      * Cython 3.3.0

      * Cryptography 50.0.2

      * Nftables 1.1.7

      * Bind 9.21.25

      * Nmap 7.993

      * Silo 2026.09.16

      * Nodejs 22.23.4, 24.22.1

      * Tor 0.4.9.15

      * OpenVPN 2.7.8

      * Coreutils 9.12

      * Gitea 28.2.0

      * Gogs 0.14.3

      * Grafana 13.3.0

      * Prometheus 3.15.1

      * Mimir 3.2.4

      * Alloy 1.21.3

      * Loki 3.7.9

      * Incus UI 0.22.0

      * Incus 7.5.1

      * LXD 6.9

      * MariadbDB 10.6.28

      * Upx 5.2.0 (upstream binary)

      * Ollama 0.40.13 (without NVIDIA integration)

      * llama-cpp 0.8.0

      * Docker Agent 1.54.0

      * Opencode 2.2.5

      * Pi 1.4.0

      * Backrest 1.14.1

    See the above list for all upgrade details.

    Many thanks to all Macaroni OS devs and contributors that are the sap of all this.

    Any user that wants to support our work for Macaroni could do this through the Github [Sponsor](https://github.com/sponsors/geaaru) or [Liberapay](https://liberapay.com/geaaru/).
    Thanks.

changelog:
  sort: asc
  groups:
    - title: New packages
      regexp: ".*new.*"
      order: 1
    - title: Reverts
      regexp: '.*Revert.*'
      order: 2
    - title: Packages
      regexp: ".*Bump.*"
      order: 3
    - title: Others
      order: 9999
  filters:
    exclude:
      - '^.github'
      - '^github'
      - '^portage-converter'
      - '^.gorelease'
