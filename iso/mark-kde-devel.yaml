# Repositories packages from repository-index
repository:
  packages:
  - repository/mark
  - repository/macaroni-phoenix-dev
  - repository/macaroni-commons-dev

initramfs:
  kernel_file: "bzImage"
  rootfs_file: "Initrd"

overlay: "true"
image_prefix: "Macaroni-Phoenix-KDE-Mark-0."
image_date: "true"

overlay_hooks:
  - /var/lib/macaroni/build-iso-hook.sh

luet:
  config: conf/luet-devel.yaml
