name: mariadb-connector-c
version: 3.4.8+1
category: dev-db
use_flags:
- -gnutls
- -kerberos
- curl
- ssl
requires:
- name: curl
  version: '>=0'
  category: net-misc
- name: zlib
  version: '>=0'
  category: sys-libs
- name: libiconv
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: C client library for MariaDB/MySQL
uri:
- https://mariadb.org/
license: LGPL-2.1+
labels:
  BDEPEND: dev-util/ninja dev-util/cmake
  DEPEND: sys-libs/zlib:= virtual/libiconv:= curl? ( net-misc/curl:= ) kerberos? (
    || ( app-crypt/mit-krb5 app-crypt/heimdal ) ) ssl? ( gnutls? ( net-libs/gnutls:=
    ) !gnutls? ( dev-libs/openssl:= ) )
  IUSE: +curl gnutls kerberos +ssl static-libs
  RDEPEND: sys-libs/zlib:= virtual/libiconv:= curl? ( net-misc/curl:= ) kerberos?
    ( || ( app-crypt/mit-krb5 app-crypt/heimdal ) ) ssl? ( gnutls? ( net-libs/gnutls:=
    ) !gnutls? ( dev-libs/openssl:= ) )
  emerge.packages: dev-db/mariadb-connector-c
  kit: core-server-kit
  original.package.name: dev-db/mariadb-connector-c
  original.package.slot: "0"
  original.package.version: 3.4.8
