annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Vim, an improved vi-style text editor
uri:
- http://www.vim.org/ https://github.com/vim/vim
license: vim
