name: ntp
version: 4.2.8+4
category: net-misc
use_flags:
- -caps
- -kernel_linux
- -libressl
- -openntpd
- -parse-clocks
- -selinux
- -snmp
- -vim-syntax
- -zeroconf
- readline
- ssl
requires:
- name: libevent
  version: '>=0'
  category: dev-libs
- name: readline
  version: '>=0'
  category: sys-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Network Time Protocol suite/programs
uri:
- http://www.ntp.org/
license: HPND BSD ISC
labels:
  BDEPEND: '>=app-portage/elt-patches-20170815 || ( >=sys-devel/automake-1.16.5:1.16
    ) >=sys-devel/autoconf-2.71 >=sys-devel/libtool-2.4 virtual/pkgconfig'
  DEPEND: readline? ( sys-libs/readline:= ) dev-libs/libevent:=[threads?] caps? (
    sys-libs/libcap ) zeroconf? ( net-dns/avahi[mdnsresponder-compat] ) snmp? ( net-analyzer/net-snmp
    ) ssl? ( dev-libs/openssl:= ) parse-clocks? ( net-misc/pps-tools ) virtual/pkgconfig
    sys-apps/shadow
  IUSE: caps debug ipv6 ntp-cron parse-clocks readline samba snmp ssl +threads vim-syntax
    zeroconf
  RDEPEND: readline? ( sys-libs/readline:= ) dev-libs/libevent:=[threads?] caps? (
    sys-libs/libcap ) zeroconf? ( net-dns/avahi[mdnsresponder-compat] ) snmp? ( net-analyzer/net-snmp
    ) ssl? ( dev-libs/openssl:= ) parse-clocks? ( net-misc/pps-tools ) vim-syntax?
    ( app-vim/ntp-syntax )
  emerge.packages: net-misc/ntp
  kit: net-kit
  original.package.name: net-misc/ntp
  original.package.slot: "0"
  original.package.version: 4.2.8_p18
