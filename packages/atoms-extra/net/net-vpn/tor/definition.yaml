    lzma? ( app-arch/xz-utils ) seccomp? ( sys-libs/libseccomp ) zstd? ( app-arch/zstd
    ) app-text/asciidoc sys-apps/shadow
  IUSE: caps lzma seccomp selinux tor-hardening zstd
  RDEPEND: dev-libs/libevent[ssl] sys-libs/zlib caps? ( sys-libs/libcap ) dev-libs/openssl
    lzma? ( app-arch/xz-utils ) seccomp? ( sys-libs/libseccomp ) zstd? ( app-arch/zstd
    )
  emerge.packages: net-vpn/tor
  kit: net-kit
  original.package.name: net-vpn/tor
  original.package.slot: "0"
  original.package.version: 0.4.9.6
