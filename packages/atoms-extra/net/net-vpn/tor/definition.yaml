name: tor
version: 0.4.9.6+1
category: net-vpn
use_flags:
- -seccomp
- caps
- lzma
- zstd
requires:
- name: zstd
  version: '>=0'
  category: app-arch
- name: libevent
  version: '>=0'
  category: dev-libs
- name: libcap
  version: '>=0'
  category: sys-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Anonymizing overlay network for TCP
uri:
- https://torproject.org
license: BSD GPL-2
labels:
