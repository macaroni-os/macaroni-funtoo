name: lxc
version: 6.0.6
category: app-emulation
use_flags:
- -apparmor
- -io-uring
- -man
- -selinux
- -static
- -systemd
- caps
- pam
- seccomp
- ssl
- caps
requires:
- name: openssl
  version: '>=0'
  category: dev-libs
- name: libcap
  version: '>=0'
  category: sys-libs
- name: libseccomp
  version: '>=0'
  category: sys-libs
- name: pam
  version: '>=0'
  category: sys-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: A userspace interface for the Linux kernel containment features
uri:
- https://linuxcontainers.org/ https://github.com/lxc/lxc
license: GPL-2 LGPL-2.1 LGPL-3
labels:
  BDEPEND: virtual/pkgconfig dev-lang/python man? ( app-text/docbook2K ) >=dev-util/meson-0.48.2
    >=dev-util/ninja-1.7.2 virtual/pkgconfig
  DEPEND: sys-libs/libcap apparmor? ( sys-libs/libapparmor ) caps? ( static? ( sys-libs/libcap[static-libs]
    ) !static? ( sys-libs/libcap ) ) io-uring? ( sys-libs/liburing:= ) pam? ( sys-libs/pam
    ) seccomp? ( sys-libs/libseccomp ) ssl? ( dev-libs/openssl:= ) systemd? ( sys-apps/systemd:=
    ) sys-apps/dbus sys-kernel/linux-headers apparmor? ( sys-apps/apparmor )
  IUSE: apparmor +caps examples io-uring man pam seccomp +ssl systemd +tools +static
    tools-multicall lto
  RDEPEND: sys-libs/libcap apparmor? ( sys-libs/libapparmor ) caps? ( static? ( sys-libs/libcap[static-libs]
    ) !static? ( sys-libs/libcap ) ) io-uring? ( sys-libs/liburing:= ) pam? ( sys-libs/pam
    ) seccomp? ( sys-libs/libseccomp ) ssl? ( dev-libs/openssl:= ) systemd? ( sys-apps/systemd:=
    ) sys-apps/dbus
  emerge.packages: app-emulation/lxc
  kit: core-server-kit
  original.package.name: app-emulation/lxc
  original.package.slot: "0"
  original.package.version: 6.0.6
