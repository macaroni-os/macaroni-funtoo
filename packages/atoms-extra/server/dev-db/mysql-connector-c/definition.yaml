name: mysql-connector-c
version: 9.7.0
category: dev-db
use_flags:
- -ldap
- -libressl
- ssl
requires:
- name: openssl
  version: '>=0'
  category: dev-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: C client library for MariaDB/MySQL
uri:
- https://dev.mysql.com/downloads/
license: GPL-2
labels:
  BDEPEND: dev-util/ninja >=dev-util/cmake-3.9.6
  DEPEND: sys-libs/zlib:= ldap? ( dev-libs/cyrus-sasl:= ) dev-libs/openssl:=
  IUSE: ldap static-libs
  RDEPEND: sys-libs/zlib:= ldap? ( dev-libs/cyrus-sasl:= ) dev-libs/openssl:=
  emerge.packages: dev-db/mysql-connector-c
  kit: dev-kit
  original.package.name: dev-db/mysql-connector-c
  original.package.slot: "0"
  original.package.version: 9.7.0
