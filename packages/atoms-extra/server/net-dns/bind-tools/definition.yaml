name: bind-tools
version: 9.21.15+1
category: net-dns
use_flags:
- -gssapi
- -idn
- -libedit
- readline
- xml
requires:
- name: libuv
  version: '>=0'
  category: dev-libs
- name: libxml2
  version: '>=0'
  category: dev-libs-2
- name: openssl
  version: '>=0'
  category: dev-libs
- name: userspace-rcu
  version: '>=0'
  category: dev-libs
- name: libcap
  version: '>=0'
  category: sys-libs
- name: jemalloc
  version: '>=0'
  category: dev-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: 'bind tools: dig, nslookup, host, nsupdate, dnssec-keygen'
uri:
- https://www.isc.org/software/bind
license: Apache-2.0 BSD BSD-2 GPL-2 HPND ISC MPL-2.0
labels:
  BDEPEND: virtual/pkgconfig >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: dev-libs/libuv:= dev-libs/openssl dev-libs/userspace-rcu sys-libs/libcap
    xml? ( dev-libs/libxml2 ) idn? ( net-dns/libidn2:= ) gssapi? ( virtual/krb5 )
    libedit? ( dev-libs/libedit ) !libedit? ( readline? ( sys-libs/readline:= ) )
  IUSE: caps gssapi idn ipv6 libedit readline xml
  RDEPEND: dev-libs/libuv:= dev-libs/openssl dev-libs/userspace-rcu sys-libs/libcap
    xml? ( dev-libs/libxml2 ) idn? ( net-dns/libidn2:= ) gssapi? ( virtual/krb5 )
    libedit? ( dev-libs/libedit ) !libedit? ( readline? ( sys-libs/readline:= ) )
    !<=net-dns/bind-9.18.1-r2
  emerge.packages: net-dns/bind-tools
  kit: net-kit
  original.package.name: net-dns/bind-tools
  original.package.slot: "0"
  original.package.version: 9.21.15
