name: polkit
version: 126+1
category: sys-auth
use_flags:
- -selinux
- -spidermonkey
- elogind
- introspection
- pam
requires:
- name: duktape
  version: '>=0'
  category: dev-lang
- name: expat
  version: '>=0'
  category: dev-libs
- name: glib
  version: '>=0'
  category: dev-libs-2
- name: elogind
  version: '>=0'
  category: sys-auth
- name: pambase
  version: '>=0'
  category: sys-auth
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Policy framework for controlling privileges for system-wide services
uri:
- https://www.freedesktop.org/wiki/Software/polkit https://gitlab.freedesktop.org/polkit/polkit
license: LGPL-2
labels:
  BDEPEND: app-text/docbook-xml-dtd:4.1.2 app-text/docbook-xsl-stylesheets dev-libs/gobject-introspection-common
    dev-libs/libxslt sys-devel/gettext virtual/pkgconfig introspection? ( dev-libs/gobject-introspection
    ) >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2 virtual/pkgconfig
  DEPEND: dev-lang/duktape dev-libs/glib:2 dev-libs/expat elogind? ( sys-auth/elogind
    ) !elogind? ( sys-apps/systemd ) pam? ( sys-auth/pambase sys-libs/pam ) sys-apps/shadow
  IUSE: +elogind examples gtk +introspection kde pam
  RDEPEND: dev-lang/duktape dev-libs/glib:2 dev-libs/expat elogind? ( sys-auth/elogind
    ) !elogind? ( sys-apps/systemd ) pam? ( sys-auth/pambase sys-libs/pam )
  emerge.packages: sys-auth/polkit
  kit: security-kit
  original.package.name: sys-auth/polkit
  original.package.slot: "0"
  original.package.version: "126"
