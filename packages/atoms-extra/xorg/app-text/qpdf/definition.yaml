name: qpdf
version: 12.3.2
category: app-text
use_flags:
- -perl
- -test
requires:
- name: zlib
  version: '>=0'
  category: sys-libs
- name: jpeg
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Command-line tool for structural, content-preserving transformation of
  PDF files
uri:
- http://qpdf.sourceforge.net/
license: '|| ( Apache-2.0 Artistic-2 )'
labels:
  BDEPEND: dev-lang/perl doc? ( app-arch/unzip ) dev-util/ninja dev-util/cmake
  DEPEND: media-libs/libjpeg-turbo:= sys-libs/zlib gnutls? ( net-libs/gnutls:= ) !gnutls?
    ( dev-libs/openssl:= ) zopfli? ( app-arch/zopfli:= )
  IUSE: doc examples gnutls zopfli
  RDEPEND: media-libs/libjpeg-turbo:= sys-libs/zlib gnutls? ( net-libs/gnutls:= )
    !gnutls? ( dev-libs/openssl:= ) zopfli? ( app-arch/zopfli:= )
  emerge.packages: app-text/qpdf
  kit: text-kit
  original.package.name: app-text/qpdf
  original.package.slot: "0"
  original.package.version: 12.3.2
