name: codex
version: 0.172.0+1
category: app-ai
use_flags:
- -voice
requires:
- name: openssl
  version: '>=0'
  category: dev-libs
- name: bubblewrap
  version: '>=0'
  category: sys-apps
- name: ripgrep-bin
  version: '>=0'
  category: sys-apps
conflicts:
- name: codex-bin
  version: '>=0'
  category: app-ai
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: OpenAI's Codex CLI coding agent
uri:
- https://github.com/openai/codex
license: Apache-2.0
labels:
  BDEPEND: '>=virtual/rust-1.96 dev-libs/openssl virtual/pkgconfig sys-libs/zlib sys-apps/coreutils'
  DEPEND: '!app-ai/codex-bin dev-libs/openssl sys-libs/zlib voice? ( media-libs/gstreamer
    media-libs/gst-plugins-good media-libs/gst-plugins-bad[opus] ) || ( sys-apps/ripgrep-bin
    sys-apps/ripgrep ) sys-apps/bubblewrap'
  IUSE: voice
  RDEPEND: '!app-ai/codex-bin dev-libs/openssl sys-libs/zlib voice? ( media-libs/gstreamer
    media-libs/gst-plugins-good media-libs/gst-plugins-bad[opus] ) || ( sys-apps/ripgrep-bin
    sys-apps/ripgrep ) sys-apps/bubblewrap'
  emerge.packages: app-ai/codex
  kit: ai-kit
  original.package.name: app-ai/codex
  original.package.slot: "0"
  original.package.version: 0.172.0
