    virtual/pkgconfig
  IUSE: +utils
  RDEPEND: app-admin/whip sys-apps/whip-catalog dev-libs/nspr dev-db/sqlite sys-libs/zlib
    virtual/pkgconfig
  emerge.packages: dev-libs/nss
  kit: dev-kit
  original.package.name: dev-libs/nss
  original.package.slot: "0"
  original.package.version: "3.120"
