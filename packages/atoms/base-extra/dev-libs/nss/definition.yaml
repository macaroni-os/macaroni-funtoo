name: nss
version: "3.120"
category: dev-libs
requires:
- name: sqlite
  version: '>=0'
  category: dev-db-3
- name: nspr
  version: '>=0'
  category: dev-libs
- name: pkgconfig
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
