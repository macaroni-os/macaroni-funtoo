name: eudev
version: 3.2.14+2
category: sys-fs
use_flags:
- -introspection
- -selinux
- -test
- kmod
requires:
- name: kmod
  version: '>=0'
  category: sys-apps
- name: util-linux
  version: '>=0'
  category: sys-apps
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Linux dynamic and persistent device naming support (aka userspace devfs)
uri:
- https://github.com/gentoo/eudev
license: LGPL-2.1 MIT GPL-2
labels:
  BDEPEND: '>=app-portage/elt-patches-20170815 || ( >=sys-devel/automake-1.16.5:1.16
    ) >=sys-devel/autoconf-2.71 >=sys-devel/libtool-2.4'
  DEPEND: sys-apps/util-linux introspection? ( dev-libs/gobject-introspection:= )
    kmod? ( sys-apps/kmod ) !sys-apps/gentoo-systemd-integration !sys-apps/systemd
    dev-util/gperf virtual/os-headers virtual/pkgconfig sys-devel/make sys-kernel/linux-headers
    dev-util/intltool sys-apps/shadow
  IUSE: +hwdb +kmod introspection +rule-generator static-libs
  RDEPEND: sys-apps/util-linux introspection? ( dev-libs/gobject-introspection:= )
    kmod? ( sys-apps/kmod ) !sys-apps/gentoo-systemd-integration !sys-apps/systemd
    !sys-fs/udev !sys-apps/systemd !sys-fs/udev-init-scripts
  emerge.packages: sys-fs/eudev
  kit: core-server-kit
  original.package.name: sys-fs/eudev
  original.package.slot: "0"
  original.package.version: 3.2.14
