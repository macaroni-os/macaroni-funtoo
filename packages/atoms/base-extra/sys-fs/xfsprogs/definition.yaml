name: xfsprogs
version: 6.14.0+2
category: sys-fs
use_flags:
- -libedit
- icu
- nls
requires:
- name: icu
  version: '>=0'
  category: dev-libs
- name: inih
  version: '>=0'
  category: dev-libs
- name: userspace-rcu
  version: '>=0'
  category: dev-libs
- name: util-linux
  version: '>=0'
  category: sys-apps
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: xfs filesystem utilities
uri:
- https://xfs.wiki.kernel.org/
license: LGPL-2.1
labels:
  BDEPEND: virtual/pkgconfig
  DEPEND: '>=sys-apps/util-linux-2.17.2 icu? ( dev-libs/icu:= ) libedit? ( dev-libs/libedit
    ) dev-libs/inih dev-libs/userspace-rcu !<sys-fs/xfsdump-3 nls? ( sys-devel/gettext
    )'
  IUSE: icu libedit nls static-libs +split-usr
  RDEPEND: '>=sys-apps/util-linux-2.17.2 icu? ( dev-libs/icu:= ) libedit? ( dev-libs/libedit
    ) dev-libs/inih dev-libs/userspace-rcu !<sys-fs/xfsdump-3'
  emerge.packages: sys-fs/xfsprogs
  kit: core-server-kit
  original.package.name: sys-fs/xfsprogs
  original.package.slot: "0"
  original.package.version: 6.14.0
