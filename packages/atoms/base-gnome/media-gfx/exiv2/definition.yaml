name: exiv2
version: 0.28.5+1
category: media-gfx
use_flags:
- -doc
- -webready
- nls
- png
- xmp
requires:
- name: expat
  version: '>=0'
  category: dev-libs
- name: zlib
  version: '>=0'
  category: sys-libs
- name: libiconv
  version: '>=0'
  category: virtual
- name: libintl
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: EXIF, IPTC and XMP metadata C++ library and command line utility
uri:
- https://www.exiv2.org/
license: GPL-2
labels:
  BDEPEND: doc? ( || ( dev-lang/python:3.8 dev-lang/python:3.9 dev-lang/python:3.7
    dev-lang/python:3.10 ) app-doc/doxygen dev-libs/libxslt media-gfx/graphviz virtual/pkgconfig
    ) nls? ( sys-devel/gettext ) dev-libs/inih app-arch/brotli dev-util/ninja dev-util/cmake
  IUSE: +bmff doc examples nls +png webready +xmp
  RDEPEND: '>=virtual/libiconv-0-r1 nls? ( >=virtual/libintl-0-r1 ) png? ( sys-libs/zlib
    ) webready? ( >net-libs/libssh-0.9.1[sftp] net-misc/curl ) xmp? ( dev-libs/expat
    )'
  emerge.packages: media-gfx/exiv2
  kit: media-kit
  original.package.name: media-gfx/exiv2
  original.package.slot: "0"
  original.package.version: 0.28.5
