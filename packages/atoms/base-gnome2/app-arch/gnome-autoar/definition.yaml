name: gnome-autoar
version: 0.4.5+1
category: app-arch
use_flags:
- -gtk-doc
- gtk
- introspection
- vala
requires:
- name: libarchive
  version: '>=0'
  category: app-arch
- name: gobject-introspection
  version: '>=0'
  category: dev-libs
- name: gtk+
  version: '>=0'
  category: x11-libs-3
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Automatic archives creating and extracting library
uri:
- https://gitlab.gnome.org/GNOME/gnome-autoar
license: LGPL-2.1+
labels:
  BDEPEND: virtual/pkgconfig gtk-doc? ( dev-util/gtk-doc app-text/docbook-xml-dtd:4.3
    ) vala? ( || ( dev-lang/vala:0.56 dev-lang/vala:0.54 dev-lang/vala:0.52 dev-lang/vala:0.50
    dev-lang/vala:0.48 dev-lang/vala:0.46 dev-lang/vala:0.44 dev-lang/vala:0.42 dev-lang/vala:0.40
    dev-lang/vala:0.36 ) ) >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: app-arch/libarchive:= dev-libs/glib:2 gtk? ( x11-libs/gtk+:3[introspection?]
    ) introspection? ( dev-libs/gobject-introspection:= )
  IUSE: gtk gtk-doc +introspection vala
  RDEPEND: app-arch/libarchive:= dev-libs/glib:2 gtk? ( x11-libs/gtk+:3[introspection?]
    ) introspection? ( dev-libs/gobject-introspection:= )
  emerge.packages: app-arch/gnome-autoar
  kit: gnome-kit
  original.package.name: app-arch/gnome-autoar
  original.package.slot: "0"
  original.package.version: 0.4.5
