name: appstream
version: 1.0.6+1
category: dev-libs
use_flags:
- -doc
- -systemd
- compose
- introspection
- qt
- vala
requires:
- name: zstd
  version: '>=0'
  category: app-arch
- name: libxml2
  version: '>=0'
  category: dev-libs-2
- name: libxmlb
  version: '>=0'
  category: dev-libs
- name: libyaml
  version: '>=0'
  category: dev-libs
- name: librsvg
  version: '>=0'
  category: gnome-base-2
- name: curl
  version: '>=0'
  category: net-misc
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Cross-distro effort for providing metadata for software in the Linux
  ecosystem
uri:
- https://www.freedesktop.org/wiki/Distributions/AppStream/
license: LGPL-2.1+ GPL-2+
labels:
  BDEPEND: app-text/docbook-xsl-stylesheets dev-libs/appstream-glib dev-libs/libxslt
    dev-util/gperf dev-util/itstool sys-devel/gettext doc? ( app-text/docbook-xml-dtd:4.5
    ) vala? ( || ( dev-lang/vala:0.56 dev-lang/vala:0.54 dev-lang/vala:0.52 dev-lang/vala:0.50
    dev-lang/vala:0.48 dev-lang/vala:0.46 dev-lang/vala:0.44 dev-lang/vala:0.42 dev-lang/vala:0.40
    dev-lang/vala:0.36 ) ) >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: app-arch/zstd:= dev-libs/glib:2 dev-libs/libxml2:= dev-libs/libxmlb:= dev-libs/libyaml
    dev-libs/snowball-stemmer:= net-misc/curl compose? ( dev-libs/glib:2 dev-libs/libyaml
    gnome-base/librsvg media-libs/fontconfig:1.0 media-libs/freetype:2 x11-libs/cairo
    x11-libs/gdk-pixbuf:2 ) introspection? ( dev-libs/gobject-introspection:= ) qt?
    ( || ( dev-qt/qtbase:6 dev-qt/qtcore:5 ) ) systemd? ( sys-apps/systemd:= )
  IUSE: apt compose doc +introspection qt systemd vala
  RDEPEND: app-arch/zstd:= dev-libs/glib:2 dev-libs/libxml2:= dev-libs/libxmlb:= dev-libs/libyaml
    dev-libs/snowball-stemmer:= net-misc/curl compose? ( dev-libs/glib:2 dev-libs/libyaml
    gnome-base/librsvg media-libs/fontconfig:1.0 media-libs/freetype:2 x11-libs/cairo
    x11-libs/gdk-pixbuf:2 ) introspection? ( dev-libs/gobject-introspection:= ) qt?
    ( || ( dev-qt/qtbase:6 dev-qt/qtcore:5 ) ) systemd? ( sys-apps/systemd:= )
  emerge.packages: dev-libs/appstream
  kit: dev-kit
  original.package.name: dev-libs/appstream
  original.package.slot: "0"
  original.package.version: 1.0.6
