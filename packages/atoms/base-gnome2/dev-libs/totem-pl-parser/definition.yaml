name: totem-pl-parser
version: 3.26.6+1
category: dev-libs
use_flags:
- -gtk-doc
- archive
- crypt
- introspection
- uchardet
requires:
- name: libarchive
  version: '>=0'
  category: app-arch
- name: uchardet
  version: '>=0'
  category: app-i18n
- name: gobject-introspection
  version: '>=0'
  category: dev-libs
- name: libgcrypt
  version: '>=0'
  category: dev-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Playlist parsing library
uri:
- https://developer.gnome.org/totem-pl-parser/stable/
license: LGPL-2.1+
labels:
  BDEPEND: gtk-doc? ( dev-util/gtk-doc app-text/docbook-xml-dtd:4.3 ) sys-devel/gettext
    virtual/pkgconfig >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: dev-libs/glib:2 archive? ( app-arch/libarchive:= ) dev-libs/libxml2:= crypt?
    ( dev-libs/libgcrypt:= ) uchardet? ( app-i18n/uchardet ) introspection? ( dev-libs/gobject-introspection:=
    )
  IUSE: archive crypt gtk-doc +introspection +uchardet
  RDEPEND: dev-libs/glib:2 archive? ( app-arch/libarchive:= ) dev-libs/libxml2:= crypt?
    ( dev-libs/libgcrypt:= ) uchardet? ( app-i18n/uchardet ) introspection? ( dev-libs/gobject-introspection:=
    )
  emerge.packages: dev-libs/totem-pl-parser
  kit: gnome-kit
  original.package.name: dev-libs/totem-pl-parser
  original.package.slot: "0"
  original.package.version: 3.26.6
