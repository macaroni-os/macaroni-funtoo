name: gnome-keyring
version: "48.0"
category: gnome-base
use_flags:
- -selinux
- -test
- filecaps
- pam
- prefix
- ssh-agent
requires:
- name: gcr
  version: '>=0'
  category: app-crypt
- name: gnupg
  version: '>=0'
  category: app-crypt
- name: ca-certificates
  version: '>=0'
  category: app-misc
- name: glib
  version: '>=0'
  category: dev-libs-2
- name: openssh
  version: '>=0'
  category: net-misc
- name: libcap-ng
  version: '>=0'
  category: sys-libs
- name: pam
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Password and keyring managing daemon
uri:
- https://wiki.gnome.org/Projects/GnomeKeyring
license: GPL-2+ LGPL-2+
labels:
  BDEPEND: '>=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2 >=app-portage/elt-patches-20170815
    app-arch/xz-utils'
  DEPEND: dev-libs/glib:2 app-crypt/gcr:=[gtk] dev-libs/libgcrypt:= app-crypt/p11-kit
    app-eselect/eselect-pinentry app-misc/ca-certificates caps? ( sys-libs/libcap-ng
    ) systemd? ( sys-apps/systemd ) ssh-agent? ( net-misc/openssh ) app-text/docbook-xml-dtd:4.3
    dev-libs/libxslt sys-devel/gettext virtual/pkgconfig filecaps? ( sys-libs/libcap
    ) dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: caps pam ssh-agent systemd +filecaps
  RDEPEND: dev-libs/glib:2 app-crypt/gcr:=[gtk] dev-libs/libgcrypt:= app-crypt/p11-kit
    app-eselect/eselect-pinentry app-misc/ca-certificates caps? ( sys-libs/libcap-ng
    ) systemd? ( sys-apps/systemd ) ssh-agent? ( net-misc/openssh )
  emerge.packages: gnome-base/gnome-keyring
  kit: gnome-kit
  original.package.name: gnome-base/gnome-keyring
  original.package.slot: "0"
  original.package.version: "48.0"
