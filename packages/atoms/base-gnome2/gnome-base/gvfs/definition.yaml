name: gvfs
version: 1.58.0+2
category: gnome-base
use_flags:
- -gnome-keyring
- -systemd
- afp
- archive
- bluray
- cdda
- elogind
- fuse
- gnome-online-accounts
- google
- gphoto2
- http
- ios
- mtp
- nfs
- onedrive
- policykit
- samba
- sftp
- udev
- udisks
- zeroconf
- client
requires:
- name: libimobiledevice
  version: '>=0'
  category: app-pda
- name: libplist
  version: '>=0'
  category: app-pda
- name: libcdio-paranoia
  version: '>=0'
  category: dev-libs
- name: libgdata
  version: '>=0'
  category: dev-libs
- name: libbluray
  version: '>=0'
  category: media-libs
- name: libgphoto2
  version: '>=0'
  category: media-libs
- name: libmtp
  version: '>=0'
  category: media-libs
- name: avahi
  version: '>=0'
  category: net-dns
- name: libnfs
  version: '>=0'
  category: net-fs
- name: samba
  version: '>=0'
  category: net-fs
- name: msgraph
  version: '>=0'
  category: net-libs
- name: openssh
  version: '>=0'
  category: net-misc
- name: fuse
  version: '>=0'
  category: sys-fs-3
- name: udisks
  version: '>=0'
  category: sys-fs-2
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Virtual filesystem implementation for GIO
uri:
- https://gitlab.gnome.org/GNOME/gvfs
license: LGPL-2.1+
labels:
  BDEPEND: '>=app-portage/elt-patches-20170815 app-arch/xz-utils >=dev-util/meson-0.48.2
    >=dev-util/ninja-1.7.2 virtual/pkgconfig'
  DEPEND: app-text/docbook-xsl-stylesheets dev-libs/libxslt sys-devel/gettext virtual/pkgconfig
    dev-util/gtk-doc-am dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: afp archive bluray cdda cdr elogind fuse google gnome-keyring gnome-online-accounts
    gphoto2 onedrive +http ios nfs policykit +sftp systemd +udev +udisks zeroconf
    samba +mtp
  RDEPEND: app-crypt/gcr:4= dev-libs/glib:2 sys-apps/dbus dev-libs/libxml2:2 afp?
    ( dev-libs/libgcrypt:0= ) archive? ( app-arch/libarchive:= ) bluray? ( media-libs/libbluray
    ) fuse? ( sys-fs/fuse:3= ) gnome-keyring? ( app-crypt/libsecret ) gnome-online-accounts?
    ( net-libs/gnome-online-accounts:= ) google? ( dev-libs/libgdata:=[crypt,gnome-online-accounts]
    net-libs/gnome-online-accounts:= ) gphoto2? ( media-libs/libgphoto2:= ) http?
    ( dev-libs/libxml2:= net-libs/libsoup:3 ) ios? ( app-pda/libimobiledevice:= app-pda/libplist:=
    ) mtp? ( media-libs/libmtp:= ) nfs? ( net-fs/libnfs ) policykit? ( sys-auth/polkit
    sys-libs/libcap ) samba? ( net-fs/samba[client] ) sftp? ( net-misc/openssh ) systemd?
    ( sys-apps/systemd:0= ) elogind? ( sys-auth/elogind:0= ) udev? ( cdda? ( dev-libs/libcdio-paranoia
    ) virtual/libgudev:= ) onedrive? ( dev-libs/libgdata:=[crypt,gnome-online-accounts]
    net-libs/msgraph ) udisks? ( sys-fs/udisks:2 ) zeroconf? ( net-dns/avahi ) virtual/tmpfiles
  emerge.packages: gnome-base/gvfs
  kit: gnome-kit
  original.package.name: gnome-base/gvfs
  original.package.slot: "0"
  original.package.version: 1.58.0
