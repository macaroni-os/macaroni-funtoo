name: ngtcp2
version: 1.22.0+2
category: net-libs
use_flags:
- gnutls
- ssl
- -openssl
requires:
- name: openssl
  version: '>=0'
  category: dev-libs
- name: gnutls
  version: '>=0'
  category: net-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: ngtcp2 project is an effort to implement IETF QUIC protocol
uri:
- https://nghttp2.org/ngtcp2/
license: MIT
labels:
  BDEPEND: virtual/pkgconfig >=app-portage/elt-patches-20170815 || ( >=sys-devel/automake-1.16.5:1.16
    ) >=sys-devel/autoconf-2.71 >=sys-devel/libtool-2.4
  DEPEND: ssl? ( gnutls? ( net-libs/gnutls:= ) openssl? ( dev-libs/openssl:= ) )
  IUSE: +gnutls openssl +ssl
  RDEPEND: ssl? ( gnutls? ( net-libs/gnutls:= ) openssl? ( dev-libs/openssl:= ) )
  emerge.packages: net-libs/ngtcp2
  kit: net-kit
  original.package.name: net-libs/ngtcp2
  original.package.slot: "0"
  original.package.version: 1.22.0
