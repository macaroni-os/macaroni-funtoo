name: geocode-glib
version: 3.26.4+1
category: sci-geosciences
use_flags:
- -gtk-doc
- introspection
requires:
- name: json-glib
  version: '>=0'
  category: dev-libs
- name: libsoup
  version: '>=0'
  category: net-libs-3
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: GLib helper library for geocoding services
uri:
- https://gitlab.gnome.org/GNOME/geocode-glib
license: LGPL-2+
labels:
  BDEPEND: gtk-doc? ( dev-util/gtk-doc app-text/docbook-xml-dtd:4.3 ) sys-devel/gettext
    virtual/pkgconfig >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: dev-libs/glib:2 dev-libs/json-glib[introspection?] net-libs/libsoup:3[introspection?]
    introspection? ( dev-libs/gobject-introspection:= ) dev-util/desktop-file-utils
    x11-misc/shared-mime-info
  IUSE: gtk-doc +introspection
  RDEPEND: dev-libs/glib:2 dev-libs/json-glib[introspection?] net-libs/libsoup:3[introspection?]
    introspection? ( dev-libs/gobject-introspection:= )
  emerge.packages: sci-geosciences/geocode-glib
  kit: gnome-kit
  original.package.name: sci-geosciences/geocode-glib
  original.package.slot: "0"
  original.package.version: 3.26.4
