name: upower
version: 1.91.1+1
category: sys-power
use_flags:
- -gtk-doc
- introspection
- policykit
requires:
- name: libgudev
  version: '>=0'
  category: dev-libs
- name: dbus
  version: '>=0'
  category: sys-apps
- name: polkit
  version: '>=0'
  category: sys-auth
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: D-Bus abstraction for enumerating power devices, querying history and
  statistics
uri:
- https://upower.freedesktop.org/
license: GPL-2+
labels:
  BDEPEND: app-text/docbook-xsl-stylesheets dev-libs/libxslt dev-util/gdbus-codegen
    sys-devel/gettext gtk-doc? ( dev-util/gtk-doc ) >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
    virtual/pkgconfig virtual/pkgconfig
  DEPEND: dev-libs/glib:2 sys-apps/dbus:= introspection? ( dev-libs/gobject-introspection:=
    ) policykit? ( sys-auth/polkit ) dev-libs/libgudev:= virtual/udev
  IUSE: gtk-doc +introspection policykit
  RDEPEND: dev-libs/glib:2 sys-apps/dbus:= introspection? ( dev-libs/gobject-introspection:=
    ) policykit? ( sys-auth/polkit ) dev-libs/libgudev:= virtual/udev
  emerge.packages: sys-power/upower
  kit: core-hw-kit
  original.package.name: sys-power/upower
  original.package.slot: "0"
  original.package.version: 1.91.1
