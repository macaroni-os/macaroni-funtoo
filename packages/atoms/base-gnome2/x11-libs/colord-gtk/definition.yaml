name: colord-gtk
version: 0.3.1+1
category: x11-libs
use_flags:
- -doc
- -vala
- introspection
requires:
- name: glib
  version: '>=0'
  category: dev-libs-2
- name: gtk
  version: '>=0'
  category: x11-libs-4
- name: gtk+
  version: '>=0'
  category: x11-libs-3
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: GTK support library for colord
uri:
- https://www.freedesktop.org/software/colord/
license: LGPL-3+
labels:
  BDEPEND: dev-libs/libxslt sys-devel/gettext virtual/pkgconfig doc? ( app-text/docbook-xml-dtd:4.1.2
    dev-util/gtk-doc ) app-text/docbook-xsl-ns-stylesheets introspection? ( dev-libs/gobject-introspection:=
    ) vala? ( || ( dev-lang/vala:0.56[vapigen(+)] dev-lang/vala:0.54[vapigen(+)] dev-lang/vala:0.52[vapigen(+)]
    dev-lang/vala:0.50[vapigen(+)] dev-lang/vala:0.48[vapigen(+)] dev-lang/vala:0.46[vapigen(+)]
    dev-lang/vala:0.44[vapigen(+)] dev-lang/vala:0.42[vapigen(+)] dev-lang/vala:0.40[vapigen(+)]
    dev-lang/vala:0.36[vapigen(+)] ) ) >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: dev-libs/glib:2 x11-misc/colord:=[introspection?,vala?] x11-libs/gtk+:3[introspection?]
    x11-libs/gtk:4[introspection?]
  IUSE: doc +introspection vala
  RDEPEND: dev-libs/glib:2 x11-misc/colord:=[introspection?,vala?] x11-libs/gtk+:3[introspection?]
    x11-libs/gtk:4[introspection?]
  emerge.packages: x11-libs/colord-gtk
  kit: gnome-kit
  original.package.name: x11-libs/colord-gtk
  original.package.slot: "0"
  original.package.version: 0.3.1
