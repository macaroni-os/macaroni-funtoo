name: localsearch
version: 3.10.2
category: app-misc
use_flags:
- cue
- exif
- gif
- gsf
- gstreamer
- iptc
- iso
- jpeg
- pdf
- playlist
- raw
- tiff
- upower
- xml
- xmp
- xps
requires:
- name: gzip
  version: '>=0'
  category: app-arch
- name: tinysparql
  version: '>=0'
  category: app-misc
- name: libgxps
  version: '>=0'
  category: app-text
- name: poppler
  version: '>=0'
  category: app-text
- name: totem-pl-parser
  version: '>=0'
  category: dev-libs
- name: libgsf
  version: '>=0'
  category: gnome-extra
- name: exempi
  version: '>=0'
  category: media-libs
- name: gexiv2
  version: '>=0'
  category: media-libs
- name: giflib
  version: '>=0'
  category: media-libs
- name: gst-plugins-base
  version: '>=0'
  category: media-libs-1.0
- name: gstreamer
  version: '>=0'
  category: media-libs-1.0
- name: libexif
  version: '>=0'
  category: media-libs
- name: libiptcdata
  version: '>=0'
  category: media-libs
- name: libjpeg-turbo
  version: '>=0'
  category: media-libs
- name: ffmpeg
  version: '>=0'
  category: media-video
- name: libosinfo
  version: '>=0'
  category: sys-libs
- name: upower
  version: '>=0'
  category: sys-power
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Indexer and search engine that powers desktop search for core GNOME components
uri:
- https://gitlab.gnome.org/GNOME/localsearch
license: GPL-2+ LGPL-2.1+
labels:
  BDEPEND: app-text/asciidoc dev-libs/libxslt dev-util/gdbus-codegen sys-devel/gettext
    virtual/pkgconfig >=app-portage/elt-patches-20170815 app-arch/xz-utils >=dev-util/meson-0.48.2
    >=dev-util/ninja-1.7.2 virtual/pkgconfig
  DEPEND: app-misc/tinysparql sys-apps/dbus xmp? ( media-libs/exempi:= ) raw? ( media-libs/gexiv2
    ) dev-libs/glib:2 dev-libs/libgudev dev-libs/gobject-introspection:= cue? ( media-libs/libcue:=
    ) exif? ( media-libs/libexif ) gsf? ( gnome-extra/libgsf ) xps? ( app-text/libgxps
    ) iptc? ( media-libs/libiptcdata ) jpeg? ( media-libs/libjpeg-turbo:= ) iso? (
    sys-libs/libosinfo ) media-libs/libpng:= tiff? ( media-libs/tiff:= ) xml? ( dev-libs/libxml2:=
    ) pdf? ( app-text/poppler:=[cairo] ) playlist? ( dev-libs/totem-pl-parser:= )
    gif? ( media-libs/giflib:= ) app-arch/gzip upower? ( sys-power/upower:= ) dev-libs/icu:=
    gstreamer? ( media-libs/gstreamer:1.0 media-libs/gst-plugins-base:1.0 ) >=media-video/ffmpeg-8.0.1:0=
    dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: cue exif gif gsf +gstreamer iptc +iso +jpeg +pdf +playlist raw seccomp +tiff
    upower +xml xmp xps
  RDEPEND: app-misc/tinysparql sys-apps/dbus xmp? ( media-libs/exempi:= ) raw? ( media-libs/gexiv2
    ) dev-libs/glib:2 dev-libs/libgudev dev-libs/gobject-introspection:= cue? ( media-libs/libcue:=
    ) exif? ( media-libs/libexif ) gsf? ( gnome-extra/libgsf ) xps? ( app-text/libgxps
    ) iptc? ( media-libs/libiptcdata ) jpeg? ( media-libs/libjpeg-turbo:= ) iso? (
    sys-libs/libosinfo ) media-libs/libpng:= tiff? ( media-libs/tiff:= ) xml? ( dev-libs/libxml2:=
    ) pdf? ( app-text/poppler:=[cairo] ) playlist? ( dev-libs/totem-pl-parser:= )
    gif? ( media-libs/giflib:= ) app-arch/gzip upower? ( sys-power/upower:= ) dev-libs/icu:=
    gstreamer? ( media-libs/gstreamer:1.0 media-libs/gst-plugins-base:1.0 ) >=media-video/ffmpeg-8.0.1:0=
  emerge.packages: app-misc/localsearch
  kit: gnome-kit
  original.package.name: app-misc/localsearch
  original.package.slot: "0"
  original.package.version: 3.10.2
