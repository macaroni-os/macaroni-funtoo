name: tinysparql
version: 3.9.2
category: app-misc
use_flags:
- -gtk-doc
- -stemmer
- -systemd
- zeroconf
requires:
- name: json-glib
  version: '>=0'
  category: dev-libs
- name: libxml2
  version: '>=0'
  category: dev-libs-2
- name: avahi
  version: '>=0'
  category: net-dns
- name: libsoup
  version: '>=0'
  category: net-libs-3
- name: dbus
  version: '>=0'
  category: sys-apps
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Low-footprint RDF triple store with SPARQL 1.1 interface
uri:
- https://gitlab.gnome.org/GNOME/tinysparql
license: GPL-2+ LGPL-2.1+
labels:
  BDEPEND: app-text/asciidoc dev-libs/libxslt || ( dev-lang/vala:0.56 dev-lang/vala:0.54
    dev-lang/vala:0.52 dev-lang/vala:0.50 dev-lang/vala:0.48 dev-lang/vala:0.46 dev-lang/vala:0.44
    dev-lang/vala:0.42 dev-lang/vala:0.40 dev-lang/vala:0.36 ) sys-devel/gettext virtual/pkgconfig
    gtk-doc? ( dev-uti/gi-docgen media-gfx/graphviz app-text/xmlto ) >=app-portage/elt-patches-20170815
    app-arch/xz-utils >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2 virtual/pkgconfig
  DEPEND: dev-libs/glib:2 dev-libs/gobject-introspection:= dev-libs/icu:= dev-libs/json-glib
    dev-libs/libxml2 dev-db/sqlite:3 net-libs/libsoup sys-apps/dbus zeroconf? ( net-dns/avahi
    ) systemd? ( sys-apps/systemd ) stemmer? ( dev-libs/snowball-stemmer:= ) dev-util/desktop-file-utils
    x11-misc/shared-mime-info
  IUSE: gtk-doc +localsearch stemmer systemd vala zeroconf
  RDEPEND: dev-libs/glib:2 dev-libs/gobject-introspection:= dev-libs/icu:= dev-libs/json-glib
    dev-libs/libxml2 dev-db/sqlite:3 net-libs/libsoup sys-apps/dbus zeroconf? ( net-dns/avahi
    ) systemd? ( sys-apps/systemd ) stemmer? ( dev-libs/snowball-stemmer:= )
  emerge.packages: app-misc/tinysparql
  kit: gnome-kit
  original.package.name: app-misc/tinysparql
  original.package.slot: "0"
  original.package.version: 3.9.2-r1
