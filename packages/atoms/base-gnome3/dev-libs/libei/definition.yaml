name: libei
version: 1.5.0
category: dev-libs
use_flags:
- -systemd
- elogind
requires:
- name: libevdev
  version: '>=0'
  category: dev-libs
- name: elogind
  version: '>=0'
  category: sys-auth
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Library for Emulated Input, primarily aimed at the Wayland stack
uri:
- https://gitlab.freedesktop.org/libinput/libei
license: MIT
labels:
