name: gdm
version: 49.2+1
category: gnome-base
use_flags:
- -accessibility
- -fprint
- -systemd
- X
- audit
- elogind
- plymouth
- tcpd
- wayland
- elogind
requires:
- name: dconf
  version: '>=0'
  category: gnome-base
- name: gnome-shell
  version: '>=0'
  category: gnome-base
- name: keyutils
  version: '>=0'
  category: sys-apps
- name: tcp-wrappers
  version: '>=0'
  category: sys-apps
- name: pambase
  version: '>=0'
  category: sys-auth
- name: plymouth
  version: '>=0'
  category: sys-boot
- name: xhost
  version: '>=0'
  category: x11-apps
- name: xorg-server
  version: '>=0'
  category: x11-base
- name: libxcb
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: GNOME Display Manager for managing graphical display servers and user
  logins
uri:
- https://gitlab.gnome.org/GNOME/gdm
license: LGPL-2.1+
labels:
  BDEPEND: dev-util/gdbus-codegen dev-util/itstool gnome-base/dconf sys-devel/gettext
    virtual/pkgconfig >=app-portage/elt-patches-20170815 app-arch/xz-utils >=dev-util/meson-0.48.2
    >=dev-util/ninja-1.7.2 virtual/pkgconfig virtual/pkgconfig
  DEPEND: virtual/udev dev-libs/libgudev:= dev-libs/glib:2 dev-libs/json-glib sys-apps/accountsservice
    sys-apps/keyutils:= X? ( x11-libs/libxcb x11-libs/libX11 x11-libs/libXau x11-libs/libXdmcp
    x11-base/xorg-server x11-libs/gtk+:3 ) tcpd? ( sys-apps/tcp-wrappers ) systemd?
    ( sys-apps/systemd:=[pam] ) elogind? ( sys-auth/elogind[pam] ) plymouth? ( sys-boot/plymouth
    ) audit? ( sys-process/audit ) sys-libs/pam sys-auth/pambase gnome-base/dconf
    gnome-base/gnome-settings-daemon gnome-base/gsettings-desktop-schemas sys-apps/dbus
    x11-misc/xdg-utils dev-libs/gobject-introspection:= x11-base/xorg-proto dev-util/desktop-file-utils
    x11-misc/shared-mime-info sys-apps/shadow
  IUSE: accessibility audit bluetooth-sound elogind fprint plymouth systemd tcpd wayland
    +X
  RDEPEND: virtual/udev dev-libs/libgudev:= dev-libs/glib:2 dev-libs/json-glib sys-apps/accountsservice
    sys-apps/keyutils:= X? ( x11-libs/libxcb x11-libs/libX11 x11-libs/libXau x11-libs/libXdmcp
    x11-base/xorg-server x11-libs/gtk+:3 ) tcpd? ( sys-apps/tcp-wrappers ) systemd?
    ( sys-apps/systemd:=[pam] ) elogind? ( sys-auth/elogind[pam] ) plymouth? ( sys-boot/plymouth
    ) audit? ( sys-process/audit ) sys-libs/pam sys-auth/pambase gnome-base/dconf
    gnome-base/gnome-settings-daemon gnome-base/gsettings-desktop-schemas sys-apps/dbus
    x11-misc/xdg-utils dev-libs/gobject-introspection:= gnome-base/gnome-session gnome-base/gnome-shell
    x11-apps/xhost accessibility? ( app-accessibility/orca gnome-extra/mousetweaks
    ) fprint? ( sys-auth/fprintd[pam] )
  emerge.packages: gnome-base/gdm
  kit: gnome-kit
  original.package.name: gnome-base/gdm
  original.package.slot: "0"
  original.package.version: "49.2"
