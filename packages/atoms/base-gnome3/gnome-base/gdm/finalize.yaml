shell:
- /bin/bash
- -c
install:
- eval 'entities merge --specs-dir /usr/share/macaroni/entities/ -e gdm || true' &&
  eval 'entities merge --specs-dir /usr/share/macaroni/entities/ -e gdm-greeter ||
  true'
- eval 'mkdir /var/lib/gdm -p || true' && eval 'chown gdm:gdm /var/lib/gdm || true'
- eval 'mkdir /var/lib/gdm-greeter -p || true' && eval 'chown gdm-greeter:gdm /var/lib/gdm-greeter
  || true'
