    app-arch/xz-utils >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2 virtual/pkgconfig
  DEPEND: dev-libs/glib:2 X? ( x11-libs/gtk:4 x11-libs/libICE x11-libs/libSM x11-libs/libX11
