    x11-libs/libXcomposite systemd? ( sys-apps/systemd:= ) elogind? ( sys-auth/elogind:=
    ) x11-libs/xtrans dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: doc elogind systemd X
  RDEPEND: dev-libs/glib:2 X? ( x11-libs/gtk:4 x11-libs/libICE x11-libs/libSM x11-libs/libX11
    ) gnome-base/gnome-desktop dev-libs/json-glib media-libs/libglvnd[X] media-libs/libepoxy
    x11-libs/libXcomposite systemd? ( sys-apps/systemd:= ) elogind? ( sys-auth/elogind:=
    ) gnome-base/gnome-settings-daemon gnome-base/gsettings-desktop-schemas sys-apps/dbus[elogind=,systemd=,X]
    x11-misc/xdg-user-dirs x11-misc/xdg-user-dirs-gtk
  emerge.packages: gnome-base/gnome-session
  kit: gnome-kit
  original.package.name: gnome-base/gnome-session
  original.package.slot: "0"
  original.package.version: "48.0"
