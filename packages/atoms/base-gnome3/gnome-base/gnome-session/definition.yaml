name: gnome-session
version: "48.0"
category: gnome-base
use_flags:
- -doc
- -systemd
- X
- elogind
requires:
- name: json-glib
  version: '>=0'
  category: dev-libs
- name: gnome-settings-daemon
  version: '>=0'
  category: gnome-base
- name: libglvnd
  version: '>=0'
  category: media-libs
- name: dbus
  version: '>=0'
  category: sys-apps
- name: libSM
  version: '>=0'
  category: x11-libs
- name: libXcomposite
  version: '>=0'
  category: x11-libs
- name: xdg-user-dirs-gtk
  version: '>=0'
  category: x11-misc
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Gnome session manager
uri:
- https://gitlab.gnome.org/GNOME/gnome-session
license: GPL-2 LGPL-2 FDL-1.1
labels:
