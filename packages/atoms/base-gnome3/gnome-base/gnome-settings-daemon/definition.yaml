  RDEPEND: sci-geosciences/geocode-glib dev-libs/glib:2 gnome-base/gnome-desktop:=
    >=gnome-base/gsettings-desktop-schemas-48 x11-libs/gtk+:3[X,wayland?] dev-libs/libgweather:=
    colord? ( x11-misc/colord:= ) media-libs/libcanberra[gtk3(-)] app-misc/geoclue
    x11-libs/libnotify media-sound/pulseaudio[glib] sys-auth/polkit sys-power/upower:=
    x11-libs/libX11 x11-libs/libXfixes dev-libs/libgudev:= wayland? ( dev-libs/wayland
