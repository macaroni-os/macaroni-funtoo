    ) smartcard? ( app-crypt/gcr:= ) cups? ( net-print/cups[dbus] ) modemmanager?
    ( app-crypt/gcr net-misc/modemmanager:= ) networkmanager? ( net-misc/networkmanager
    ) media-libs/alsa-lib x11-libs/libXi x11-libs/libXext media-libs/fontconfig elogind?
    ( sys-auth/elogind ) systemd? ( sys-apps/systemd ) sys-apps/usbguard
  emerge.packages: gnome-base/gnome-settings-daemon
  kit: gnome-kit
  original.package.name: gnome-base/gnome-settings-daemon
  original.package.slot: "0"
  original.package.version: "48.1"
