    x11-libs/gtk:4[X,introspection?,wayland] x11-libs/libadwaita dev-libs/libportal:=[gtk]
    x11-libs/pango app-misc/tinysparql cloudproviders? ( net-libs/libcloudproviders
    ) introspection? ( dev-libs/gobject-introspection:= ) dev-util/desktop-file-utils
    x11-misc/shared-mime-info
  IUSE: +cloudproviders doc gnome +gstreamer +introspection +previewer
  RDEPEND: dev-libs/glib:2 media-libs/gexiv2 media-libs/gstreamer:1.0 media-libs/gst-plugins-base:1.0
