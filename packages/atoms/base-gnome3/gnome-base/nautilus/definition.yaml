    ) introspection? ( dev-libs/gobject-introspection:= ) app-misc/localsearch:=
  emerge.packages: gnome-base/nautilus
  kit: gnome-kit
  original.package.name: gnome-base/nautilus
  original.package.slot: "0"
  original.package.version: "49.3"
