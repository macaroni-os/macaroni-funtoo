name: libgsf
version: 1.14.55
category: gnome-extra
use_flags:
- bzip2
- gtk
- introspection
requires:
- name: imagemagick
  version: '>=0'
  category: media-gfx
- name: gdk-pixbuf
  version: '>=0'
  category: x11-libs-2
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: The GNOME Structured File Library
uri:
- https://developer.gnome.org/gsf/
license: GPL-2 LGPL-2.1
labels:
  BDEPEND: sys-devel/gettext dev-util/gtk-doc-am dev-util/intltool virtual/pkgconfig
    >=app-portage/elt-patches-20170815 || ( >=sys-devel/automake-1.16.5:1.16 ) >=sys-devel/autoconf-2.71
    >=sys-devel/libtool-2.4 app-arch/xz-utils
  DEPEND: dev-libs/glib:2 dev-libs/libxml2 sys-libs/zlib bzip2? ( app-arch/bzip2 )
    gtk? ( x11-libs/gdk-pixbuf:2 media-gfx/imagemagick ) introspection? ( dev-libs/gobject-introspection:=
    ) dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: bzip2 gtk +introspection
  RDEPEND: dev-libs/glib:2 dev-libs/libxml2 sys-libs/zlib bzip2? ( app-arch/bzip2
    ) gtk? ( x11-libs/gdk-pixbuf:2 media-gfx/imagemagick ) introspection? ( dev-libs/gobject-introspection:=
    )
  emerge.packages: gnome-extra/libgsf
  kit: gnome-kit
  original.package.name: gnome-extra/libgsf
  original.package.slot: "0"
  original.package.version: 1.14.55
