name: nm-applet
version: 1.36.0
category: gnome-extra
use_flags:
- -gnome-keyring
- -selinux
- -teamd
- ayatana
- modemmanager
- policykit
requires:
- name: libsecret
  version: '>=0'
  category: app-crypt
- name: libappindicator
  version: '>=0'
  category: dev-libs-3
- name: libnma
  version: '>=0'
  category: net-libs
- name: freedesktop-icon-theme
  version: '>=0'
  category: virtual
- name: libgudev
  version: '>=0'
  category: virtual
- name: libnotify
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: GNOME applet for NetworkManager
uri:
- https://wiki.gnome.org/Projects/NetworkManager
license: GPL-2+
labels:
  BDEPEND: dev-libs/libxml2 sys-devel/gettext virtual/pkgconfig >=app-portage/elt-patches-20170815
    app-arch/xz-utils >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: dev-libs/glib:2 app-crypt/libsecret net-libs/libnma x11-libs/gtk+:3 net-misc/networkmanager[modemmanager?,teamd?]
    appindicator? ( dev-libs/libayatana-appindicator dev-libs/libdbusmenu ) modemmanager?
    ( net-misc/modemmanager ) teamd? ( dev-libs/jansson:= ) virtual/freedesktop-icon-theme
    dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: appindicator +modemmanager teamd
  RDEPEND: dev-libs/glib:2 app-crypt/libsecret net-libs/libnma x11-libs/gtk+:3 net-misc/networkmanager[modemmanager?,teamd?]
    appindicator? ( dev-libs/libayatana-appindicator dev-libs/libdbusmenu ) modemmanager?
    ( net-misc/modemmanager ) teamd? ( dev-libs/jansson:= ) virtual/freedesktop-icon-theme
  emerge.packages: gnome-extra/nm-applet
  kit: gnome-kit
  original.package.name: gnome-extra/nm-applet
  original.package.slot: "0"
  original.package.version: 1.36.0
