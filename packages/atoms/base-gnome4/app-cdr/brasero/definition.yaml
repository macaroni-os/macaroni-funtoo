name: brasero
version: 3.12.3
category: app-cdr
use_flags:
- -packagekit
- -test
- css
- introspection
- libburn
- nautilus
- playlist
- tracker
- mp3
requires:
- name: libburn
  version: '>=0'
  category: dev-libs
- name: libisofs
  version: '>=0'
  category: dev-libs
- name: libxml2
  version: '>=0'
  category: dev-libs-2
- name: totem-pl-parser
  version: '>=0'
  category: dev-libs
- name: nautilus
  version: '>=0'
  category: gnome-base
- name: gst-plugins-good
  version: '>=0'
  category: media-libs-1.0
- name: libcanberra
  version: '>=0'
  category: media-libs
- name: libdvdcss
  version: '>=0'
  category: media-libs-1.2
- name: gst-plugins-meta
  version: '>=0'
  category: media-plugins-1.0
- name: libSM
  version: '>=0'
  category: x11-libs
- name: libnotify
  version: '>=0'
  category: x11-libs
- name: hicolor-icon-theme
  version: '>=0'
  category: x11-themes
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: CD/DVD burning application for the GNOME desktop
uri:
- https://wiki.gnome.org/Apps/Brasero
license: GPL-2+ CC-BY-SA-3.0
labels:
  BDEPEND: dev-util/intltool dev-util/itstool dev-util/gtk-doc-am sys-devel/gettext
    virtual/pkgconfig >=app-portage/elt-patches-20170815 app-arch/xz-utils
  DEPEND: dev-libs/glib:2 x11-libs/gtk+:3[introspection] media-libs/gstreamer:1.0
    media-libs/gst-plugins-base:1.0 dev-libs/libxml2:= x11-libs/libnotify:= media-libs/libcanberra
    x11-libs/libICE x11-libs/libSM introspection? ( dev-libs/gobject-introspection:=
    ) libburn? ( dev-libs/libburn:= dev-libs/libisofs:= ) nautilus? ( gnome-base/nautilus
    ) playlist? ( dev-libs/totem-pl-parser:= ) tracker? ( app-misc/tinysparql:= )
    dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: +css +introspection +libburn mp3 nautilus playlist tracker
  RDEPEND: media-libs/gst-plugins-good:1.0 media-plugins/gst-plugins-meta:1.0[mp3?]
    x11-themes/hicolor-icon-theme !libburn? ( app-cdr/cdrdao app-cdr/cdrtools app-cdr/dvd+rw-tools
    )
  emerge.packages: app-cdr/brasero
  kit: gnome-kit
  original.package.name: app-cdr/brasero
  original.package.slot: "0"
  original.package.version: 3.12.3
