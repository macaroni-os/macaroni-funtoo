name: libgedit-gfls
version: 0.2.1
category: dev-libs
use_flags:
- -gtk-doc
requires:
- name: gobject-introspection
  version: '>=0'
  category: dev-libs
- name: gsettings-desktop-schemas
  version: '>=0'
  category: gnome-base
- name: gtk+
  version: '>=0'
  category: x11-libs-3
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: A module dedicated to file loading and saving
uri:
- https://gitlab.gnome.org/World/gedit/libgedit-gfls
license: LGPL-3+
labels:
  BDEPEND: gtk-doc? ( dev-util/gtk-doc app-text/docbook-xml-dtd:4.3 ) sys-devel/gettext
    virtual/pkgconfig >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: dev-libs/glib:2 x11-libs/gtk+:3[introspection] gnome-base/gsettings-desktop-schemas
    dev-libs/gobject-introspection:=
  IUSE: gtk-doc
  RDEPEND: dev-libs/glib:2 x11-libs/gtk+:3[introspection] gnome-base/gsettings-desktop-schemas
    dev-libs/gobject-introspection:=
  emerge.packages: dev-libs/libgedit-gfls
  kit: gnome-kit
  original.package.name: dev-libs/libgedit-gfls
  original.package.slot: "0"
  original.package.version: 0.2.1
