name: sound-juicer
version: 3.40.0
category: media-sound
use_flags:
- -test
- flac
requires:
- name: brasero
  version: '>=0'
  category: app-cdr
- name: gvfs
  version: '>=0'
  category: gnome-base
- name: libdiscid
  version: '>=0'
  category: media-libs
- name: musicbrainz
  version: '>=0'
  category: media-libs-5
- name: gst-plugins-cdparanoia
  version: '>=0'
  category: media-plugins-1.0
- name: dbus
  version: '>=0'
  category: sys-apps
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: CD ripper for GNOME
uri:
- https://wiki.gnome.org/Apps/SoundJuicer
license: GPL-2+
labels:
  BDEPEND: app-text/iso-codes app-text/docbook-xml-dtd:4.3 dev-libs/appstream-glib
    dev-util/itstool sys-devel/gettext virtual/pkgconfig >=app-portage/elt-patches-20170815
    app-arch/xz-utils >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: dev-libs/glib:2[dbus] x11-libs/gtk+:3 gnome-base/gsettings-desktop-schemas
    app-cdr/brasero media-plugins/gst-plugins-meta:1.0[cdda,flac?] gnome-base/gvfs[cdda,udev]
    media-libs/libcanberra media-libs/musicbrainz:= media-libs/libdiscid sys-apps/dbus
    dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: flac vorbis
  RDEPEND: dev-libs/glib:2[dbus] x11-libs/gtk+:3 gnome-base/gsettings-desktop-schemas
    app-cdr/brasero media-plugins/gst-plugins-meta:1.0[cdda,flac?] gnome-base/gvfs[cdda,udev]
    media-libs/libcanberra media-libs/musicbrainz:= media-libs/libdiscid sys-apps/dbus
  emerge.packages: media-sound/sound-juicer
  kit: media-kit
  original.package.name: media-sound/sound-juicer
  original.package.slot: "0"
  original.package.version: 3.40.0
