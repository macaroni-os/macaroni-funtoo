name: gnome-disk-utility
version: 46.1+1
category: sys-apps
use_flags:
- -systemd
- elogind
- fat
- gnome
requires:
- name: xz-utils
  version: '>=0'
  category: app-arch
- name: libsecret
  version: '>=0'
  category: app-crypt
- name: libhandy
  version: '>=0'
  category: dev-libs
- name: libpwquality
  version: '>=0'
  category: dev-libs
- name: gnome-settings-daemon
  version: '>=0'
  category: gnome-base
- name: libdvdread
  version: '>=0'
  category: media-libs
- name: elogind
  version: '>=0'
  category: sys-auth
- name: dosfstools
  version: '>=0'
  category: sys-fs
- name: udisks
  version: '>=0'
  category: sys-fs-2
- name: adwaita-icon-theme
  version: '>=0'
  category: x11-themes
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Disk Utility for GNOME using udisks
uri:
- https://apps.gnome.org/en/DiskUtility/
license: GPL-2+
labels:
  BDEPEND: dev-libs/libxml2 app-text/docbook-xsl-stylesheets dev-libs/libxslt sys-devel/gettext
    virtual/pkgconfig >=app-portage/elt-patches-20170815 app-arch/xz-utils >=dev-util/meson-0.48.2
    >=dev-util/ninja-1.7.2
  DEPEND: media-libs/libdvdread:= dev-libs/glib:2 x11-libs/gtk+:3 media-libs/libcanberra[gtk3]
    dev-libs/libhandy app-arch/xz-utils app-crypt/libsecret dev-libs/libpwquality
    sys-fs/udisks elogind? ( sys-auth/elogind ) systemd? ( sys-apps/systemd:= ) dev-util/desktop-file-utils
    x11-misc/shared-mime-info
  IUSE: fat elogind gnome systemd
  RDEPEND: media-libs/libdvdread:= dev-libs/glib:2 x11-libs/gtk+:3 media-libs/libcanberra[gtk3]
    dev-libs/libhandy app-arch/xz-utils app-crypt/libsecret dev-libs/libpwquality
    sys-fs/udisks elogind? ( sys-auth/elogind ) systemd? ( sys-apps/systemd:= ) x11-themes/adwaita-icon-theme
    fat? ( sys-fs/dosfstools ) gnome? ( gnome-base/gnome-settings-daemon )
  emerge.packages: sys-apps/gnome-disk-utility
  kit: gnome-kit
  original.package.name: sys-apps/gnome-disk-utility
  original.package.slot: "0"
  original.package.version: "46.1"
