name: gnome-backgrounds
version: 49.0+1
category: x11-themes
requires:
- name: librsvg
  version: '>=0'
  category: gnome-base-2
- name: libjxl
  version: '>=0'
  category: media-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: A set of backgrounds packaged with the GNOME desktop
uri:
- https://gitlab.gnome.org/GNOME/gnome-backgrounds
license: CC-BY-SA-2.0 CC-BY-SA-3.0 CC-BY-2.0 CC-BY-4.0
labels:
  BDEPEND: sys-devel/gettext virtual/pkgconfig >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  RDEPEND: media-libs/libjxl[gdk-pixbuf] gnome-base/librsvg x11-libs/gdk-pixbuf[jpeg]
  emerge.packages: x11-themes/gnome-backgrounds
  kit: gnome-kit
  original.package.name: x11-themes/gnome-backgrounds
  original.package.slot: "0"
  original.package.version: "49.0"
