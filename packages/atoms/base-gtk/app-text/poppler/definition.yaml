name: poppler
version: 25.12.0
category: app-text
use_flags:
- -cjk
- -introspection
- -jpeg2k
- -nss
- -qt5
- -qt6
- cairo
- curl
- jpeg
- lcms
- png
- tiff
- png
requires:
- name: nss
  version: '>=0'
  category: dev-libs
- name: lcms
  version: '>=0'
  category: media-libs-2
- name: curl
  version: '>=0'
  category: net-misc
- name: jpeg
  version: '>=0'
  category: virtual
- name: cairo
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: PDF rendering library based on the xpdf-3.0 code base
uri:
- https://poppler.freedesktop.org/
license: BSD GPL-2 MIT
labels:
  BDEPEND: virtual/pkgconfig dev-util/ninja dev-util/cmake
  DEPEND: media-libs/fontconfig media-libs/freetype dev-libs/nss sys-libs/zlib cairo?
    ( dev-libs/glib:2 x11-libs/cairo introspection? ( dev-libs/gobject-introspection:=
    ) ) curl? ( net-misc/curl ) jpeg? ( virtual/jpeg ) jpeg2k? ( media-libs/openjpeg:=
    ) lcms? ( media-libs/lcms ) nss? ( dev-libs/nss ) png? ( media-libs/libpng:= )
    qt5? ( dev-qt/qtcore:5 dev-qt/qtgui:5 dev-qt/qtxml:5 ) qt6? ( dev-qt/qtbase:6
    ) tiff? ( media-libs/tiff )
  IUSE: boost cairo cjk curl +cxx debug doc +introspection +jpeg +jpeg2k +lcms nss
    png qt5 qt6 tiff +utils
  RDEPEND: media-libs/fontconfig media-libs/freetype dev-libs/nss sys-libs/zlib cairo?
    ( dev-libs/glib:2 x11-libs/cairo introspection? ( dev-libs/gobject-introspection:=
    ) ) curl? ( net-misc/curl ) jpeg? ( virtual/jpeg ) jpeg2k? ( media-libs/openjpeg:=
    ) lcms? ( media-libs/lcms ) nss? ( dev-libs/nss ) png? ( media-libs/libpng:= )
    qt5? ( dev-qt/qtcore:5 dev-qt/qtgui:5 dev-qt/qtxml:5 ) qt6? ( dev-qt/qtbase:6
    ) tiff? ( media-libs/tiff ) cjk? ( app-text/poppler-data )
  emerge.packages: app-text/poppler
  kit: text-kit
  original.package.name: app-text/poppler
  original.package.slot: "0"
  original.package.version: 25.12.0
