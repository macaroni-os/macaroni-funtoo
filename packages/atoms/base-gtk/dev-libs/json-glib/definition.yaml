name: json-glib
version: 1.10.8
category: dev-libs
use_flags:
- -gtk-doc
- introspection
requires:
- name: gobject-introspection
  version: '>=0'
  category: dev-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Library providing GLib serialization and deserialization for the JSON
  format
uri:
- https://wiki.gnome.org/Projects/JsonGlib
license: LGPL-2.1+
labels:
  BDEPEND: app-text/docbook-xml-dtd:4.1.2 app-text/docbook-xsl-stylesheets dev-libs/libxslt
    gtk-doc? ( dev-util/gi-docgen ) sys-devel/gettext virtual/pkgconfig >=dev-util/meson-0.48.2
    >=dev-util/ninja-1.7.2
  DEPEND: dev-libs/glib:2 introspection? ( dev-libs/gobject-introspection:= )
  IUSE: gtk-doc +introspection
  RDEPEND: dev-libs/glib:2 introspection? ( dev-libs/gobject-introspection:= )
  emerge.packages: dev-libs/json-glib
  kit: gnome-kit
  original.package.name: dev-libs/json-glib
  original.package.slot: "0"
  original.package.version: 1.10.8
