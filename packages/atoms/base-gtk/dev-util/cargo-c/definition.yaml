name: cargo-c
version: 0.10.11+1
category: dev-util
requires:
- name: git
  version: '>=0'
  category: dev-vcs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: build and install C-compatible libraries
uri:
- https://github.com/lu-zero/cargo-c
license: Apache-2.0 Boost-1.0 BSD BSD-2 CC0-1.0 ISC LGPL-3+ MIT Apache-2.0 Unlicense
  ZLIB
labels:
  BDEPEND: virtual/rust >=virtual/rust-1.37.0
  IUSE: debug
  RDEPEND: sys-libs/zlib dev-libs/openssl:0= dev-vcs/git net-misc/curl[ssl]
  emerge.packages: dev-util/cargo-c
  kit: dev-kit
  original.package.name: dev-util/cargo-c
  original.package.slot: "0"
  original.package.version: 0.10.11
