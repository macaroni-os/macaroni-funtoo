name: glib-networking
version: 2.80.1
category: net-libs
use_flags:
- -libproxy
- gnome
- ssl
requires:
- name: ca-certificates
  version: '>=0'
  category: app-misc
- name: glib
  version: '>=0'
  category: dev-libs-2
- name: gsettings-desktop-schemas
  version: '>=0'
  category: gnome-base
- name: gnutls
  version: '>=0'
  category: net-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Network-related giomodules for glib
uri:
- https://gitlab.gnome.org/GNOME/glib-networking
license: LGPL-2.1+
labels:
  BDEPEND: sys-devel/gettext virtual/pkgconfig >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
    >=app-portage/elt-patches-20170815 app-arch/xz-utils
  DEPEND: dev-libs/glib:2 libproxy? ( net-libs/libproxy ) net-libs/gnutls:= ssl? (
    app-misc/ca-certificates ) gnome? ( gnome-base/gsettings-desktop-schemas ) dev-util/desktop-file-utils
    x11-misc/shared-mime-info dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: +gnome +libproxy +ssl
  RDEPEND: dev-libs/glib:2 libproxy? ( net-libs/libproxy ) net-libs/gnutls:= ssl?
    ( app-misc/ca-certificates ) gnome? ( gnome-base/gsettings-desktop-schemas )
  emerge.packages: net-libs/glib-networking
  kit: gnome-kit
  original.package.name: net-libs/glib-networking
  original.package.slot: "0"
  original.package.version: 2.80.1
