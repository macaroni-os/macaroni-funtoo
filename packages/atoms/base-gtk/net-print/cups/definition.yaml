    ) ) dbus? ( sys-apps/dbus ) kerberos? ( virtual/krb5 ) !openssl? ( net-libs/gnutls:0=
    ) openssl? ( dev-libs/openssl ) pam? ( virtual/pam ) usb? ( virtual/libusb:1 )
    X? ( x11-misc/xdg-utils ) xinetd? ( sys-apps/xinetd ) zeroconf? ( net-dns/avahi
    )
  emerge.packages: net-print/cups
  kit: net-kit
  original.package.name: net-print/cups
