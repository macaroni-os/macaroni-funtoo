name: cups
version: 2.4.16
category: net-print
use_flags:
- -acl
- -kerberos
- -kernel_linux
- -openssl
- -pam
- -usb
- -xinetd
- -zeroconf
- X
- dbus
requires:
- name: libpaper
  version: '>=0'
  category: app-text
- name: gnutls
  version: '>=0'
  category: net-libs
- name: zlib
  version: '>=0'
  category: sys-libs
- name: xdg-utils
  version: '>=0'
  category: x11-misc
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: CUPS - Common Unix Printing System
uri:
- https://github.com/OpenPrinting/cups
license: Apache-2.0
labels:
  BDEPEND: '>=app-portage/elt-patches-20170815 || ( >=sys-devel/automake-1.16.5:1.16
    ) >=sys-devel/autoconf-2.71 >=sys-devel/libtool-2.4'
  DEPEND: app-text/libpaper sys-libs/zlib acl? ( kernel_linux? ( sys-apps/acl sys-apps/attr
    ) ) dbus? ( sys-apps/dbus ) kerberos? ( virtual/krb5 ) !openssl? ( net-libs/gnutls:0=
    ) openssl? ( dev-libs/openssl ) pam? ( virtual/pam ) usb? ( virtual/libusb:1 )
    X? ( x11-misc/xdg-utils ) xinetd? ( sys-apps/xinetd ) zeroconf? ( net-dns/avahi
    ) virtual/pkgconfig sys-apps/shadow dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: acl dbus debug kerberos openssl pam static-libs usb X xinetd zeroconf
  RDEPEND: app-text/libpaper sys-libs/zlib acl? ( kernel_linux? ( sys-apps/acl sys-apps/attr
    ) ) dbus? ( sys-apps/dbus ) kerberos? ( virtual/krb5 ) !openssl? ( net-libs/gnutls:0=
    ) openssl? ( dev-libs/openssl ) pam? ( virtual/pam ) usb? ( virtual/libusb:1 )
    X? ( x11-misc/xdg-utils ) xinetd? ( sys-apps/xinetd ) zeroconf? ( net-dns/avahi
    )
  emerge.packages: net-print/cups
  kit: net-kit
  original.package.name: net-print/cups
  original.package.slot: "0"
  original.package.version: 2.4.16
