name: gdk-pixbuf
version: 2.44.4
category: x11-libs-2
use_flags:
- -gtk-doc
- glycin
- introspection
- jpeg
- tiff
requires:
- name: gobject-introspection
  version: '>=0'
  category: dev-libs
- name: libglycin
  version: '>=0'
  category: media-libs-2
- name: libjpeg-turbo
  version: '>=0'
  category: media-libs
- name: libpng
  version: '>=0'
  category: media-libs
- name: tiff
  version: '>=0'
  category: media-libs
- name: shared-mime-info
  version: '>=0'
  category: x11-misc
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Image loading library for GTK+
uri:
- https://gitlab.gnome.org/GNOME/gdk-pixbuf
license: LGPL-2.1+
labels:
  BDEPEND: gtk-doc? ( dev-util/gi-docgen ) app-text/docbook-xsl-stylesheets app-text/docbook-xml-dtd:4.3
    dev-libs/libxslt dev-python/docutils sys-devel/gettext virtual/pkgconfig >=dev-util/meson-0.48.2
    >=dev-util/ninja-1.7.2 >=app-portage/elt-patches-20170815 app-arch/xz-utils
  DEPEND: dev-libs/glib:2 x11-misc/shared-mime-info media-libs/libpng:= jpeg? ( media-libs/libjpeg-turbo:=
    ) tiff? ( media-libs/tiff:= ) glycin? ( media-libs/libglycin:= ) introspection?
    ( dev-libs/gobject-introspection:= ) dev-util/desktop-file-utils x11-misc/shared-mime-info
    dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: gtk-doc +introspection gif jpeg tiff glycin
  RDEPEND: dev-libs/glib:2 x11-misc/shared-mime-info media-libs/libpng:= jpeg? ( media-libs/libjpeg-turbo:=
    ) tiff? ( media-libs/tiff:= ) glycin? ( media-libs/libglycin:= ) introspection?
    ( dev-libs/gobject-introspection:= )
  emerge.packages: x11-libs/gdk-pixbuf:2
  kit: gnome-kit
  original.package.name: x11-libs/gdk-pixbuf
  original.package.slot: "2"
  original.package.version: 2.44.4
