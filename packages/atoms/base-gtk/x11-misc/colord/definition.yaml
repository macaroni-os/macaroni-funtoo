name: colord
version: 1.4.8
category: x11-misc
use_flags:
- -scanner
- -systemd
- introspection
- vala
requires:
- name: sqlite
  version: '>=0'
  category: dev-db-3
- name: libgudev
  version: '>=0'
  category: dev-libs
- name: libgusb
  version: '>=0'
  category: dev-libs
- name: lcms
  version: '>=0'
  category: media-libs-2
- name: polkit
  version: '>=0'
  category: sys-auth
- name: libudev
  version: '>=0'
  category: virtual
- name: tmpfiles
  version: '>=0'
  category: virtual
- name: whip-catalog
  version: '>=0'
  category: macaroni
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: System service to accurately color manage input and output devices
uri:
- https://www.freedesktop.org/software/colord/
license: GPL-2+
labels:
  BDEPEND: '>=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2 virtual/pkgconfig'
  DEPEND: dev-libs/glib:2 media-libs/lcms:= dev-db/sqlite:3= dev-libs/libgusb[introspection?]
    dev-libs/libgudev:= virtual/libudev:= virtual/udev systemd? ( sys-apps/systemd:=
    ) scanner? ( media-gfx/sane-backends sys-apps/dbus ) sys-auth/polkit introspection?
    ( dev-libs/gobject-introspection:= ) dev-libs/libxslt dev-util/gtk-doc-am dev-util/intltool
    sys-devel/gettext virtual/pkgconfig vala? ( || ( dev-lang/vala:0.56[vapigen(+)]
    dev-lang/vala:0.54[vapigen(+)] dev-lang/vala:0.52[vapigen(+)] dev-lang/vala:0.50[vapigen(+)]
    dev-lang/vala:0.48[vapigen(+)] dev-lang/vala:0.46[vapigen(+)] dev-lang/vala:0.44[vapigen(+)]
    dev-lang/vala:0.42[vapigen(+)] dev-lang/vala:0.40[vapigen(+)] dev-lang/vala:0.36[vapigen(+)]
    ) ) sys-apps/shadow
  IUSE: gtk-doc examples extra-print-profiles +introspection scanner systemd vala
  RDEPEND: dev-libs/glib:2 media-libs/lcms:= dev-db/sqlite:3= dev-libs/libgusb[introspection?]
    dev-libs/libgudev:= virtual/libudev:= virtual/udev systemd? ( sys-apps/systemd:=
    ) scanner? ( media-gfx/sane-backends sys-apps/dbus ) sys-auth/polkit introspection?
    ( dev-libs/gobject-introspection:= ) virtual/tmpfiles
  emerge.packages: x11-misc/colord
  kit: gnome-kit
  original.package.name: x11-misc/colord
  original.package.slot: "0"
  original.package.version: 1.4.8
