name: appstream-glib
version: 0.8.3
category: dev-libs
use_flags:
- -gtk-doc
- fonts
- introspection
requires:
- name: libarchive
  version: '>=0'
  category: app-arch
- name: json-glib
  version: '>=0'
  category: dev-libs
- name: libyaml
  version: '>=0'
  category: dev-libs
- name: fontconfig
  version: '>=0'
  category: media-libs-1.0
- name: curl
  version: '>=0'
  category: net-misc
- name: gdk-pixbuf
  version: '>=0'
  category: x11-libs-2
- name: gtk+
  version: '>=0'
  category: x11-libs-3
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: This library provides objects and helper methods to help reading and
  writing AppStream metadata.
uri:
- https://github.com/hughsie/appstream-glib
license: LGPL-2.1
labels:
  BDEPEND: dev-util/gperf gtk-doc? ( dev-util/gdk-doc dev-util/gtk-doc-am ) sys-devel/gettext
    >=app-portage/elt-patches-20170815 app-arch/xz-utils >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: dev-libs/glib:2 sys-apps/util-linux app-arch/libarchive:= net-misc/curl
    dev-libs/json-glib x11-libs/gdk-pixbuf:2[introspection?] fonts? ( x11-libs/gtk+:3
    media-libs/freetype:2 ) media-libs/fontconfig dev-libs/libyaml x11-libs/pango
    introspection? ( dev-libs/gobject-introspection:= ) app-text/docbook-xml-dtd:4.3
    dev-libs/libxslt dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: gtk-doc fonts +introspection
  RDEPEND: dev-libs/glib:2 sys-apps/util-linux app-arch/libarchive:= net-misc/curl
    dev-libs/json-glib x11-libs/gdk-pixbuf:2[introspection?] fonts? ( x11-libs/gtk+:3
    media-libs/freetype:2 ) media-libs/fontconfig dev-libs/libyaml x11-libs/pango
    introspection? ( dev-libs/gobject-introspection:= )
  emerge.packages: dev-libs/appstream-glib
  kit: gnome-kit
  original.package.name: dev-libs/appstream-glib
  original.package.slot: "0"
  original.package.version: 0.8.3
