name: gjs
version: 1.86.0
category: dev-libs
use_flags:
- -sysprof
- clang
- readline
requires:
- name: spidermonkey
  version: '>=0'
  category: dev-lang
- name: gobject-introspection
  version: '>=0'
  category: dev-libs
- name: libffi
  version: '>=0'
  category: dev-libs
- name: cairo
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Javascript bindings for GNOME
uri:
- https://gitlab.gnome.org/GNOME/gjs
license: MIT || ( MPL-1.1 LGPL-2+ GPL-2+ )
labels:
  BDEPEND: virtual/pkgconfig >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: dev-libs/glib:2 dev-libs/libffi:= dev-libs/gobject-introspection:= dev-lang/spidermonkey
    x11-libs/cairo[X,glib] readline? ( sys-libs/readline:= ) sysprof? ( dev-util/sysprof
    ) clang? ( sys-devel/clang:20 sys-devel/llvm:20 sys-devel/lld )
  IUSE: +clang examples readline sysprof
  RDEPEND: dev-libs/glib:2 dev-libs/libffi:= dev-libs/gobject-introspection:= dev-lang/spidermonkey
    x11-libs/cairo[X,glib] readline? ( sys-libs/readline:= )
  emerge.packages: dev-libs/gjs
  kit: gnome-kit
  original.package.name: dev-libs/gjs
  original.package.slot: "0"
  original.package.version: 1.86.0
