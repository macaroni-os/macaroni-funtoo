name: bubblewrap
version: 0.11.0+1
category: sys-apps
use_flags:
- -selinux
requires:
- name: libcap
  version: '>=0'
  category: sys-libs
- name: libseccomp
  version: '>=0'
  category: sys-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Unprivileged sandboxing tool, namespaces-powered chroot-like solution
uri:
- https://github.com/containers/bubblewrap/
license: LGPL-2
labels:
  BDEPEND: app-text/docbook-xml-dtd:4.3 app-text/docbook-xsl-stylesheets dev-libs/libxslt
    virtual/pkgconfig >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: sys-libs/libseccomp sys-libs/libcap selinux? ( sys-libs/libselinux )
  IUSE: selinux suid
  RDEPEND: sys-libs/libseccomp sys-libs/libcap selinux? ( sys-libs/libselinux )
  emerge.packages: sys-apps/bubblewrap
  kit: security-kit
  original.package.name: sys-apps/bubblewrap
  original.package.slot: "0"
  original.package.version: 0.11.0
