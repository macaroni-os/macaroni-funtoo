name: kcoreaddons
version: 6.22.0+1
category: kde-frameworks-6
use_flags:
- dbus
requires:
- name: qttranslations
  version: '>=0'
  category: dev-qt-6
- name: kde-seed
  version: '>=0'
  category: virtual
- name: libudev
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Framework for solving common problems such as caching, randomisation,
  and more
uri:
- https://invent.kde.org/frameworks/
license: GPL-2
labels:
  BDEPEND: dev-util/ninja dev-util/cmake
  DEPEND: virtual/kde-seed[declarative] dev-qt/qttranslations:6 dev-qt/qttools:6[linguist]
    virtual/libudev:= sys-kernel/linux-headers dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: dbus
  RDEPEND: virtual/kde-seed[declarative] dev-qt/qttranslations:6 dev-qt/qttools:6[linguist]
    virtual/libudev:=
  emerge.packages: kde-frameworks/kcoreaddons:6
  kit: kde-kit
  original.package.name: kde-frameworks/kcoreaddons
  original.package.slot: "6"
  original.package.version: 6.22.0
