    ios? ( app-pda/libimobiledevice:= app-pda/libplist:= )
  IUSE: ios
  RDEPEND: virtual/kde-seed[gui,declarative] sys-apps/util-linux sys-fs/udisks:2 virtual/libudev:=
    ios? ( app-pda/libimobiledevice:= app-pda/libplist:= )
  emerge.packages: kde-frameworks/solid:6
  kit: kde-kit
  original.package.name: kde-frameworks/solid
  original.package.slot: "6"
  original.package.version: 6.22.0
