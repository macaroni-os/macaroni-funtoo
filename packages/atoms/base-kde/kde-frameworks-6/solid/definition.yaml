name: solid
version: 6.22.0
category: kde-frameworks-6
use_flags:
- ios
requires:
- name: libimobiledevice
  version: '>=0'
  category: app-pda
- name: libplist
  version: '>=0'
  category: app-pda
- name: util-linux
  version: '>=0'
  category: sys-apps
- name: udisks
  version: '>=0'
  category: sys-fs-2
- name: kde-seed
  version: '>=0'
  category: virtual
- name: libudev
  version: '>=0'
  category: virtual
annotations:
