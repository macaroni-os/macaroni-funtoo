name: sonnet
version: 6.22.0
category: kde-frameworks-6
use_flags:
- aspell
- hunspell
- qml
requires:
- name: aspell
  version: '>=0'
  category: app-text
- name: hunspell
  version: '>=0'
  category: app-text
- name: kde-seed
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Framework for providing spell-checking through abstraction of popular
  backends
uri:
- https://invent.kde.org/frameworks/
license: GPL-2
labels:
  BDEPEND: dev-qt/qttools:6[linguist] dev-util/ninja dev-util/cmake
  DEPEND: virtual/kde-seed[gui] aspell? ( app-text/aspell ) hunspell? ( app-text/hunspell:=
    ) qml? ( dev-qt/qtdeclarative:6 )
  IUSE: aspell +hunspell qml
  RDEPEND: virtual/kde-seed[gui] aspell? ( app-text/aspell ) hunspell? ( app-text/hunspell:=
    ) qml? ( dev-qt/qtdeclarative:6 )
  emerge.packages: kde-frameworks/sonnet:6
  kit: kde-kit
  original.package.name: kde-frameworks/sonnet
  original.package.slot: "6"
  original.package.version: 6.22.0
