name: xerces-c
version: 3.3.0
category: dev-libs
use_flags:
- -doc
- curl
- icu
requires:
- name: icu
  version: '>=0'
  category: dev-libs
- name: curl
  version: '>=0'
  category: net-misc
- name: libiconv
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Validating XML parser written in a portable subset of C++
uri:
- https://xerces.apache.org/xerces-c/
license: Apache-2.0
labels:
  BDEPEND: doc? ( app-text/doxygen ) dev-util/ninja dev-util/cmake
  DEPEND: curl? ( net-misc/curl ) icu? ( dev-libs/icu:0= ) virtual/libiconv
  IUSE: cpu_flags_x86_sse2 curl doc examples iconv icu static-libs threads
  RDEPEND: curl? ( net-misc/curl ) icu? ( dev-libs/icu:0= ) virtual/libiconv
  emerge.packages: dev-libs/xerces-c
  kit: dev-kit
  original.package.name: dev-libs/xerces-c
  original.package.slot: "0"
  original.package.version: 3.3.0
