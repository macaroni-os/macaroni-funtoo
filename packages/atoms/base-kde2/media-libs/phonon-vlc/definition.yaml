name: phonon-vlc
version: 0.12.0
category: media-libs
requires:
- name: phonon
  version: '>=0'
  category: media-libs
- name: vlc
  version: '>=0'
  category: media-video
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: VLC backend for the Phonon multimedia library
uri:
- https://community.kde.org/Phonon
license: LGPL-2.1+ || ( LGPL-2.1 LGPL-3 )
labels:
  BDEPEND: dev-libs/libpcre2:* dev-qt/qttools:6[linguist] >=kde-frameworks/extra-cmake-modules-5.115.0:*
    virtual/pkgconfig dev-util/ninja dev-util/cmake
  DEPEND: dev-qt/qtbase:6[gui] >=media-libs/phonon-4.12.0 media-video/vlc:=[dbus,ogg,vorbis(+)]
  IUSE: debug
  RDEPEND: dev-qt/qtbase:6[gui] >=media-libs/phonon-4.12.0 media-video/vlc:=[dbus,ogg,vorbis(+)]
  emerge.packages: media-libs/phonon-vlc
  kit: kde-kit
  original.package.name: media-libs/phonon-vlc
  original.package.slot: "0"
  original.package.version: 0.12.0
