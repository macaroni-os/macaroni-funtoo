name: phonon
version: 4.12.0
category: media-libs
use_flags:
- designer
- pulseaudio
requires:
- name: qt5compat
  version: '>=0'
  category: dev-qt-6
- name: qttools
  version: '>=0'
  category: dev-qt-6
- name: breeze-icons
  version: '>=0'
  category: kde-frameworks-6
- name: pulseaudio
  version: '>=0'
  category: media-sound
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: KDE multimedia abstraction library
uri:
- https://community.kde.org/Phonon
license: '|| ( LGPL-2.1 LGPL-3 ) !pulseaudio? ( || ( GPL-2 GPL-3 ) )'
labels:
  BDEPEND: dev-libs/libpcre2:* dev-qt/qttools:6[linguist] >=kde-frameworks/extra-cmake-modules-5.115.0:*
    virtual/pkgconfig dev-util/ninja dev-util/cmake
  DEPEND: dev-qt/qt5compat:6 dev-qt/qtbase:6[gui] designer? ( dev-qt/qttools:6[designer]
    ) pulseaudio? ( dev-libs/glib:2 media-sound/pulseaudio[glib] ) !media-libs/phonon-gstreamer
    || ( kde-frameworks/breeze-icons:6 kde-frameworks/oxygen-icons:* )
  IUSE: debug designer pulseaudio +vlc
  RDEPEND: dev-qt/qt5compat:6 dev-qt/qtbase:6[gui] designer? ( dev-qt/qttools:6[designer]
    ) pulseaudio? ( dev-libs/glib:2 media-sound/pulseaudio[glib] ) !media-libs/phonon-gstreamer
    || ( kde-frameworks/breeze-icons:6 kde-frameworks/oxygen-icons:* )
  emerge.packages: media-libs/phonon
  kit: kde-kit
  original.package.name: media-libs/phonon
  original.package.slot: "0"
  original.package.version: 4.12.0
