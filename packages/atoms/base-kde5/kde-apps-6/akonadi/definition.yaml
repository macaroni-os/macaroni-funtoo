name: akonadi
version: 25.12.2+3
category: kde-apps-6
use_flags:
- -mysql
- -postgres
- sqlite
- webengine
- xml
- tools
requires:
- name: xz-utils
  version: '>=0'
  category: app-arch
- name: sqlite
  version: '>=0'
  category: dev-db-3
- name: libxslt
  version: '>=0'
  category: dev-libs
- name: kaccounts-integration
  version: '>=0'
  category: kde-apps-6
- name: kcrash
  version: '>=0'
  category: kde-frameworks-6
- name: kitemmodels
  version: '>=0'
  category: kde-frameworks-6
- name: kwindowsystem
  version: '>=0'
  category: kde-frameworks-6
- name: kxmlgui
  version: '>=0'
  category: kde-frameworks-6
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Storage service for PIM data and libraries for PIM apps
uri:
- https://community.kde.org/KDE_PIM/akonadi
labels:
  BDEPEND: dev-util/ninja dev-util/cmake
  DEPEND: virtual/kde-seed[gui,sql,declarative] kde-frameworks/kcolorscheme:6 kde-frameworks/kconfig:6
    kde-frameworks/kconfigwidgets:6 kde-frameworks/kcoreaddons:6 kde-frameworks/kcrash:6
    kde-frameworks/ki18n:6 kde-frameworks/kiconthemes:6 kde-frameworks/kitemmodels:6
    kde-frameworks/kwidgetsaddons:6 kde-frameworks/kwindowsystem:6 kde-frameworks/kxmlgui:6
    webengine? ( kde-apps/kaccounts-integration:6 >=net-libs/accounts-qt-1.17 ) xml?
    ( dev-libs/libxml2:= ) app-arch/xz-utils dev-libs/libxslt mysql? ( virtual/mysql
    ) postgres? ( dev-db/postgresql ) sqlite? ( dev-db/sqlite ) dev-util/desktop-file-utils
    x11-misc/shared-mime-info
  IUSE: tools +webengine xml postgres +sqlite mysql
  RDEPEND: virtual/kde-seed[gui,sql,declarative] kde-frameworks/kcolorscheme:6 kde-frameworks/kconfig:6
    kde-frameworks/kconfigwidgets:6 kde-frameworks/kcoreaddons:6 kde-frameworks/kcrash:6
    kde-frameworks/ki18n:6 kde-frameworks/kiconthemes:6 kde-frameworks/kitemmodels:6
    kde-frameworks/kwidgetsaddons:6 kde-frameworks/kwindowsystem:6 kde-frameworks/kxmlgui:6
    webengine? ( kde-apps/kaccounts-integration:6 >=net-libs/accounts-qt-1.17 ) xml?
    ( dev-libs/libxml2:= ) app-arch/xz-utils dev-libs/libxslt mysql? ( virtual/mysql
    ) postgres? ( dev-db/postgresql ) sqlite? ( dev-db/sqlite )
  emerge.packages: kde-apps/akonadi:6
  kit: kde-kit
  original.package.name: kde-apps/akonadi
  original.package.slot: "6"
  original.package.version: 25.12.2
