name: ktorrent
version: 25.12.2
category: net-p2p-6
use_flags:
- infowidget
- ipfilter
- mediaplayer
- rss
- stats
- upnp
- webengine
- zeroconf
requires:
- name: unzip
  version: '>=0'
  category: app-arch
- name: geoip
  version: '>=0'
  category: dev-libs
- name: qtmultimedia
  version: '>=0'
  category: dev-qt-6
- name: qtwebengine
  version: '>=0'
  category: dev-qt-6
- name: kio-extras
  version: '>=0'
