name: ddcutil
version: 2.2.5+7
category: app-misc
use_flags:
- X
- drm
- usb-monitor
- user-permissions
requires:
- name: glib
  version: '>=0'
  category: dev-libs-2
- name: hidapi
  version: '>=0'
  category: dev-libs
- name: jansson
  version: '>=0'
  category: dev-libs
- name: i2c-tools
  version: '>=0'
  category: sys-apps
- name: usbutils
  version: '>=0'
  category: sys-apps
- name: udev
  version: '>=0'
  category: virtual
- name: libX11
  version: '>=0'
  category: x11-libs
- name: libXrandr
  version: '>=0'
  category: x11-libs
- name: libdrm
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Control monitor settings using DDC/CI and USB
uri:
- http://www.ddcutil.com
license: GPL-2.0
labels:
  BDEPEND: virtual/pkgconfig >=app-portage/elt-patches-20170815 || ( >=sys-devel/automake-1.16.5:1.16
    ) >=sys-devel/autoconf-2.71 >=sys-devel/libtool-2.4 virtual/pkgconfig
  DEPEND: dev-libs/glib:2 dev-libs/jansson sys-apps/i2c-tools virtual/udev drm? (
    x11-libs/libdrm ) usb-monitor? ( dev-libs/hidapi virtual/libusb:1 sys-apps/usbutils
    ) X? ( x11-libs/libXrandr x11-libs/libX11 ) sys-apps/shadow
  IUSE: drm usb-monitor user-permissions video_cards_nvidia X
  RDEPEND: dev-libs/glib:2 dev-libs/jansson sys-apps/i2c-tools virtual/udev drm? (
    x11-libs/libdrm ) usb-monitor? ( dev-libs/hidapi virtual/libusb:1 sys-apps/usbutils
    ) X? ( x11-libs/libXrandr x11-libs/libX11 )
  emerge.packages: app-misc/ddcutil
  kit: core-hw-kit
  original.package.name: app-misc/ddcutil
  original.package.slot: "0"
  original.package.version: 2.2.5
