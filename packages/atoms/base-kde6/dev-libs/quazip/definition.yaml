name: quazip
version: 1.7.2
category: dev-libs
use_flags:
- -qt5
- bzip2
- qt6
requires:
- name: bzip2
  version: '>=0'
  category: app-arch
- name: qt5compat
  version: '>=0'
  category: dev-qt-6
- name: qtbase
  version: '>=0'
  category: dev-qt-6
- name: zlib
  version: '>=0'
  category: sys-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Simple C++ wrapper over Gilles Vollant's ZIP/UNZIP package
uri:
- https://stachenov.github.io/quazip/
license: LGPL-2.1-with-linking-exception
labels:
  BDEPEND: dev-util/ninja dev-util/cmake
  DEPEND: sys-libs/zlib:= bzip2? ( app-arch/bzip2:= ) qt5? ( dev-qt/qtcore:5 ) qt6?
    ( dev-qt/qtbase:6 dev-qt/qt5compat:6 )
  IUSE: +bzip2 qt5 +qt6
  RDEPEND: sys-libs/zlib:= bzip2? ( app-arch/bzip2:= ) qt5? ( dev-qt/qtcore:5 ) qt6?
    ( dev-qt/qtbase:6 dev-qt/qt5compat:6 )
  emerge.packages: dev-libs/quazip
  kit: dev-kit
  original.package.name: dev-libs/quazip
  original.package.slot: "0"
  original.package.version: 1.7.2
