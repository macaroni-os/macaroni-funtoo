name: kleopatra
version: 25.12.2
category: kde-apps-6
use_flags:
- pim
requires:
- name: gnupg
  version: '>=0'
  category: app-crypt
- name: paperkey
  version: '>=0'
  category: app-crypt
- name: libassuan
  version: '>=0'
  category: dev-libs
- name: akonadi-mime
  version: '>=0'
  category: kde-apps-6
- name: kidentitymanagement
  version: '>=0'
  category: kde-apps-6
- name: kmailtransport
  version: '>=0'
  category: kde-apps-6
- name: mimetreeparser
  version: '>=0'
  category: kde-apps-6
- name: knotifications
  version: '>=0'
  category: kde-frameworks-6
- name: kxmlgui
  version: '>=0'
  category: kde-frameworks-6
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Certificate manager and GUI for OpenPGP and CMS cryptography
uri:
- https://apps.kde.org/kleopatra/
labels:
  BDEPEND: dev-util/ninja dev-util/cmake
  DEPEND: virtual/kde-seed[gui] >=app-crypt/gnupg-2.1 app-crypt/paperkey app-crypt/gpgmepp:=
    app-crypt/qgpgme:= dev-libs/libassuan:= dev-libs/libgpg-error kde-apps/kmime:6=
    kde-apps/libkleo:6= kde-apps/mimetreeparser:6= kde-frameworks/kcodecs:6 kde-frameworks/kcolorscheme:6
    kde-frameworks/kconfig:6 kde-frameworks/kconfigwidgets:6 kde-frameworks/kcoreaddons:6
    kde-frameworks/kcrash:6 kde-frameworks/kdbusaddons:6 kde-frameworks/ki18n:6 kde-frameworks/kiconthemes:6
    kde-frameworks/kio:6 kde-frameworks/kitemmodels:6 kde-frameworks/knotifications:6
    kde-frameworks/ktextwidgets:6 kde-frameworks/kwidgetsaddons:6 kde-frameworks/kwindowsystem:6
    kde-frameworks/kxmlgui:6 pim? ( kde-apps/akonadi-mime:6= kde-apps/kidentitymanagement:6=
    kde-apps/kmailtransport:6= )
  IUSE: pim
  RDEPEND: virtual/kde-seed[gui] >=app-crypt/gnupg-2.1 app-crypt/paperkey app-crypt/gpgmepp:=
    app-crypt/qgpgme:= dev-libs/libassuan:= dev-libs/libgpg-error kde-apps/kmime:6=
    kde-apps/libkleo:6= kde-apps/mimetreeparser:6= kde-frameworks/kcodecs:6 kde-frameworks/kcolorscheme:6
    kde-frameworks/kconfig:6 kde-frameworks/kconfigwidgets:6 kde-frameworks/kcoreaddons:6
    kde-frameworks/kcrash:6 kde-frameworks/kdbusaddons:6 kde-frameworks/ki18n:6 kde-frameworks/kiconthemes:6
    kde-frameworks/kio:6 kde-frameworks/kitemmodels:6 kde-frameworks/knotifications:6
    kde-frameworks/ktextwidgets:6 kde-frameworks/kwidgetsaddons:6 kde-frameworks/kwindowsystem:6
    kde-frameworks/kxmlgui:6 pim? ( kde-apps/akonadi-mime:6= kde-apps/kidentitymanagement:6=
    kde-apps/kmailtransport:6= )
  emerge.packages: kde-apps/kleopatra:6
  kit: kde-kit
  original.package.name: kde-apps/kleopatra
  original.package.slot: "6"
  original.package.version: 25.12.2
