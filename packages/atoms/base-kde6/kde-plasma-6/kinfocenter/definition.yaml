name: kinfocenter
version: 6.5.5
category: kde-plasma-6
use_flags:
- -gles2-only
- usb
requires:
- name: qttools
  version: '>=0'
  category: dev-qt-6
- name: systemsettings
  version: '>=0'
  category: kde-plasma-6
- name: libusb
  version: '>=0'
  category: virtual-1
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Utility providing information about the computer hardware
uri:
- https://invent.kde.org/plasma/
labels:
