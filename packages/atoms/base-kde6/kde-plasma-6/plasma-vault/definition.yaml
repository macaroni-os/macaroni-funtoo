    >=sys-fs/encfs-1.9.2 ) kde-frameworks/kcodecs:6 kde-frameworks/kconfig:6 kde-frameworks/kconfigwidgets:6
    kde-frameworks/kcoreaddons:6 kde-frameworks/kdbusaddons:6 kde-frameworks/ki18n:6
    kde-frameworks/kio:6 kde-frameworks/kitemmodels:6 kde-frameworks/kservice:6 kde-frameworks/kwidgetsaddons:6
    kde-plasma/libksysguard:6 kde-plasma/libplasma:6 kde-plasma/plasma-activities:6
    networkmanager? ( kde-frameworks/networkmanager-qt:6 ) dev-util/desktop-file-utils
    x11-misc/shared-mime-info
  IUSE: networkmanager
  RDEPEND: virtual/kde-seed[gui,declarative] || ( >=app-crypt/gocryptfs-1.8 >=sys-fs/cryfs-0.9.9
    >=sys-fs/encfs-1.9.2 ) kde-frameworks/kcodecs:6 kde-frameworks/kconfig:6 kde-frameworks/kconfigwidgets:6
    kde-frameworks/kcoreaddons:6 kde-frameworks/kdbusaddons:6 kde-frameworks/ki18n:6
    kde-frameworks/kio:6 kde-frameworks/kitemmodels:6 kde-frameworks/kservice:6 kde-frameworks/kwidgetsaddons:6
    kde-plasma/libksysguard:6 kde-plasma/libplasma:6 kde-plasma/plasma-activities:6
    networkmanager? ( kde-frameworks/networkmanager-qt:6 )
  emerge.packages: kde-plasma/plasma-vault:6
  kit: kde-kit
  original.package.name: kde-plasma/plasma-vault
  original.package.slot: "6"
  original.package.version: 6.5.5
