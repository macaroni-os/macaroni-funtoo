name: plasma-vault
version: 6.5.5
category: kde-plasma-6
use_flags:
- networkmanager
requires:
- name: kitemmodels
  version: '>=0'
  category: kde-frameworks-6
- name: networkmanager-qt
  version: '>=0'
  category: kde-frameworks-6
- name: libksysguard
  version: '>=0'
  category: kde-plasma-6
- name: libplasma
  version: '>=0'
  category: kde-plasma-6
- name: cryfs
  version: '>=0'
  category: sys-fs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
