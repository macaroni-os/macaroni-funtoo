name: powerdevil
version: 6.5.5+1
category: kde-plasma-6
use_flags:
- brightness-control
- filecaps
requires:
- name: ddcutil
  version: '>=0'
  category: app-misc
- name: qcoro
  version: '>=0'
  category: dev-libs
- name: kcmutils
  version: '>=0'
  category: kde-frameworks-6
- name: kidletime
  version: '>=0'
  category: kde-frameworks-6
- name: kirigami
  version: '>=0'
  category: kde-frameworks-6
- name: knotifications
  version: '>=0'
  category: kde-frameworks-6
- name: krunner
  version: '>=0'
  category: kde-frameworks-6
- name: libkscreen
  version: '>=0'
  category: kde-plasma-6
- name: libplasma
  version: '>=0'
  category: kde-plasma-6
- name: plasma-workspace
  version: '>=0'
  category: kde-plasma-6
- name: power-profiles-daemon
  version: '>=0'
  category: sys-power
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Power management for KDE Plasma Shell
uri:
- https://invent.kde.org/plasma/
labels:
  BDEPEND: dev-util/ninja dev-util/cmake
  DEPEND: virtual/kde-seed[gui,declarative,wayland?] dev-libs/qcoro[dbus] || ( sys-power/power-profiles-daemon
    sys-power/tlp ) >=sys-power/upower-0.9.23 kde-frameworks/kauth:6[policykit] kde-frameworks/kcmutils:6
    kde-frameworks/kconfig:6 kde-frameworks/kconfigwidgets:6 kde-frameworks/kcoreaddons:6
    kde-frameworks/kcrash:6 kde-frameworks/kdbusaddons:6 kde-frameworks/kglobalaccel:6
    kde-frameworks/ki18n:6 kde-frameworks/kidletime:6 kde-frameworks/kio:6 kde-frameworks/kirigami:6
    kde-frameworks/kitemmodels:6 kde-frameworks/knotifications:6 kde-frameworks/krunner:6
    kde-frameworks/kservice:6 kde-frameworks/kwindowsystem:6[X] kde-frameworks/kxmlgui:6
    kde-frameworks/solid:6 kde-plasma/libkscreen:6 kde-plasma/libplasma:6 kde-plasma/plasma-activities:6
    kde-plasma/plasma-workspace:6 virtual/libudev:= x11-libs/libxcb brightness-control?
    ( app-misc/ddcutil:= ) filecaps? ( sys-libs/libcap ) dev-util/desktop-file-utils
    x11-misc/shared-mime-info
  IUSE: wayland brightness-control +filecaps
  RDEPEND: virtual/kde-seed[gui,declarative,wayland?] dev-libs/qcoro[dbus] || ( sys-power/power-profiles-daemon
    sys-power/tlp ) >=sys-power/upower-0.9.23 kde-frameworks/kauth:6[policykit] kde-frameworks/kcmutils:6
    kde-frameworks/kconfig:6 kde-frameworks/kconfigwidgets:6 kde-frameworks/kcoreaddons:6
    kde-frameworks/kcrash:6 kde-frameworks/kdbusaddons:6 kde-frameworks/kglobalaccel:6
    kde-frameworks/ki18n:6 kde-frameworks/kidletime:6 kde-frameworks/kio:6 kde-frameworks/kirigami:6
    kde-frameworks/kitemmodels:6 kde-frameworks/knotifications:6 kde-frameworks/krunner:6
    kde-frameworks/kservice:6 kde-frameworks/kwindowsystem:6[X] kde-frameworks/kxmlgui:6
    kde-frameworks/solid:6 kde-plasma/libkscreen:6 kde-plasma/libplasma:6 kde-plasma/plasma-activities:6
    kde-plasma/plasma-workspace:6 virtual/libudev:= x11-libs/libxcb brightness-control?
    ( app-misc/ddcutil:= )
  emerge.packages: kde-plasma/powerdevil:6
  kit: kde-kit
  original.package.name: kde-plasma/powerdevil
  original.package.slot: "6"
  original.package.version: 6.5.5
