name: glfw
version: "3.4"
category: media-libs
use_flags:
- X
- wayland
requires:
- name: mesa
  version: '>=0'
  category: media-libs
- name: opengl
  version: '>=0'
  category: virtual
- name: libX11
  version: '>=0'
  category: x11-libs
- name: libXcursor
  version: '>=0'
  category: x11-libs
- name: libXinerama
  version: '>=0'
  category: x11-libs
- name: libXrandr
  version: '>=0'
  category: x11-libs
- name: libxkbcommon
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Portable OpenGL FrameWork
uri:
- https://www.glfw.org/
license: ZLIB
labels:
  BDEPEND: wayland? ( dev-util/wayland-scanner kde-frameworks/extra-cmake-modules
    ) dev-util/ninja dev-util/cmake
  DEPEND: x11-libs/libxkbcommon wayland? ( dev-libs/wayland media-libs/mesa[egl(+),wayland]
    ) X? ( virtual/opengl x11-libs/libX11 x11-libs/libXcursor x11-libs/libXinerama
    x11-libs/libXrandr x11-libs/libXxf86vm ) wayland? ( dev-libs/wayland-protocols
    ) X? ( x11-base/xorg-proto x11-libs/libXi )
  IUSE: X wayland
  RDEPEND: x11-libs/libxkbcommon wayland? ( dev-libs/wayland media-libs/mesa[egl(+),wayland]
    ) X? ( virtual/opengl x11-libs/libX11 x11-libs/libXcursor x11-libs/libXinerama
    x11-libs/libXrandr x11-libs/libXxf86vm )
  emerge.packages: media-libs/glfw
  kit: media-kit
  original.package.name: media-libs/glfw
  original.package.slot: "0"
  original.package.version: "3.4"
