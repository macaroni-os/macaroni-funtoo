name: dcmtk
version: 3.6.9+1
category: sci-libs
use_flags:
- -doc
- png
- ssl
- tcpd
- tiff
- xml
- zlib
requires:
- name: libxml2
  version: '>=0'
  category: dev-libs-2
- name: openssl
  version: '>=0'
  category: dev-libs
- name: tiff
  version: '>=0'
  category: media-libs
- name: tcp-wrappers
  version: '>=0'
  category: sys-apps
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: The DICOM Toolkit
uri:
- https://dicom.offis.de/dcmtk.php.en
license: OFFIS
labels:
  BDEPEND: doc? ( app-doc/doxygen virtual/latex-base ) dev-util/ninja dev-util/cmake
  DEPEND: dev-libs/icu:= png? ( media-libs/libpng:* ) ssl? ( dev-libs/openssl:= )
    tcpd? ( sys-apps/tcp-wrappers ) tiff? ( media-libs/tiff:= ) xml? ( dev-libs/libxml2:2
    ) zlib? ( sys-libs/zlib )
  IUSE: doc png ssl tcpd tiff +threads xml zlib
  RDEPEND: dev-libs/icu:= png? ( media-libs/libpng:* ) ssl? ( dev-libs/openssl:= )
    tcpd? ( sys-apps/tcp-wrappers ) tiff? ( media-libs/tiff:= ) xml? ( dev-libs/libxml2:2
    ) zlib? ( sys-libs/zlib )
  emerge.packages: sci-libs/dcmtk
  kit: science-kit
  original.package.name: sci-libs/dcmtk
  original.package.slot: "0"
  original.package.version: 3.6.9
