name: libzip
version: 1.11.4
category: dev-libs
use_flags:
- -libressl
- -mbedtls
- bzip2
- gnutls
- ssl
requires:
- name: bzip2
  version: '>=0'
  category: app-arch
- name: gnutls
  version: '>=0'
  category: net-libs
- name: zlib
  version: '>=0'
  category: sys-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Library for manipulating zip archives
uri:
- https://nih.at/libzip/
license: BSD
labels:
  BDEPEND: dev-util/ninja dev-util/cmake
  DEPEND: sys-libs/zlib bzip2? ( app-arch/bzip2:= ) lzma? ( app-arch/xz-utils ) ssl?
    ( gnutls? ( dev-libs/nettle:= net-libs/gnutls:= ) !gnutls? ( mbedtls? ( net-libs/mbedtls:=
    ) !mbedtls? ( dev-libs/openssl:= ) ) ) zstd? ( app-arch/zstd:= )
  IUSE: bzip2 gnutls lzma mbedtls ssl tools zstd
  RDEPEND: sys-libs/zlib bzip2? ( app-arch/bzip2:= ) lzma? ( app-arch/xz-utils ) ssl?
    ( gnutls? ( dev-libs/nettle:= net-libs/gnutls:= ) !gnutls? ( mbedtls? ( net-libs/mbedtls:=
    ) !mbedtls? ( dev-libs/openssl:= ) ) ) zstd? ( app-arch/zstd:= )
  emerge.packages: dev-libs/libzip
  kit: dev-kit
  original.package.name: dev-libs/libzip
  original.package.slot: "0"
  original.package.version: 1.11.4
