name: flite
version: "2.2"
category: app-accessibility
use_flags:
- alsa
- pulseaudio
requires:
- name: pulseaudio
  version: '>=0'
  category: media-sound
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: A small fast portable speech synthesis system
uri:
- https://github.com/festvox/flite
license: BSD freetts public-domain regexp-UofT BSD-2
labels:
  BDEPEND: '>=app-portage/elt-patches-20170815 || ( >=sys-devel/automake-1.16.5:1.16
    ) >=sys-devel/autoconf-2.71 >=sys-devel/libtool-2.4'
  DEPEND: pulseaudio? ( media-sound/pulseaudio ) !pulseaudio? ( alsa? ( media-libs/alsa-lib
    ) )
  IUSE: alsa oss pulseaudio voices
  RDEPEND: pulseaudio? ( media-sound/pulseaudio ) !pulseaudio? ( alsa? ( media-libs/alsa-lib
    ) )
  emerge.packages: app-accessibility/flite
  kit: media-kit
  original.package.name: app-accessibility/flite
  original.package.slot: "0"
  original.package.version: "2.2"
