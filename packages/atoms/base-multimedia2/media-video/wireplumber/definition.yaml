- -lua_single_target_lua5-1
- -systemd
- elogind
- lua_single_target_lua5-3
requires:
- name: lua
  version: '>=0'
  category: dev-lua-5.3
- name: pipewire
  version: '>=0'
  category: media-video
- name: elogind
  version: '>=0'
  category: sys-auth
annotations:
