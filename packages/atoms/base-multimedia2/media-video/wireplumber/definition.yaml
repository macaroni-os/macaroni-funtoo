    ( dev-lua/lua:5.3 ) dev-libs/glib:2 media-video/pipewire:= virtual/libintl elogind?
    ( sys-auth/elogind ) systemd? ( sys-apps/systemd )
  emerge.packages: media-video/wireplumber
  kit: media-kit
  original.package.name: media-video/wireplumber
  original.package.slot: "0"
  original.package.version: 0.5.14
