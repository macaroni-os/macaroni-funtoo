name: freerdp
version: 3.25.0+2
category: net-misc
use_flags:
- -doc
- X
- alsa
- cups
- ffmpeg
- fuse
- gstreamer
- jpeg
- kerberos
- openh264
- pulseaudio
- sdl
- server
- smartcard
- usb
- wayland
- xinerama
- xv
requires:
- name: cJSON
  version: '>=0'
  category: dev-libs
- name: dbus-glib
  version: '>=0'
  category: dev-libs
- name: pkcs11-helper
  version: '>=0'
  category: dev-libs
- name: sdl2-ttf
  version: '>=0'
  category: media-libs
- name: ffmpeg
  version: '>=0'
  category: media-video
- name: cups
  version: '>=0'
  category: net-print
- name: pcsc-lite
  version: '>=0'
  category: sys-apps
- name: util-linux
  version: '>=0'
  category: sys-apps
- name: fuse
  version: '>=0'
  category: sys-fs-3
- name: krb5
  version: '>=0'
  category: virtual
- name: libXdamage
  version: '>=0'
  category: x11-libs
- name: libXinerama
  version: '>=0'
  category: x11-libs
- name: libxkbfile
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: FreeRDP is a free remote desktop protocol library and clients
uri:
- http://www.freerdp.com
license: Apache-2.0
