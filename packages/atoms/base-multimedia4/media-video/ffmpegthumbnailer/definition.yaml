name: ffmpegthumbnailer
version: 2.3.0
category: media-video
use_flags:
- -libav
- gtk
- jpeg
- png
requires:
- name: glib
  version: '>=0'
  category: dev-libs-2
- name: libpng
  version: '>=0'
  category: media-libs
- name: ffmpeg
  version: '>=0'
  category: media-video
- name: jpeg
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Lightweight video thumbnailer that can be used by file managers
uri:
- https://github.com/dirkvdb/ffmpegthumbnailer
license: GPL-2
labels:
  BDEPEND: virtual/pkgconfig dev-util/ninja dev-util/cmake
  DEPEND: gtk? ( dev-libs/glib:2= ) jpeg? ( virtual/jpeg:0= ) png? ( media-libs/libpng:0=
    ) media-video/ffmpeg:=
  IUSE: gnome gtk jpeg png
  RDEPEND: gtk? ( dev-libs/glib:2= ) jpeg? ( virtual/jpeg:0= ) png? ( media-libs/libpng:0=
    ) media-video/ffmpeg:=
  emerge.packages: media-video/ffmpegthumbnailer
  kit: media-kit
  original.package.name: media-video/ffmpegthumbnailer
  original.package.slot: "0"
  original.package.version: 2.3.0
