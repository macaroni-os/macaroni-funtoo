name: nftables
version: 1.1.4
category: net-firewall
use_flags:
- -doc
- cli
- gmp
- json
requires:
- name: gmp
  version: '>=0'
  category: dev-libs
- name: jansson
  version: '>=0'
  category: dev-libs
- name: libedit
  version: '>=0'
  category: dev-libs
- name: libnftnl
  version: '>=0'
  category: net-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Linux kernel (3.13+) firewall, NAT and packet mangling tools
uri:
- https://netfilter.org/projects/nftables/
license: GPL-2
labels:
  BDEPEND: '>=app-portage/elt-patches-20170815 || ( >=sys-devel/automake-1.16.5:1.16
    ) >=sys-devel/autoconf-2.71 >=sys-devel/libtool-2.4'
  DEPEND: net-libs/libmnl gmp? ( dev-libs/gmp:0= ) json? ( dev-libs/jansson ) cli?
    ( dev-libs/libedit:0= ) >=net-libs/libnftnl-1.2.9 app-text/docbook2X doc? ( app-text/dblatex
    ) sys-devel/bison sys-devel/flex virtual/pkgconfig
  IUSE: debug +cli doc +gmp json +modern_kernel python xtables
  RDEPEND: net-libs/libmnl gmp? ( dev-libs/gmp:0= ) json? ( dev-libs/jansson ) cli?
    ( dev-libs/libedit:0= ) >=net-libs/libnftnl-1.2.9
  emerge.packages: net-firewall/nftables
  kit: net-kit
  original.package.name: net-firewall/nftables
  original.package.slot: "0"
  original.package.version: 1.1.4
