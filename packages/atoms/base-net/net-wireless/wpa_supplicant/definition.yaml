name: wpa_supplicant
version: 2.11+3
category: net-wireless
use_flags:
- -qt5
- -selinux
- dbus
- eap-sim
- kernel_linux
- readline
requires:
- name: crda
  version: '>=0'
  category: net-wireless
- name: dbus
  version: '>=0'
  category: sys-apps
- name: pcsc-lite
  version: '>=0'
  category: sys-apps
- name: readline
  version: '>=0'
  category: sys-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: IEEE 802.1X/WPA supplicant for secure wireless transfers
uri:
- https://w1.fi/wpa_supplicant/
license: '|| ( GPL-2 BSD )'
labels:
  BDEPEND: virtual/pkgconfig
  DEPEND: dbus? ( sys-apps/dbus ) kernel_linux? ( dev-libs/libnl:3 net-wireless/crda
    eap-sim? ( sys-apps/pcsc-lite ) ) qt5? ( dev-qt/qtcore:5 dev-qt/qtgui:5 dev-qt/qtsvg:5
    dev-qt/qtwidgets:5 ) readline? ( sys-libs/ncurses:0= sys-libs/readline:0= ) dev-libs/openssl
    virtual/pkgconfig
  IUSE: ap bindist dbus eap-sim eapol_test fasteap +fils +hs2-0 macsec p2p privsep
    ps3 qt5 readline selinux smartcard tdls uncommon-eap-types wimax wps kernel_linux
  RDEPEND: dbus? ( sys-apps/dbus ) kernel_linux? ( dev-libs/libnl:3 net-wireless/crda
    eap-sim? ( sys-apps/pcsc-lite ) ) qt5? ( dev-qt/qtcore:5 dev-qt/qtgui:5 dev-qt/qtsvg:5
    dev-qt/qtwidgets:5 ) readline? ( sys-libs/ncurses:0= sys-libs/readline:0= ) dev-libs/openssl
    selinux? ( sec-policy/selinux-networkmanager )
  emerge.packages: net-wireless/wpa_supplicant
  kit: net-kit
  original.package.name: net-wireless/wpa_supplicant
  original.package.slot: "0"
  original.package.version: 2.11-r1
