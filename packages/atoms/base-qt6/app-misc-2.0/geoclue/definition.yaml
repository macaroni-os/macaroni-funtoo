name: geoclue
version: 2.8.0
category: app-misc-2.0
use_flags:
- -gtk-doc
- -vala
- introspection
- modemmanager
- zeroconf
requires:
- name: json-glib
  version: '>=0'
  category: dev-libs
- name: avahi
  version: '>=0'
  category: net-dns
- name: libsoup
  version: '>=0'
  category: net-libs-3
- name: modemmanager
  version: '>=0'
  category: net-misc
- name: libnotify
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Location information D-Bus service
