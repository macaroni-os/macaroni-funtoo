    sys-apps/dbus dev-util/desktop-file-utils x11-misc/shared-mime-info sys-apps/shadow
  IUSE: +introspection gtk-doc modemmanager vala zeroconf
  RDEPEND: dev-libs/glib:2 dev-libs/json-glib net-libs/libsoup:3 introspection? (
    dev-libs/gobject-introspection:= ) modemmanager? ( net-misc/modemmanager ) zeroconf?
    ( net-dns/avahi ) x11-libs/libnotify sys-apps/dbus
  emerge.packages: app-misc/geoclue:2.0
  kit: gnome-kit
  original.package.name: app-misc/geoclue
  original.package.slot: "2.0"
  original.package.version: 2.8.0
