    ) dev-util/gdbus-codegen gtk-doc? ( app-text/docbook-xml-dtd:4.1.2 dev-util/gtk-doc
    ) sys-devel/gettext virtual/pkgconfig vala? ( || ( dev-lang/vala:0.56 dev-lang/vala:0.54
    dev-lang/vala:0.52 dev-lang/vala:0.50 dev-lang/vala:0.48 dev-lang/vala:0.46 dev-lang/vala:0.44
    dev-lang/vala:0.42 dev-lang/vala:0.40 dev-lang/vala:0.36 ) ) >=dev-util/meson-0.48.2
    >=dev-util/ninja-1.7.2 virtual/pkgconfig'
  DEPEND: dev-libs/glib:2 dev-libs/json-glib net-libs/libsoup:3 introspection? ( dev-libs/gobject-introspection:=
