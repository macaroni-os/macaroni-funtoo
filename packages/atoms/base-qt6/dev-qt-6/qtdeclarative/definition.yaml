name: qtdeclarative
version: 6.10.1
category: dev-qt-6
use_flags:
- vulkan
requires:
- name: qtlanguageserver
  version: '>=0'
  category: dev-qt-6
- name: qtshadertools
  version: '>=0'
  category: dev-qt-6
- name: qtsvg
  version: '>=0'
  category: dev-qt-6
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: A declarative framework for building highly dynamic applications with
  custom UIs
uri:
- https://invent.kde.org/qt/qt/
license: '|| ( GPL-2 GPL-3 LGPL-3 ) FDL-1.3'
labels:
  BDEPEND: '|| ( dev-lang/python:3.8 dev-lang/python:3.9 dev-lang/python:3.7 dev-lang/python:3.10
    ) dev-util/ninja dev-util/cmake dev-lang/perl virtual/pkgconfig'
  DEPEND: dev-qt/qtbase:6[gui,sql,vulkan] dev-qt/qtlanguageserver:6 dev-qt/qtshadertools:6
    dev-qt/qtsvg:6 vulkan? ( dev-util/vulkan-headers )
  IUSE: +jit vulkan debug test
  RDEPEND: dev-qt/qtbase:6[gui,sql,vulkan] dev-qt/qtlanguageserver:6 dev-qt/qtshadertools:6
    dev-qt/qtsvg:6
  emerge.packages: dev-qt/qtdeclarative:6
  kit: qt-kit
  original.package.name: dev-qt/qtdeclarative
  original.package.slot: "6"
  original.package.version: 6.10.1
