name: libcxx
version: 16.0.6
category: sys-libs
use_flags:
- clang
- libcxxabi
requires:
- name: libcxxabi
  version: '>=0'
  category: sys-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: New implementation of the C++ standard library, targeting C++11
uri:
- https://libcxx.llvm.org/
license: Apache-2.0-with-LLVM-exceptions UoI-NCSA BSD public-domain rc
labels:
