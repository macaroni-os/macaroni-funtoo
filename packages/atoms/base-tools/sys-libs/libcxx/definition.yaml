    ) sys-devel/llvm:16
  IUSE: static-libs clang +libcxxabi +libunwind
  RDEPEND: libcxxabi? ( ~sys-libs/libcxxabi-16.0.6[static-libs?] ) !libcxxabi? ( sys-devel/gcc[cxx]
    )
  emerge.packages: sys-libs/libcxx
  kit: llvm-kit
  original.package.name: sys-libs/libcxx
  original.package.slot: "0"
  original.package.version: 16.0.6-r1
