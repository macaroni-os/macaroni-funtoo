    ) X? ( x11-libs/libX11 x11-libs/libXt ) valgrind? ( dev-util/valgrind ) X? ( x11-base/xorg-proto
    ) sys-apps/shadow
  IUSE: debug doc elogind static-libs systemd valgrind user-session X
  RDEPEND: dev-libs/expat elogind? ( sys-auth/elogind:= ) systemd? ( sys-apps/systemd:=
    ) X? ( x11-libs/libX11 x11-libs/libXt ) systemd? ( virtual/tmpfiles ) virtual/tmpfiles
