name: libraw
version: 0.21.5
category: media-libs
use_flags:
- jpeg
- jpeg2k
- lcms
requires:
- name: jasper
  version: '>=0'
  category: media-libs
- name: lcms
  version: '>=0'
  category: media-libs-2
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: LibRaw is a library for reading RAW files obtained from digital photo
  cameras
uri:
- https://www.libraw.org/
- https://github.com/LibRaw/LibRaw
license: LGPL-2.1 CDDL
labels:
  BDEPEND: virtual/pkgconfig >=app-portage/elt-patches-20170815 || ( >=sys-devel/automake-1.16.5:1.16
    ) >=sys-devel/autoconf-2.71 >=sys-devel/libtool-2.4
  DEPEND: jpeg? ( media-libs/libjpeg-turbo:= ) lcms? ( media-libs/lcms ) zlib? ( sys-libs/zlib
    )
  IUSE: examples hardened jpeg +lcms openmp zlib
  RDEPEND: jpeg? ( media-libs/libjpeg-turbo:= ) lcms? ( media-libs/lcms ) zlib? (
    sys-libs/zlib )
  emerge.packages: media-libs/libraw
  kit: media-kit
  original.package.name: media-libs/libraw
  original.package.slot: "0"
  original.package.version: 0.21.5
