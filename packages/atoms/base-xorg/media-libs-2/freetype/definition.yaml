name: freetype
version: 2.14.1
category: media-libs-2
use_flags:
- -brotli
- -harfbuzz
- X
- bzip2
- png
- utils
- fontforge
requires:
- name: bzip2
  version: '>=0'
  category: app-arch
- name: libpng
  version: '>=0'
  category: media-libs
- name: libX11
  version: '>=0'
  category: x11-libs
- name: libXau
  version: '>=0'
  category: x11-libs
- name: libXdmcp
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: A high-quality and portable font engine
uri:
- https://www.freetype.org/
license: '|| ( FTL GPL-2+ )'
labels:
  BDEPEND: virtual/pkgconfig >=app-portage/elt-patches-20170815
  DEPEND: sys-libs/zlib brotli? ( app-arch/brotli ) bzip2? ( app-arch/bzip2 ) harfbuzz?
    ( media-libs/harfbuzz[truetype] ) png? ( media-libs/libpng ) utils? ( X? ( x11-libs/libX11
    x11-libs/libXau x11-libs/libXdmcp ) )
  IUSE: X +adobe-cff brotli bzip2 +cleartype_hinting debug fontforge harfbuzz png
    static-libs utils
  RDEPEND: sys-libs/zlib brotli? ( app-arch/brotli ) bzip2? ( app-arch/bzip2 ) harfbuzz?
    ( media-libs/harfbuzz[truetype] ) png? ( media-libs/libpng ) utils? ( X? ( x11-libs/libX11
    x11-libs/libXau x11-libs/libXdmcp ) )
  emerge.packages: media-libs/freetype:2
  kit: xorg-kit
  original.package.name: media-libs/freetype
  original.package.slot: "2"
  original.package.version: 2.14.1
