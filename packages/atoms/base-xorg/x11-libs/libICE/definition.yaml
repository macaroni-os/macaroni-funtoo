name: libICE
version: 1.1.2
category: x11-libs
use_flags:
- -doc
- -ppc-aix
- -x86-winnt
- elibc_glibc
requires:
- name: libbsd
  version: '>=0'
  category: dev-libs
- name: xorg-proto
  version: '>=0'
  category: x11-base
- name: xtrans
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: X.Org Inter-Client Exchange library
uri:
- https://www.x.org/wiki/
- https://gitlab.freedesktop.org/xorg/lib/libICE
license: MIT
labels:
  BDEPEND: virtual/pkgconfig >=app-portage/elt-patches-20170815 || ( >=sys-devel/automake-1.16.5:1.16
    ) >=sys-devel/autoconf-2.71 >=sys-devel/libtool-2.4
  DEPEND: '|| ( sys-libs/glibc dev-libs/libbsd ) x11-libs/xtrans sys-devel/autoconf
    sys-devel/automake sys-devel/libtool sys-devel/m4 x11-misc/util-macros media-fonts/font-util
    x11-base/xorg-proto'
  IUSE: ipv6
  RDEPEND: '|| ( sys-libs/glibc dev-libs/libbsd ) x11-libs/xtrans'
  emerge.packages: x11-libs/libICE
  kit: xorg-kit
  original.package.name: x11-libs/libICE
  original.package.slot: "0"
  original.package.version: 1.1.2
