    sys-devel/libtool sys-devel/m4 x11-misc/util-macros media-fonts/font-util x11-base/xorg-proto
    zlib? ( sys-libs/zlib:= )
  IUSE: zlib
  RDEPEND: x11-libs/libX11 x11-libs/libXext sys-apps/hwdata
  emerge.packages: x11-libs/libpciaccess
  kit: xorg-kit
  original.package.name: x11-libs/libpciaccess
  original.package.slot: "0"
  original.package.version: 0.18.1
