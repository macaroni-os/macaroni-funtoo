name: libpciaccess
version: 0.18.1
category: x11-libs
use_flags:
- -ppc-aix
- -x86-winnt
- zlib
requires:
- name: hwids
  version: '>=0'
  category: sys-apps
- name: zlib
  version: '>=0'
  category: sys-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Library providing generic access to the PCI bus and devices
