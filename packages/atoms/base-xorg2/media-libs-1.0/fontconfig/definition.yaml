name: fontconfig
version: 2.17.1
category: media-libs-1.0
use_flags:
- -doc
- -elibc_Darwin
requires:
- name: expat
  version: '>=0'
  category: dev-libs
- name: freetype
  version: '>=0'
  category: media-libs-2
- name: libintl
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: A library for configuring and customizing font access
uri:
- https://fontconfig.org/
license: MIT
labels:
  BDEPEND: virtual/pkgconfig >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: dev-libs/expat media-libs/freetype virtual/libintl sys-devel/gettext doc?
    ( =app-text/docbook-sgml-dtd-3.1* app-text/docbook-sgml-utils[jadetex] )
  IUSE: doc static-libs nls
  RDEPEND: dev-libs/expat media-libs/freetype virtual/libintl
  emerge.packages: media-libs/fontconfig:1.0
  kit: core-gl-kit
  original.package.name: media-libs/fontconfig
  original.package.slot: "1.0"
  original.package.version: 2.17.1
