name: freeglut
version: 3.8.0
category: media-libs
requires:
- name: glu
  version: '>=0'
  category: virtual
- name: opengl
  version: '>=0'
  category: virtual
- name: libXi
  version: '>=0'
  category: x11-libs
- name: libXrandr
  version: '>=0'
  category: x11-libs
- name: libXxf86vm
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Free implementation of the OpenGL Utility Toolkit (GLUT)
uri:
- http://freeglut.sourceforge.net
license: NOASSERTION
labels:
  BDEPEND: virtual/pkgconfig dev-util/ninja dev-util/cmake
  DEPEND: virtual/glu virtual/opengl x11-libs/libX11 x11-libs/libXext x11-libs/libXi
    x11-libs/libXrandr x11-libs/libXxf86vm x11-base/xorg-proto
  IUSE: static-libs
  RDEPEND: virtual/glu virtual/opengl x11-libs/libX11 x11-libs/libXext x11-libs/libXi
    x11-libs/libXrandr x11-libs/libXxf86vm
  emerge.packages: media-libs/freeglut
  kit: core-gl-kit
  original.package.name: media-libs/freeglut
  original.package.slot: "0"
  original.package.version: 3.8.0
