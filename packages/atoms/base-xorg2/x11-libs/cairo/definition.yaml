name: cairo
version: 1.18.4
category: x11-libs
use_flags:
- -gles2
- X
- glib
- opengl
- xcb
requires:
- name: glib
  version: '>=0'
  category: dev-libs-2
- name: lzo
  version: '>=0'
  category: dev-libs-2
- name: fontconfig
  version: '>=0'
  category: media-libs-1.0
- name: mesa
  version: '>=0'
  category: media-libs
- name: binutils-libs
  version: '>=0'
  category: sys-libs
- name: libXrender
  version: '>=0'
  category: x11-libs
- name: pixman
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: A vector graphics library with cross-device output support
uri:
- https://www.cairographics.org/
- https://gitlab.freedesktop.org/cairo/cairo
license: '|| ( LGPL-2.1 MPL-1.1 )'
labels:
  BDEPEND: '|| ( dev-lang/python:3.8 dev-lang/python:3.9 dev-lang/python:3.7 dev-lang/python:3.10
    ) virtual/pkgconfig gtk-doc? ( dev-util/gtk-doc ) >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2'
  DEPEND: media-libs/fontconfig media-libs/freetype:2[png] media-libs/libpng:0= sys-libs/zlib
    x11-libs/pixman debug? ( sys-libs/binutils-libs:0= ) glib? ( dev-libs/glib:2 )
    lzo? ( dev-libs/lzo:2 ) X? ( x11-libs/libXrender x11-libs/libXext x11-libs/libX11
    x11-libs/libxcb ) X? ( x11-base/xorg-proto )
  IUSE: X aqua debug +glib gtk-doc lzo
  RDEPEND: media-libs/fontconfig media-libs/freetype:2[png] media-libs/libpng:0= sys-libs/zlib
    x11-libs/pixman debug? ( sys-libs/binutils-libs:0= ) glib? ( dev-libs/glib:2 )
    lzo? ( dev-libs/lzo:2 ) X? ( x11-libs/libXrender x11-libs/libXext x11-libs/libX11
    x11-libs/libxcb )
  emerge.packages: x11-libs/cairo
  kit: xorg-kit
  original.package.name: x11-libs/cairo
  original.package.slot: "0"
  original.package.version: 1.18.4
