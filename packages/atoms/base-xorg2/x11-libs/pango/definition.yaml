name: pango
version: 1.57.0
category: x11-libs
use_flags:
- -sysprof
- X
- introspection
requires:
- name: fribidi
  version: '>=0'
  category: dev-libs
- name: harfbuzz
  version: '>=0'
  category: media-libs
- name: libXft
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Internationalized text layout and rendering library
uri:
- https://www.pango.org/
- https://gitlab.gnome.org/GNOME/pango
license: LGPL-2+
labels:
  BDEPEND: sys-apps/help2man virtual/pkgconfig >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: dev-libs/glib:2 dev-libs/fribidi media-libs/harfbuzz:=[glib(+),introspection?,truetype(+)]
    >=media-libs/fontconfig-2.17.1:1.0= x11-libs/cairo:=[X?] media-libs/freetype:2=
    introspection? ( >=dev-libs/gobject-introspection-1.83.2:= ) X? ( x11-libs/libX11
    x11-libs/libXft x11-libs/libXrender ) sysprof? ( dev-util/sysprof-capture ) X?
    ( x11-base/xorg-proto ) dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: debug doc +introspection sysprof X
  RDEPEND: dev-libs/glib:2 dev-libs/fribidi media-libs/harfbuzz:=[glib(+),introspection?,truetype(+)]
    >=media-libs/fontconfig-2.17.1:1.0= x11-libs/cairo:=[X?] media-libs/freetype:2=
    introspection? ( >=dev-libs/gobject-introspection-1.83.2:= ) X? ( x11-libs/libX11
    x11-libs/libXft x11-libs/libXrender )
  emerge.packages: x11-libs/pango
  kit: xorg-kit
  original.package.name: x11-libs/pango
  original.package.slot: "0"
  original.package.version: 1.57.0
