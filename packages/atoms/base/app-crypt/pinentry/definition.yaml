    || ( >=sys-devel/automake-1.16.5:1.16 ) >=sys-devel/autoconf-2.71 >=sys-devel/libtool-2.4
  DEPEND: dev-libs/libassuan:= dev-libs/libgcrypt dev-libs/libgpg-error efl? ( dev-libs/efl[X]
    ) gnome-keyring? ( app-crypt/libsecret ) ncurses? ( sys-libs/ncurses:= ) qt6?
    ( dev-qt/qtbase:6 wayland? ( kde-frameworks/kguiaddons:6 kde-frameworks/kwindowsystem:6
    ) )
  IUSE: efl gnome-keyring gtk ncurses qt6 wayland X
  RDEPEND: dev-libs/libassuan:= dev-libs/libgcrypt dev-libs/libgpg-error efl? ( dev-libs/efl[X]
    ) gnome-keyring? ( app-crypt/libsecret ) ncurses? ( sys-libs/ncurses:= ) qt6?
    ( dev-qt/qtbase:6 wayland? ( kde-frameworks/kguiaddons:6 kde-frameworks/kwindowsystem:6
    ) ) gtk? ( app-crypt/gcr:4 gnome-base/gnome-keyring )
  emerge.packages: app-crypt/pinentry
  kit: security-kit
  original.package.name: app-crypt/pinentry
  original.package.slot: "0"
  original.package.version: 1.3.3
