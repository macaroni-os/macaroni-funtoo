name: pinentry
version: 1.3.3
category: app-crypt
use_flags:
- -efl
- -gnome-keyring
- -gtk
- -qt5
- ncurses
requires:
- name: libassuan
  version: '>=0'
  category: dev-libs
- name: libgcrypt
  version: '>=0'
  category: dev-libs
- name: ncurses
  version: '>=0'
  category: sys-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Simple passphrase entry dialogs which utilize the Assuan protocol
uri:
- https://gnupg.org/aegypten2
license: GPL-2
labels:
