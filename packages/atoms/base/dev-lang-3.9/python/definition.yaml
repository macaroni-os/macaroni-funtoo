    || ( >=sys-devel/automake-1.16.5:1.16 ) >=sys-devel/autoconf-2.71
  DEPEND: app-arch/bzip2:= app-arch/xz-utils:= dev-libs/libffi:= sys-apps/util-linux:=
    sys-libs/zlib:= virtual/libintl gdbm? ( sys-libs/gdbm:=[berkdb] ) ncurses? ( sys-libs/ncurses:=
    ) readline? ( !libedit? ( sys-libs/readline:= ) libedit? ( dev-libs/libedit:=
    ) ) sqlite? ( dev-db/sqlite:3= ) dev-libs/openssl:= tk? ( dev-lang/tcl:= dev-lang/tk:=
    dev-tcltk/blt:= dev-tcltk/tix ) xml? ( dev-libs/expat:= ) bluetooth? ( net-wireless/bluez
    )
  IUSE: bluetooth build examples gdbm hardened libedit lto +ncurses pgo +readline
    +sqlite +ssl tk wininst +xml
  RDEPEND: app-arch/bzip2:= app-arch/xz-utils:= dev-libs/libffi:= sys-apps/util-linux:=
    sys-libs/zlib:= virtual/libintl gdbm? ( sys-libs/gdbm:=[berkdb] ) ncurses? ( sys-libs/ncurses:=
    ) readline? ( !libedit? ( sys-libs/readline:= ) libedit? ( dev-libs/libedit:=
    ) ) sqlite? ( dev-db/sqlite:3= ) dev-libs/openssl:= tk? ( dev-lang/tcl:= dev-lang/tk:=
    dev-tcltk/blt:= dev-tcltk/tix ) xml? ( dev-libs/expat:= ) !build? ( app-misc/mime-types
    )
  emerge.packages: dev-lang/python:3.9
  kit: python-kit
  original.package.name: dev-lang/python
  original.package.slot: "3.9"
  original.package.version: 3.9.25
