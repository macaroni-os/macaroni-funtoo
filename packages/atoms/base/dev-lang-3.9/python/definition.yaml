- name: xz-utils
  version: '>=0'
  category: app-arch
- name: mime-types
  version: '>=0'
  category: app-misc
- name: sqlite
  version: '>=0'
  category: dev-db-3
- name: expat
  version: '>=0'
  category: dev-libs
- name: libffi
  version: '>=0'
  category: dev-libs
- name: openssl
  version: '>=0'
  category: dev-libs
- name: util-linux
  version: '>=0'
  category: sys-apps
- name: gdbm
  version: '>=0'
  category: sys-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: An interpreted, interactive, object-oriented programming language
uri:
- https://www.python.org/
license: PSF-2
labels:
