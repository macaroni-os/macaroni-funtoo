name: openssl
version: 1.1.1w
category: dev-libs
use_flags:
- -sctp
- tls-compression
- weak-ssl-ciphers
requires:
- name: zlib
  version: '>=0'
  category: sys-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: TLS/SSL and crypto library
uri:
- https://github.com/openssl/openssl
license: Apache-2.0
labels:
  BDEPEND: '>=dev-lang/perl-5 sctp? ( >=net-misc/lksctp-tools-1.0.12 )'
  DEPEND: '!app-misc/c_rehash tls-compression? ( >=sys-libs/zlib-1.2.8-r1[static-libs(+)]
    )'
  IUSE: +asm -bindist libc_musl rfc3779 sctp cpu_flags_x86_sse2 weak-ssl-ciphers static-libs
    +tls-compression tls-heartbeat vanilla
  RDEPEND: '!app-misc/c_rehash tls-compression? ( >=sys-libs/zlib-1.2.8-r1[static-libs(+)]
    )'
  emerge.packages: dev-libs/openssl
  kit: security-kit
  original.package.name: dev-libs/openssl
  original.package.slot: "0"
  original.package.version: 1.1.1w
