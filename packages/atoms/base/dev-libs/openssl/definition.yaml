name: openssl
version: 3.0.19
category: dev-libs
use_flags:
- -sctp
- -test
- tls-compression
requires:
- name: zlib
  version: '>=0'
  category: sys-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: full-strength general purpose cryptography library (including SSL and
  TLS)
uri:
- https://www.openssl.org/
license: openssl
labels:
  BDEPEND: '>=dev-lang/perl-5 sctp? ( >=net-misc/lksctp-tools-1.0.12 )'
  DEPEND: '!app-misc/c_rehash tls-compression? ( >=sys-libs/zlib-1.2.8-r1[static-libs(+)]
    )'
  IUSE: +asm libc_musl rfc3779 sctp cpu_flags_x86_sse2 static-libs +tls-compression
    vanilla weak-ssl-ciphers
  RDEPEND: '!app-misc/c_rehash tls-compression? ( >=sys-libs/zlib-1.2.8-r1[static-libs(+)]
    )'
  emerge.packages: dev-libs/openssl
  kit: security-kit
  original.package.name: dev-libs/openssl
  original.package.slot: "0"
  original.package.version: 3.0.19
