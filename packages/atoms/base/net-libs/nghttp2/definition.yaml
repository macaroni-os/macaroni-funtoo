name: nghttp2
version: 1.66.0
category: net-libs
use_flags:
- -hpack-tools
- -jemalloc
- -libressl
- -test
- -utils
- -xml
- cxx
requires:
- name: boost
  version: '>=0'
  category: dev-libs
- name: openssl
  version: '>=0'
  category: dev-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: HTTP/2 C Library
uri:
- https://nghttp2.org/
license: MIT
labels:
  DEPEND: hpack-tools? ( >=dev-libs/jansson-2.5 ) jemalloc? ( dev-libs/jemalloc )
    utils? ( >=dev-libs/libev-4.15 >=sys-libs/zlib-1.2.3 net-dns/c-ares:= ) xml? (
    >=dev-libs/libxml2-2.7.7:2 ) dev-libs/openssl virtual/pkgconfig
  IUSE: debug hpack-tools jemalloc static-libs +threads utils xml
  RDEPEND: hpack-tools? ( >=dev-libs/jansson-2.5 ) jemalloc? ( dev-libs/jemalloc )
    utils? ( >=dev-libs/libev-4.15 >=sys-libs/zlib-1.2.3 net-dns/c-ares:= ) xml? (
    >=dev-libs/libxml2-2.7.7:2 )
  emerge.packages: net-libs/nghttp2
  kit: core-server-kit
  original.package.name: net-libs/nghttp2
  original.package.slot: "0"
  original.package.version: 1.66.0
