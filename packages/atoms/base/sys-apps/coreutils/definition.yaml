name: coreutils
version: "9.9"
category: sys-apps
use_flags:
- -gmp
- -hostname
- -kill
- -selinux
- -static
- -test
- acl
- caps
- nls
- xattr
requires:
- name: acl
  version: '>=0'
  category: sys-apps
- name: libcap
  version: '>=0'
  category: sys-libs
- name: libintl
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Standard GNU utilities (chmod, cp, dd, ls, sort, tr, head, wc, who,...)
uri:
- https://www.gnu.org/software/coreutils/
license: GPL-3
labels:
  BDEPEND: app-arch/xz-utils dev-lang/perl
  DEPEND: '!static? ( acl? ( sys-apps/acl ) caps? ( sys-libs/libcap ) gmp? ( dev-libs/gmp:=
    ) xattr? ( sys-apps/attr ) openssl? ( dev-libs/openssl:= ) ) static? ( acl? (
    sys-apps/acl[static-libs] ) caps? ( sys-libs/libcap[static-libs] ) gmp? ( dev-libs/gmp:=[static-libs]
    ) xattr? ( sys-apps/attr[static-libs] ) openssl? ( dev-libs/openssl:=[static-libs]
    ) )'
  IUSE: acl caps gmp hostname kill multicall nls +openssl +split-usr static xattr
  RDEPEND: '!static? ( acl? ( sys-apps/acl ) caps? ( sys-libs/libcap ) gmp? ( dev-libs/gmp:=
    ) xattr? ( sys-apps/attr ) openssl? ( dev-libs/openssl:= ) ) nls? ( virtual/libintl
    ) hostname? ( !sys-apps/net-tools[hostname] ) kill? ( !sys-apps/util-linux[kill]
    !sys-process/procps[kill] ) !<sys-apps/shadow-4.17.3'
  emerge.packages: sys-apps/coreutils
  kit: core-kit
  original.package.name: sys-apps/coreutils
  original.package.slot: "0"
  original.package.version: "9.9"
