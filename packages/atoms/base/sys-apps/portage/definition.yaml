name: portage
version: 4.0.2+1
category: sys-apps
use_flags:
- -apidoc
- -build
- -doc
- -elibc_glibc
- -elibc_musl
- -elibc_uclibc
- -kernel_linux
- -python_targets_python3_10
- -python_targets_python3_7
- -python_targets_python3_8
- -rsync-verify
- -selinux
- -test
- python_targets_python3_9
- xattr
requires:
- name: eselect
  version: '>=0'
  category: app-admin
- name: tar
  version: '>=0'
  category: app-arch
- name: zstd
  version: '>=0'
  category: app-arch
- name: pax-utils
  version: '>=0'
  category: app-misc
- name: bash
  version: '>=0'
  category: app-shells
- name: findutils
  version: '>=0'
  category: sys-apps
- name: tmpfiles
  version: '>=0'
  category: virtual
- name: macaronictl
  version: '>=0'
  category: app-admin
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Portage is the package management and distribution system for Gentoo
uri:
- https://wiki.gentoo.org/wiki/Project:Portage
license: GPL-2
labels:
  BDEPEND: python_targets_python3_10? ( dev-lang/python:3.10[bzip2(+),threads(+)]
    ) python_targets_python3_7? ( dev-lang/python:3.7[bzip2(+),threads(+)] ) python_targets_python3_9?
    ( dev-lang/python:3.9[bzip2(+),threads(+)] ) python_targets_python3_8? ( dev-lang/python:3.8[bzip2(+),threads(+)]
    ) >=dev-lang/python-exec-2:=[python_targets_python3_10(-)?,python_targets_python3_7(-)?,python_targets_python3_9(-)?,python_targets_python3_8(-)?,-python_single_target_python3_10(-),-python_single_target_python3_7(-),-python_single_target_python3_9(-),-python_single_target_python3_8(-)]
  DEPEND: '!build? ( python_targets_python3_10? ( dev-lang/python:3.10[ssl(+)] ) python_targets_python3_7?
    ( dev-lang/python:3.7[ssl(+)] ) python_targets_python3_9? ( dev-lang/python:3.9[ssl(+)]
    ) python_targets_python3_8? ( dev-lang/python:3.8[ssl(+)] ) ) app-arch/tar dev-lang/python-exec:2
    sys-apps/sed sys-devel/patch'
  IUSE: build +ipc +native-extensions xattr python_targets_python3_10 python_targets_python3_7
    python_targets_python3_9 python_targets_python3_8
  RDEPEND: app-arch/zstd app-arch/tar dev-lang/python-exec:2 sys-apps/findutils !build?
    ( sys-apps/sed app-shells/bash:0[readline] app-admin/eselect ) sys-apps/sandbox
    sys-apps/util-linux app-misc/pax-utils xattr? ( sys-apps/install-xattr ) python_targets_python3_10?
    ( dev-lang/python:3.10[bzip2(+),threads(+)] ) python_targets_python3_7? ( dev-lang/python:3.7[bzip2(+),threads(+)]
    ) python_targets_python3_9? ( dev-lang/python:3.9[bzip2(+),threads(+)] ) python_targets_python3_8?
    ( dev-lang/python:3.8[bzip2(+),threads(+)] ) >=dev-lang/python-exec-2:=[python_targets_python3_10(-)?,python_targets_python3_7(-)?,python_targets_python3_9(-)?,python_targets_python3_8(-)?,-python_single_target_python3_10(-),-python_single_target_python3_7(-),-python_single_target_python3_9(-),-python_single_target_python3_8(-)]
    virtual/tmpfiles
  emerge.packages: sys-apps/portage
  kit: portage-kit
  original.package.name: sys-apps/portage
  original.package.slot: "0"
  original.package.version: 4.0.2
