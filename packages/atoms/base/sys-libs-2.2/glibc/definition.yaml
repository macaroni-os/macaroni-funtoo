name: glibc
version: "2.41"
category: sys-libs-2.2
use_flags:
- -audit
- -caps
- -compile-locales
- -doc
- -gd
- -nscd
- -perl
- -selinux
- -suid
- -systemtap
- -test
- -vanilla
requires:
- name: libidn2
  version: '>=0'
  category: net-dns
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: GNU libc C library
uri:
- https://www.gnu.org/software/libc/
license: LGPL-2.1+ BSD HPND ISC inner-net rc PCRE
labels:
  BDEPEND: '|| ( dev-lang/python:3.8 dev-lang/python:3.9 dev-lang/python:3.7 dev-lang/python:3.10
    ) >=app-misc/pax-utils-1.3.3 sys-devel/bison compile-locales? ( sys-apps/locale-gen
    ) doc? ( dev-lang/perl sys-apps/texinfo ) test? ( dev-lang/perl >=net-dns/libidn2-2.3.0
    sys-apps/gawk[mpfr] ) >=sys-devel/binutils-2.27 >=sys-devel/gcc-6.2 virtual/pkgconfig'
  DEPEND: gd? ( media-libs/gd:2= ) nscd? ( selinux? ( audit? ( sys-process/audit )
    caps? ( sys-libs/libcap ) ) ) suid? ( caps? ( sys-libs/libcap ) ) selinux? ( sys-libs/libselinux
    ) systemtap? ( dev-debug/systemtap ) virtual/os-headers sys-devel/gnuconfig
  IUSE: audit caps cet compile-locales custom-cflags doc gd hash-sysv-compat nscd
    perl profile selinux +ssp stack-realign +static-libs suid systemd systemtap test
    vanilla
  RDEPEND: gd? ( media-libs/gd:2= ) nscd? ( selinux? ( audit? ( sys-process/audit
    ) caps? ( sys-libs/libcap ) ) ) suid? ( caps? ( sys-libs/libcap ) ) selinux? (
    sys-libs/libselinux ) systemtap? ( dev-debug/systemtap ) !<app-misc/pax-utils-1.3.3
    !<sys-apps/systemd-254.9 perl? ( dev-lang/perl ) >=net-dns/libidn2-2.3.0 vanilla?
    ( !sys-libs/timezone-data )
  emerge.packages: sys-libs/glibc:2.2
  kit: core-kit
  original.package.name: sys-libs/glibc
  original.package.slot: "2.2"
  original.package.version: 2.41-r1
