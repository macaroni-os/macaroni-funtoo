name: libc
version: "3"
category: virtual
use_flags:
- -elibc_musl
- -elibc_uclibc
- elibc_glibc
requires:
- name: locale-gen
  version: '>=0'
  category: sys-apps
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Virtual for C library
labels:
  DEPEND: elibc_glibc? ( >=sys-libs/glibc-2.41 sys-apps/locale-gen ) elibc_musl? (
    sys-libs/musl ) elibc_uclibc? ( sys-libs/uclibc-ng )
  RDEPEND: elibc_glibc? ( >=sys-libs/glibc-2.41 sys-apps/locale-gen ) elibc_musl?
    ( sys-libs/musl ) elibc_uclibc? ( sys-libs/uclibc-ng )
  emerge.packages: virtual/libc
  kit: core-kit
  original.package.name: virtual/libc
  original.package.slot: "0"
  original.package.version: "3"
