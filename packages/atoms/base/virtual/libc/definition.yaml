name: libc
version: 2+2
category: virtual
use_flags:
- -elibc_musl
- -elibc_uclibc
- elibc_glibc
requires:
- name: glibc
  version: '>=0'
  category: sys-libs-2.2
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Virtual for C library
labels:
  RDEPEND: elibc_glibc? ( sys-libs/glibc ) elibc_musl? ( sys-libs/musl ) elibc_uclibc?
    ( sys-libs/uclibc-ng )
  emerge.packages: virtual/libc
  kit: core-kit
  original.package.name: virtual/libc
  original.package.slot: "0"
  original.package.version: "2"
