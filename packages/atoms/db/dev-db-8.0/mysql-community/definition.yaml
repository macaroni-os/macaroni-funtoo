name: mysql-community
version: 8.0.45
category: dev-db-8.0
use_flags:
- -cjk
- -jemalloc
- -numa
- server
- tcmalloc
- router
requires:
- name: lz4
  version: '>=0'
  category: app-arch
- name: zstd
  version: '>=0'
  category: app-arch
- name: mysql-init-scripts
  version: '>=0'
  category: dev-db
- name: icu
  version: '>=0'
  category: dev-libs
- name: libaio
  version: '>=0'
  category: dev-libs
- name: libevent
  version: '>=0'
  category: dev-libs
- name: protobuf
  version: '>=0'
  category: dev-libs
- name: google-perftools
  version: '>=0'
  category: dev-util
- name: libtirpc
  version: '>=0'
  category: net-libs
- name: procps
  version: '>=0'
  category: sys-process
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: A fast, multi-threaded, multi-user SQL database server
uri:
- https://www.mysql.com/
license: GPL-2
labels:
  BDEPEND: sys-devel/make dev-util/cmake
  DEPEND: app-arch/lz4:= app-arch/zstd:= sys-libs/ncurses:= sys-libs/zlib:= dev-libs/openssl:=
    server? ( dev-libs/icu:= dev-libs/libevent:=[ssl,threads] dev-libs/protobuf:=
    net-libs/libtirpc:= cjk? ( app-text/mecab:= ) jemalloc? ( dev-libs/jemalloc:=
    ) dev-libs/libaio:= sys-process/procps:= numa? ( sys-process/numactl ) tcmalloc?
    ( dev-util/google-perftools:= ) ) sys-devel/gcc virtual/yacc server? ( net-libs/rpcsvc-proto
    ) sys-apps/shadow
  IUSE: cjk cracklib debug jemalloc latin1 numa +perl profiling router +server tcmalloc
  RDEPEND: app-arch/lz4:= app-arch/zstd:= sys-libs/ncurses:= sys-libs/zlib:= dev-libs/openssl:=
    server? ( dev-libs/icu:= dev-libs/libevent:=[ssl,threads] dev-libs/protobuf:=
    net-libs/libtirpc:= cjk? ( app-text/mecab:= ) jemalloc? ( dev-libs/jemalloc:=
    ) dev-libs/libaio:= sys-process/procps:= numa? ( sys-process/numactl ) tcmalloc?
    ( dev-util/google-perftools:= ) ) !dev-db/mariadb dev-db/mysql-init-scripts
  emerge.packages: dev-db/mysql-community:8.0
  kit: core-server-kit
  original.package.name: dev-db/mysql-community
  original.package.slot: "8.0"
  original.package.version: 8.0.45
