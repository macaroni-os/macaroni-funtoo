name: telegram-desktop-bin
version: 6.0.2
category: net-im
requires:
- name: gobject-introspection
  version: '>=0'
  category: dev-libs
- name: fontconfig
  version: '>=0'
  category: media-libs-1.0
- name: dbus
  version: '>=0'
  category: sys-apps
- name: libX11
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Official desktop client for Telegram (binary package)
uri:
- https://desktop.telegram.org
license: GPL-3-with-openssl-exception
labels:
  DEPEND: dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: amd64
  RDEPEND: dev-libs/glib dev-libs/gobject-introspection media-libs/fontconfig sys-apps/dbus
    x11-libs/libX11 x11-libs/libxcb[xkb]
  emerge.packages: net-im/telegram-desktop-bin
  kit: desktop-kit
  original.package.name: net-im/telegram-desktop-bin
  original.package.slot: "0"
  original.package.version: 6.0.2
