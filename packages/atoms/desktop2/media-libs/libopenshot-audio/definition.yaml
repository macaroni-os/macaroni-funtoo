name: libopenshot-audio
version: 1.0.0
category: media-libs
requires:
- name: alsa-lib
  version: '>=0'
  category: media-libs
- name: freetype
  version: '>=0'
  category: media-libs-2
- name: zlib
  version: '>=0'
  category: sys-libs
- name: libXcursor
  version: '>=0'
  category: x11-libs
- name: libXinerama
  version: '>=0'
  category: x11-libs
- name: libXrandr
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Library for audio editing and playback used by OpenShot
uri:
- https://www.openshot.org/
license: GPL-3+
labels:
  BDEPEND: doc? ( app-doc/doxygen ) dev-util/ninja dev-util/cmake
  DEPEND: media-libs/alsa-lib sys-libs/zlib
  IUSE: doc
  RDEPEND: media-libs/alsa-lib sys-libs/zlib
  emerge.packages: media-libs/libopenshot-audio
  kit: media-kit
  original.package.name: media-libs/libopenshot-audio
  original.package.slot: "0"
  original.package.version: 1.0.0
