name: gnome-software
version: 49.2+1
category: gnome-extra
use_flags:
- -sysprof
- firmware
- flatpak
- udev
requires:
- name: json-glib
  version: '>=0'
  category: dev-libs
- name: gsettings-desktop-schemas
  version: '>=0'
  category: gnome-base
- name: flatpak
  version: '>=0'
  category: sys-apps
- name: fwupd
  version: '>=0'
  category: sys-apps
- name: gdk-pixbuf
  version: '>=0'
  category: x11-libs-2
- name: libadwaita
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Gnome install & update software
uri:
- https://wiki.gnome.org/Apps/Software
license: GPL-2+
labels:
  BDEPEND: dev-libs/libxml2 dev-util/gdbus-codegen sys-devel/gettext virtual/pkgconfig
    >=app-portage/elt-patches-20170815 app-arch/xz-utils >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: dev-libs/appstream:= x11-libs/gdk-pixbuf dev-libs/libxmlb:= x11-libs/gtk:4
    dev-libs/glib:2 dev-libs/json-glib net-libs/libsoup:3 x11-libs/libadwaita sysprof?
    ( dev-util/sysprof ) gnome-base/gsettings-desktop-schemas sys-auth/polkit firmware?
    ( sys-apps/fwupd ) flatpak? ( sys-apps/flatpak sys-fs/libostree ) udev? ( dev-libs/libgudev
    ) gnome-base/gsettings-desktop-schemas dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: dkms +firmware +flatpak gnome gtk-doc sysprof spell udev
  RDEPEND: dev-libs/appstream:= x11-libs/gdk-pixbuf dev-libs/libxmlb:= x11-libs/gtk:4
    dev-libs/glib:2 dev-libs/json-glib net-libs/libsoup:3 x11-libs/libadwaita sysprof?
    ( dev-util/sysprof ) gnome-base/gsettings-desktop-schemas sys-auth/polkit firmware?
    ( sys-apps/fwupd ) flatpak? ( sys-apps/flatpak sys-fs/libostree ) udev? ( dev-libs/libgudev
    ) gnome-base/gsettings-desktop-schemas
  emerge.packages: gnome-extra/gnome-software
  kit: gnome-kit
  original.package.name: gnome-extra/gnome-software
  original.package.slot: "0"
  original.package.version: "49.2"
