name: gitlab-runner-bin
version: 19.0.1
category: dev-util
use_flags:
- -systemd
requires:
- name: tmpfiles
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: GitLab Runner
uri:
- https://gitlab.com/gitlab-org/gitlab-runner
license: MIT
labels:
  BDEPEND: virtual/pkgconfig
  DEPEND: sys-apps/shadow
  IUSE: systemd
  RDEPEND: systemd? ( sys-apps/systemd ) !dev-util/gitlab-runner virtual/tmpfiles
  emerge.packages: dev-util/gitlab-runner-bin
  kit: core-server-kit
  original.package.name: dev-util/gitlab-runner-bin
  original.package.slot: "0"
  original.package.version: 19.0.1
