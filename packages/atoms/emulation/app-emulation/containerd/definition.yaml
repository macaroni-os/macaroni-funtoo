name: containerd
version: 2.2.3
category: app-emulation
use_flags:
- btrfs
- seccomp
requires:
- name: runc
  version: '>=0'
  category: app-emulation
- name: btrfs-progs
  version: '>=0'
  category: sys-fs
- name: cni-plugins
  version: '>=0'
  category: net-misc
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: An open and reliable container runtime
uri:
- https://containerd.io
license: Apache-2.0
labels:
  BDEPEND: virtual/pkgconfig dev-go/go-md2man >=dev-lang/go-1.12 app-arch/unzip virtual/pkgconfig
  DEPEND: btrfs? ( sys-fs/btrfs-progs ) seccomp? ( sys-libs/libseccomp )
  IUSE: apparmor btrfs device-mapper +cri hardened +seccomp systemd
  RDEPEND: btrfs? ( sys-fs/btrfs-progs ) seccomp? ( sys-libs/libseccomp ) app-emulation/runc
  emerge.packages: app-emulation/containerd
  kit: core-server-kit
  original.package.name: app-emulation/containerd
  original.package.slot: "0"
  original.package.version: 2.2.3
