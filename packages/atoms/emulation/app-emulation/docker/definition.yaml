name: docker
version: 29.4.1
category: app-emulation
use_flags:
- -apparmor
- -seccomp
- btrfs
- container-init
- overlay
requires:
- name: xz-utils
  version: '>=0'
  category: app-arch
- name: containerd
  version: '>=0'
  category: app-emulation
- name: sqlite
  version: '>=0'
  category: dev-db-3
- name: git
  version: '>=0'
  category: dev-vcs
- name: nftables
  version: '>=0'
  category: net-firewall
- name: procps
  version: '>=0'
  category: sys-process
- name: tini
  version: '>=0'
  category: sys-process
- name: entities-catalog
  version: '>=0'
  category: macaroni
conflicts:
- name: docker-proxy
  version: <24.0.0
  category: app-emulation
provides:
- name: docker-proxy
  version: 24.0.6
  category: app-emulation
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: The Moby Project - a collaborative project for the container ecosystem
  to assemble container-based systems
uri:
- https://mobyproject.org/
license: Apache-2.0
labels:
  BDEPEND: dev-go/go-md2man virtual/pkgconfig >=dev-lang/go-1.12 app-arch/unzip virtual/pkgconfig
    virtual/pkgconfig
  DEPEND: dev-db/sqlite:3 apparmor? ( sys-libs/libapparmor ) btrfs? ( sys-fs/btrfs-progs
    ) seccomp? ( sys-libs/libseccomp ) net-firewall/nftables:= sys-apps/shadow
  IUSE: apparmor btrfs +container-init +overlay2 seccomp systemd
  RDEPEND: dev-db/sqlite:3 apparmor? ( sys-libs/libapparmor ) btrfs? ( sys-fs/btrfs-progs
    ) seccomp? ( sys-libs/libseccomp ) net-firewall/nftables:= sys-process/procps
    dev-vcs/git app-arch/xz-utils app-emulation/containerd[apparmor?,btrfs?,seccomp?]
    app-emulation/runc[apparmor?,seccomp?] container-init? ( sys-process/tini[static]
    )
  emerge.packages: app-emulation/docker
  kit: core-server-kit
  original.package.name: app-emulation/docker
  original.package.slot: "0"
  original.package.version: 29.4.1
