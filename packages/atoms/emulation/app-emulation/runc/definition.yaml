name: runc
version: 1.4.2
category: app-emulation
use_flags:
- -apparmor
- seccomp
requires:
- name: libseccomp
  version: '>=0'
  category: sys-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: CLI tool for spawning and running containers according to the OCI specification
uri:
- https://www.opencontainers.org/
license: Apache-2.0
labels:
  BDEPEND: dev-go/go-md2man virtual/pkgconfig >=dev-lang/go-1.12 app-arch/unzip
  DEPEND: seccomp? ( sys-libs/libseccomp ) apparmor? ( sys-libs/libapparmor )
  IUSE: apparmor hardened +kmem +seccomp
  RDEPEND: seccomp? ( sys-libs/libseccomp ) apparmor? ( sys-libs/libapparmor )
  emerge.packages: app-emulation/runc
  kit: core-server-kit
  original.package.name: app-emulation/runc
  original.package.slot: "0"
  original.package.version: 1.4.2
