name: dqlite
version: 1.18.5
category: dev-libs
use_flags:
- -lz4
requires:
- name: sqlite
  version: '>=0'
  category: dev-db-3
- name: libuv
  version: '>=0'
  category: dev-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Embeddable, replicated and fault tolerant SQL engine
uri:
- https://dqlite.io
license: LGPL-3-with-linking-exception
labels:
  BDEPEND: virtual/pkgconfig >=app-portage/elt-patches-20170815 || ( >=sys-devel/automake-1.16.5:1.16
    ) >=sys-devel/autoconf-2.71 >=sys-devel/libtool-2.4
  DEPEND: dev-db/sqlite:3 dev-libs/libuv:= lz4? ( app-arch/lz4:= )
  IUSE: +lz4
  RDEPEND: dev-db/sqlite:3 dev-libs/libuv:= lz4? ( app-arch/lz4:= )
  emerge.packages: dev-libs/dqlite
  kit: dev-kit
  original.package.name: dev-libs/dqlite
  original.package.slot: "0"
  original.package.version: 1.18.5
