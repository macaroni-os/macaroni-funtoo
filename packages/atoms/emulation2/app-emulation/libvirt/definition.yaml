name: libvirt
version: 12.2.0
category: app-emulation
use_flags:
- -apparmor
- -dtrace
- -firewalld
- -iscsi-direct
- -rbd
- -sasl
- -selinux
- -wireshark-plugins
- -xen
- audit
- caps
- dbus
- fuse
- glusterfs
- iscsi
- libssh
- lvm
- nfs
- numa
- parted
- pcap
- policykit
- qemu
- udev
- virt-network
- virtualbox
- zfs
- lxc
requires:
- name: qemu
  version: '>=0'
  category: app-emulation
- name: scrub
  version: '>=0'
  category: app-misc
- name: json-c
  version: '>=0'
  category: dev-libs
- name: libnl
  version: '>=0'
  category: dev-libs-3
- name: openbsd-netcat
  version: '>=0'
  category: net-analyzer
- name: dnsmasq
  version: '>=0'
  category: net-dns
- name: ebtables
  version: '>=0'
  category: net-firewall
- name: nfs-utils
  version: '>=0'
  category: net-fs
- name: gnutls
  version: '>=0'
  category: net-libs
- name: libpcap
  version: '>=0'
  category: net-libs
- name: libssh2
  version: '>=0'
  category: net-libs
- name: radvd
  version: '>=0'
  category: net-misc
- name: dmidecode
  version: '>=0'
  category: sys-apps
- name: iproute2
  version: '>=0'
  category: sys-apps
- name: polkit
  version: '>=0'
  category: sys-auth
- name: open-iscsi
  version: '>=0'
  category: sys-block
- name: parted
  version: '>=0'
  category: sys-block
- name: zfs
  version: '>=0'
  category: sys-fs
- name: audit
  version: '>=0'
  category: sys-process
- name: numactl
  version: '>=0'
  category: sys-process
- name: numad
  version: '>=0'
  category: sys-process
- name: libpciaccess
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: C toolkit to manipulate virtual machines
uri:
- https://www.libvirt.org/
license: LGPL-2.1
labels:
  BDEPEND: virtual/pkgconfig >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: app-misc/scrub dev-libs/glib dev-libs/libgcrypt:0 dev-libs/libnl:3 dev-libs/libxml2
    net-analyzer/openbsd-netcat net-libs/gnutls:0= net-libs/libssh2 net-libs/libtirpc
    net-libs/rpcsvc-proto net-misc/curl sys-apps/dmidecode sys-apps/util-linux sys-devel/gettext
    sys-libs/ncurses:0= sys-libs/readline:= apparmor? ( sys-libs/libapparmor ) audit?
    ( sys-process/audit ) caps? ( sys-libs/libcap-ng ) dbus? ( sys-apps/dbus ) dtrace?
    ( dev-util/systemtap ) firewalld? ( net-firewall/firewalld ) fuse? ( sys-fs/fuse:0=
    ) glusterfs? ( sys-cluster/glusterfs ) iscsi? ( sys-block/open-iscsi ) iscsi-direct?
    ( net-libs/libiscsi ) libssh? ( net-libs/libssh ) lvm? ( sys-fs/lvm2[-device-mapper-only(-)]
    ) nfs? ( net-fs/nfs-utils ) numa? ( sys-process/numactl sys-process/numad ) parted?
    ( sys-block/parted[device-mapper] sys-fs/lvm2[-device-mapper-only(-)] ) pcap?
    ( net-libs/libpcap ) policykit? ( sys-auth/polkit ) qemu? ( app-emulation/qemu
    dev-libs/json-c ) rbd? ( sys-cluster/ceph ) sasl? ( dev-libs/cyrus-sasl ) virt-network?
    ( net-dns/dnsmasq[script] net-firewall/ebtables net-firewall/iptables[ipv6] net-misc/radvd
    sys-apps/iproute2[-minimal] ) virtualbox? ( || ( app-emulation/virtualbox app-emulation/virtualbox-bin
    ) ) wireshark-plugins? ( net-analyzer/wireshark:= ) xen? ( app-emulation/xen app-emulation/xen-tools:=
    ) udev? ( virtual/udev x11-libs/libpciaccess ) zfs? ( sys-fs/zfs ) || ( dev-lang/python:3.8
    dev-lang/python:3.9 dev-lang/python:3.7 dev-lang/python:3.10 ) app-text/xhtml1
    dev-lang/perl dev-libs/libxslt dev-perl/XML-XPath dev-python/docutils sys-apps/shadow
  IUSE: apparmor audit +caps +dbus dtrace firewalld fuse glusterfs iscsi iscsi-direct
    +libvirtd lvm libssh lxc +macvtap nfs nls numa openvz parted pcap policykit +qemu
    rbd sasl +udev +vepa virtualbox virt-network wireshark-plugins xen zfs
  RDEPEND: app-misc/scrub dev-libs/glib dev-libs/libgcrypt:0 dev-libs/libnl:3 dev-libs/libxml2
    net-analyzer/openbsd-netcat net-libs/gnutls:0= net-libs/libssh2 net-libs/libtirpc
    net-libs/rpcsvc-proto net-misc/curl sys-apps/dmidecode sys-apps/util-linux sys-devel/gettext
    sys-libs/ncurses:0= sys-libs/readline:= apparmor? ( sys-libs/libapparmor ) audit?
    ( sys-process/audit ) caps? ( sys-libs/libcap-ng ) dbus? ( sys-apps/dbus ) dtrace?
    ( dev-util/systemtap ) firewalld? ( net-firewall/firewalld ) fuse? ( sys-fs/fuse:0=
    ) glusterfs? ( sys-cluster/glusterfs ) iscsi? ( sys-block/open-iscsi ) iscsi-direct?
    ( net-libs/libiscsi ) libssh? ( net-libs/libssh ) lvm? ( sys-fs/lvm2[-device-mapper-only(-)]
    ) nfs? ( net-fs/nfs-utils ) numa? ( sys-process/numactl sys-process/numad ) parted?
    ( sys-block/parted[device-mapper] sys-fs/lvm2[-device-mapper-only(-)] ) pcap?
    ( net-libs/libpcap ) policykit? ( sys-auth/polkit ) qemu? ( app-emulation/qemu
    dev-libs/json-c ) rbd? ( sys-cluster/ceph ) sasl? ( dev-libs/cyrus-sasl ) virt-network?
    ( net-dns/dnsmasq[script] net-firewall/ebtables net-firewall/iptables[ipv6] net-misc/radvd
    sys-apps/iproute2[-minimal] ) virtualbox? ( || ( app-emulation/virtualbox app-emulation/virtualbox-bin
    ) ) wireshark-plugins? ( net-analyzer/wireshark:= ) xen? ( app-emulation/xen app-emulation/xen-tools:=
    ) udev? ( virtual/udev x11-libs/libpciaccess ) zfs? ( sys-fs/zfs )
  emerge.packages: app-emulation/libvirt
  kit: core-server-kit
  original.package.name: app-emulation/libvirt
  original.package.slot: "0"
  original.package.version: 12.2.0
