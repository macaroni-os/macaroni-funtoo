name: open-iscsi
version: 2.1.9+1
category: sys-block
use_flags:
- -infiniband
- -systemd
requires:
- name: kmod
  version: '>=0'
  category: sys-apps
- name: util-linux
  version: '>=0'
  category: sys-apps
- name: open-isns
  version: '>=0'
  category: sys-block
- name: lsscsi
  version: '>=0'
  category: sys-fs
- name: linux-headers
  version: '>=0'
  category: sys-kernel
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: A performant, transport independent, multi-platform implementation of
  RFC3720
uri:
- https://www.open-iscsi.com/
license: LGPL-3+ GPL-2+
labels:
  BDEPEND: virtual/pkgconfig >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2 virtual/pkgconfig
    virtual/pkgconfig
  DEPEND: dev-libs/openssl:= sys-apps/kmod sys-block/open-isns:= sys-kernel/linux-headers
    infiniband? ( sys-cluster/rdma-core ) systemd? ( sys-apps/systemd:= )
  IUSE: debug infiniband +tcp rdma systemd kernel_linux
  RDEPEND: dev-libs/openssl:= sys-apps/kmod sys-block/open-isns:= sys-kernel/linux-headers
    infiniband? ( sys-cluster/rdma-core ) systemd? ( sys-apps/systemd:= ) sys-fs/lsscsi
    sys-apps/util-linux
  emerge.packages: sys-block/open-iscsi
  kit: geaaru-kit
  original.package.name: sys-block/open-iscsi
  original.package.slot: "0"
  original.package.version: 2.1.9
