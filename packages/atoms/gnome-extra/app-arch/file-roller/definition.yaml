name: file-roller
version: 44.6+1
category: app-arch
use_flags:
- -gtk-doc
- introspection
- nautilus
requires:
- name: libarchive
  version: '>=0'
  category: app-arch
- name: json-glib
  version: '>=0'
  category: dev-libs
- name: nautilus
  version: '>=0'
  category: gnome-base
- name: cairo
  version: '>=0'
  category: x11-libs
- name: gdk-pixbuf
  version: '>=0'
  category: x11-libs-2
- name: pango
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Archive manager for GNOME
uri:
- https://gitlab.gnome.org/GNOME/file-roller
license: LGPL-2.1+
labels:
  BDEPEND: dev-util/itstool sys-devel/gettext virtual/pkgconfig gtk-doc? ( dev-util/gi-docgen
    ) >=app-portage/elt-patches-20170815 app-arch/xz-utils >=dev-util/meson-0.48.2
    >=dev-util/ninja-1.7.2
  DEPEND: dev-libs/glib:2 x11-libs/gtk:4[introspection?] x11-libs/libadwaita nautilus?
    ( gnome-base/nautilus ) dev-libs/json-glib app-arch/libarchive:= introspection?
    ( dev-libs/gobject-introspection:= ) x11-libs/cairo x11-libs/gdk-pixbuf x11-libs/pango
    dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: gtk-doc +introspection nautilus
  RDEPEND: dev-libs/glib:2 x11-libs/gtk:4[introspection?] x11-libs/libadwaita nautilus?
    ( gnome-base/nautilus ) dev-libs/json-glib app-arch/libarchive:= introspection?
    ( dev-libs/gobject-introspection:= ) x11-libs/cairo x11-libs/gdk-pixbuf x11-libs/pango
  emerge.packages: app-arch/file-roller
  kit: gnome-kit
  original.package.name: app-arch/file-roller
  original.package.slot: "0"
  original.package.version: "44.6"
