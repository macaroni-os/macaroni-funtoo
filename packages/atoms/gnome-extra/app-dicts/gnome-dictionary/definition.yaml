name: gnome-dictionary
version: "40.0"
category: app-dicts
use_flags:
- introspection
requires:
- name: gsettings-desktop-schemas
  version: '>=0'
  category: gnome-base
- name: cairo
  version: '>=0'
  category: x11-libs
- name: gtk+
  version: '>=0'
  category: x11-libs-3
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Dictionary utility for GNOME
uri:
- https://wiki.gnome.org/Apps/Dictionary
license: GPL-2+ LGPL-2.1+ FDL-1.1+
labels:
  BDEPEND: dev-util/gtk-doc-am dev-util/intltool dev-util/itstool sys-devel/gettext
    virtual/pkgconfig >=app-portage/elt-patches-20170815 app-arch/xz-utils >=dev-util/meson-0.48.2
    >=dev-util/ninja-1.7.2
  DEPEND: dev-libs/glib:2[dbus] x11-libs/cairo:= x11-libs/gtk+:3 x11-libs/pango introspection?
    ( dev-libs/gobject-introspection:= ) dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: debug +introspection ipv6
  RDEPEND: dev-libs/glib:2[dbus] x11-libs/cairo:= x11-libs/gtk+:3 x11-libs/pango introspection?
    ( dev-libs/gobject-introspection:= ) gnome-base/gsettings-desktop-schemas
  emerge.packages: app-dicts/gnome-dictionary
  kit: gnome-kit
  original.package.name: app-dicts/gnome-dictionary
  original.package.slot: "0"
  original.package.version: "40.0"
