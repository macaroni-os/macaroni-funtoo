name: libgepub
version: 0.7.3
category: app-text
use_flags:
- introspection
requires:
- name: libarchive
  version: '>=0'
  category: app-arch
- name: libsoup
  version: '>=0'
  category: net-libs-2.4
- name: webkit-gtk
  version: '>=0'
  category: net-libs-4
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: GObject based library for handling and rendering epub documents
uri:
- https://gitlab.gnome.org/GNOME/libgepub
license: LGPL-2
labels:
  BDEPEND: virtual/pkgconfig >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: app-arch/libarchive dev-libs/glib:2 dev-libs/libxml2 net-libs/libsoup:2.4
    net-libs/webkit-gtk:4 x11-libs/gtk+:3 introspection? ( dev-libs/gobject-introspection:=
    )
  IUSE: +introspection
  RDEPEND: app-arch/libarchive dev-libs/glib:2 dev-libs/libxml2 net-libs/libsoup:2.4
    net-libs/webkit-gtk:4 x11-libs/gtk+:3 introspection? ( dev-libs/gobject-introspection:=
    )
  emerge.packages: app-text/libgepub
  kit: text-kit
  original.package.name: app-text/libgepub
  original.package.slot: "0"
  original.package.version: 0.7.3
