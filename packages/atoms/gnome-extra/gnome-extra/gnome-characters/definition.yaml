  RDEPEND: dev-libs/gjs dev-libs/glib:2 dev-libs/gobject-introspection:= x11-libs/gtk:4[introspection]
    x11-libs/libadwaita:= x11-libs/gdk-pixbuf:2 x11-libs/pango[introspection] gnome-base/gnome-desktop
  emerge.packages: gnome-extra/gnome-characters
  kit: gnome-kit
  original.package.name: gnome-extra/gnome-characters
