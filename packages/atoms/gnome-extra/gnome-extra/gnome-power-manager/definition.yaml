name: gnome-power-manager
version: "43.0"
category: gnome-extra
use_flags:
- -test
- prefix
requires:
- name: upower
  version: '>=0'
  category: sys-power
- name: cairo
  version: '>=0'
  category: x11-libs
- name: gtk+
  version: '>=0'
  category: x11-libs-3
- name: adwaita-icon-theme
  version: '>=0'
  category: x11-themes
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: GNOME power management service
uri:
- https://projects.gnome.org/gnome-power-manager/
license: GPL-2
labels:
  BDEPEND: app-text/docbook-sgml-dtd:4.1 app-text/docbook-sgml-utils sys-devel/gettext
    virtual/pkgconfig >=app-portage/elt-patches-20170815 app-arch/xz-utils >=dev-util/meson-0.48.2
    >=dev-util/ninja-1.7.2
  DEPEND: dev-libs/glib:2 x11-libs/gtk+:3 x11-libs/cairo sys-power/upower:= x11-base/xorg-proto
    dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: test test
  RDEPEND: dev-libs/glib:2 x11-libs/gtk+:3 x11-libs/cairo sys-power/upower:= x11-themes/adwaita-icon-theme
  emerge.packages: gnome-extra/gnome-power-manager
  kit: gnome-kit
  original.package.name: gnome-extra/gnome-power-manager
  original.package.slot: "0"
  original.package.version: "43.0"
