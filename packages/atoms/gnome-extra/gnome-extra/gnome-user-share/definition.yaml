  DEPEND: dev-libs/glib:2 www-apache/mod_dnssd www-servers/apache[apache2_modules_dav,apache2_modules_dav_fs,apache2_modules_authn_file,apache2_modules_auth_digest,apache2_modules_authz_groupfile]
    dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: debug
  RDEPEND: dev-libs/glib:2 www-apache/mod_dnssd www-servers/apache[apache2_modules_dav,apache2_modules_dav_fs,apache2_modules_authn_file,apache2_modules_auth_digest,apache2_modules_authz_groupfile]
  emerge.packages: gnome-extra/gnome-user-share
  kit: gnome-kit
  original.package.name: gnome-extra/gnome-user-share
  original.package.slot: "0"
  original.package.version: "48.2"
