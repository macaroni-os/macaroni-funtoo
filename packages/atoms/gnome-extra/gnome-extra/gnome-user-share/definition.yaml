name: gnome-user-share
version: "48.2"
category: gnome-extra
requires:
- name: glib
  version: '>=0'
  category: dev-libs-2
- name: nautilus
  version: '>=0'
  category: gnome-base
- name: libcanberra
  version: '>=0'
  category: media-libs
- name: mod_dnssd
  version: '>=0'
  category: www-apache
- name: libnotify
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Personal file sharing for the GNOME desktop
uri:
- https://git.gnome.org/browse/gnome-user-share
license: GPL-2
labels:
