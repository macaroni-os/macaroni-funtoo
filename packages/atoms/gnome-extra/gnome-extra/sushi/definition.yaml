name: sushi
version: 46.0+1
category: gnome-extra
use_flags:
- papers
- wayland
requires:
- name: evince
  version: '>=0'
  category: app-text
- name: papers
  version: '>=0'
  category: app-text
- name: gjs
  version: '>=0'
  category: dev-libs
- name: freetype
  version: '>=0'
  category: media-libs-2
- name: harfbuzz
  version: '>=0'
  category: media-libs
- name: gtksourceview
  version: '>=0'
  category: x11-libs-4
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: A quick previewer for Nautilus, the GNOME file manager
uri:
- https://gitlab.gnome.org/GNOME/sushi
license: GPL-2+
labels:
  BDEPEND: sys-devel/gettext virtual/pkgconfig >=app-portage/elt-patches-20170815
    app-arch/xz-utils >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: media-libs/libepoxy papers? ( app-text/papers ) app-text/evince[introspection]
    media-libs/freetype x11-libs/gdk-pixbuf[introspection] dev-libs/glib:2 media-libs/gstreamer:1.0[introspection]
    media-libs/gst-plugins-base:1.0[introspection] x11-libs/gtk+:3[introspection,wayland?,X?]
    x11-libs/gtksourceview:4[introspection] media-libs/harfbuzz:= dev-libs/gobject-introspection:=
    dev-libs/gjs dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: wayland +X +papers
  RDEPEND: media-libs/libepoxy papers? ( app-text/papers ) app-text/evince[introspection]
    media-libs/freetype x11-libs/gdk-pixbuf[introspection] dev-libs/glib:2 media-libs/gstreamer:1.0[introspection]
    media-libs/gst-plugins-base:1.0[introspection] x11-libs/gtk+:3[introspection,wayland?,X?]
    x11-libs/gtksourceview:4[introspection] media-libs/harfbuzz:= dev-libs/gobject-introspection:=
    dev-libs/gjs gnome-base/nautilus
  emerge.packages: gnome-extra/sushi
  kit: gnome-kit
  original.package.name: gnome-extra/sushi
  original.package.slot: "0"
  original.package.version: 46.0-r1
