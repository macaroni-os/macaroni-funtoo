name: gnome-robots
version: "41.2"
category: games-arcade
requires:
- name: libgnome-games-support
  version: '>=0'
  category: dev-libs-1
- name: librsvg
  version: '>=0'
  category: gnome-base-2
- name: gsound
  version: '>=0'
  category: media-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Avoid the robots and make them crash into each other
uri:
- https://wiki.gnome.org/Apps/Robots
license: GPL-3+ CC-BY-SA-3.0
labels:
  BDEPEND: dev-libs/appstream-glib dev-util/itstool sys-devel/gettext virtual/pkgconfig
    >=app-portage/elt-patches-20170815 app-arch/xz-utils >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
    >=virtual/rust-1.37.0
  DEPEND: dev-libs/libgee:= dev-libs/glib:2 dev-libs/libgnome-games-support:1= media-libs/gsound
    x11-libs/gtk+:3 gnome-base/librsvg dev-util/desktop-file-utils x11-misc/shared-mime-info
  IUSE: debug
  RDEPEND: dev-libs/libgee:= dev-libs/glib:2 dev-libs/libgnome-games-support:1= media-libs/gsound
    x11-libs/gtk+:3 gnome-base/librsvg
  emerge.packages: games-arcade/gnome-robots
  kit: gnome-kit
  original.package.name: games-arcade/gnome-robots
  original.package.slot: "0"
  original.package.version: "41.2"
