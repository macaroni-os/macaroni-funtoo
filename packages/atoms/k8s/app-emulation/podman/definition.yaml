name: podman
version: 6.2.0
category: app-emulation
use_flags:
- apparmor
- btrfs
- cron
- systemd
requires:
- name: gpgme
  version: '>=0'
  category: app-crypt-1
- name: catatonit
  version: '>=0'
  category: app-emulation
- name: conmon
  version: '>=0'
  category: app-emulation
- name: containers-shortnames
  version: '>=0'
  category: app-emulation
- name: crun
  version: '>=0'
  category: app-emulation
- name: fuse-overlayfs
  version: '>=0'
  category: app-emulation
- name: netavark
  version: '>=0'
  category: app-emulation
- name: passt
  version: '>=0'
  category: app-emulation
- name: sqlite
  version: '>=0'
  category: dev-db-3
- name: libassuan
  version: '>=0'
  category: dev-libs
- name: shadow
  version: '>=0'
  category: sys-apps
- name: btrfs-progs
  version: '>=0'
  category: sys-fs
- name: libapparmor
  version: '>=0'
  category: sys-libs
- name: cron
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: A tool for managing OCI containers and pods with Docker-compatible CLI
uri:
- https://podman.io/
license: Apache-2.0
labels:
  BDEPEND: virtual/pkgconfig >=dev-lang/go-1.12 app-arch/unzip virtual/pkgconfig
  DEPEND: app-crypt/gpgme:= apparmor? ( sys-libs/libapparmor ) btrfs? ( sys-fs/btrfs-progs
    ) dev-db/sqlite:3 dev-libs/libassuan:= dev-libs/libgpg-error:= sys-apps/shadow:=
    sys-libs/libseccomp
  IUSE: apparmor btrfs cron systemd
  RDEPEND: app-crypt/gpgme:= apparmor? ( sys-libs/libapparmor ) btrfs? ( sys-fs/btrfs-progs
    ) dev-db/sqlite:3 dev-libs/libassuan:= dev-libs/libgpg-error:= sys-apps/shadow:=
    sys-libs/libseccomp app-emulation/aardvark-dns app-emulation/catatonit app-emulation/conmon
    app-emulation/containers-shortnames app-emulation/crun app-emulation/fuse-overlayfs
    app-emulation/netavark app-emulation/passt cron? ( virtual/cron ) systemd? ( sys-apps/systemd
    )
  emerge.packages: app-emulation/podman
  kit: core-server-kit
  original.package.name: app-emulation/podman
  original.package.slot: "0"
  original.package.version: 6.2.0
