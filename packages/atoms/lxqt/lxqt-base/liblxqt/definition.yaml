name: liblxqt
version: 2.3.0
category: lxqt-base
use_flags:
- backlight
requires:
- name: libqtxdg
  version: '>=0'
  category: dev-libs
- name: kwindowsystem
  version: '>=0'
  category: kde-frameworks-6
- name: polkit-qt
  version: '>=0'
  category: sys-auth
- name: libX11
  version: '>=0'
  category: x11-libs
- name: libXScrnSaver
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Core utility library for all LXQt components
uri:
- https://lxqt-project.org
license: LGPL-2.1+ BSD
labels:
  BDEPEND: dev-util/ninja dev-util/cmake
  DEPEND: dev-libs/libqtxdg dev-qt/qtbase:6[gui] kde-frameworks/kwindowsystem:6[X]
    x11-libs/libX11 x11-libs/libXScrnSaver backlight? ( >=sys-auth/polkit-qt-0.200.0[qt6]
    ) dev-util/lxqt-build-tools dev-qt/qttools:6[linguist]
  IUSE: +backlight
  RDEPEND: dev-libs/libqtxdg dev-qt/qtbase:6[gui] kde-frameworks/kwindowsystem:6[X]
    x11-libs/libX11 x11-libs/libXScrnSaver backlight? ( >=sys-auth/polkit-qt-0.200.0[qt6]
    )
  emerge.packages: lxqt-base/liblxqt
  kit: kde-kit
  original.package.name: lxqt-base/liblxqt
  original.package.slot: "0"
  original.package.version: 2.3.0
