name: lxqt-config
version: 2.3.2
category: lxqt-base
use_flags:
- monitor
- touchpad
requires:
- name: libkscreen
  version: '>=0'
  category: kde-plasma-6
- name: liblxqt
  version: '>=0'
  category: lxqt-base
- name: lxqt-menu-data
  version: '>=0'
  category: lxqt-base
- name: zlib
  version: '>=0'
  category: sys-libs
- name: libudev
  version: '>=0'
  category: virtual
- name: setxkbmap
  version: '>=0'
  category: x11-apps
- name: xf86-input-libinput
  version: '>=0'
  category: x11-drivers
- name: libXcursor
  version: '>=0'
  category: x11-libs
- name: libXi
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Tools to configure LXQt and the underlying operating system
uri:
- https://lxqt-project.org
license: GPL-2 GPL-2+ GPL-3 LGPL-2 LGPL-2+ LGPL-2.1+ WTFPL-2
labels:
  BDEPEND: dev-util/ninja dev-util/cmake
  DEPEND: dev-libs/libqtxdg dev-qt/qtbase:6[gui] dev-qt/qtsvg:6 lxqt-base/liblxqt
    lxqt-base/lxqt-menu-data sys-libs/zlib x11-apps/setxkbmap x11-libs/libxcb x11-libs/libX11
    x11-libs/libXcursor x11-libs/libXfixes monitor? ( kde-plasma/libkscreen:6 ) touchpad?
    ( virtual/libudev x11-drivers/xf86-input-libinput x11-libs/libXi ) dev-util/lxqt-build-tools
    dev-qt/qttools:6[linguist]
  IUSE: +monitor +touchpad
  RDEPEND: dev-libs/libqtxdg dev-qt/qtbase:6[gui] dev-qt/qtsvg:6 lxqt-base/liblxqt
    lxqt-base/lxqt-menu-data sys-libs/zlib x11-apps/setxkbmap x11-libs/libxcb x11-libs/libX11
    x11-libs/libXcursor x11-libs/libXfixes monitor? ( kde-plasma/libkscreen:6 ) touchpad?
    ( virtual/libudev x11-drivers/xf86-input-libinput x11-libs/libXi )
  emerge.packages: lxqt-base/lxqt-config
  kit: kde-kit
  original.package.name: lxqt-base/lxqt-config
  original.package.slot: "0"
  original.package.version: 2.3.2
