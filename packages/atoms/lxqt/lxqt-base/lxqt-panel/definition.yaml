name: lxqt-panel
version: 2.3.3
category: lxqt-base
use_flags:
- alsa
- cpuload
- kbindicator
- lm_sensors
- mount
- networkmonitor
- pulseaudio
- statusnotifier
- sysstat
- tray
- volume
requires:
- name: qtwayland
  version: '>=0'
  category: dev-qt-6
- name: solid
  version: '>=0'
  category: kde-frameworks-6
- name: layer-shell-qt
  version: '>=0'
  category: kde-plasma-6
- name: libsysstat
  version: '>=0'
  category: lxqt-base
- name: lxqt-globalkeys
  version: '>=0'
  category: lxqt-base
- name: lxqt-menu-data
  version: '>=0'
  category: lxqt-base
- name: alsa-lib
  version: '>=0'
  category: media-libs
- name: pavucontrol-qt
  version: '>=0'
  category: media-sound
- name: lm_sensors
  version: '>=0'
  category: sys-apps
- name: libstatgrab
  version: '>=0'
  category: sys-libs
- name: libXcomposite
  version: '>=0'
  category: x11-libs
- name: libXdamage
  version: '>=0'
  category: x11-libs
- name: libXrender
  version: '>=0'
  category: x11-libs
- name: libxkbcommon
  version: '>=0'
  category: x11-libs
- name: xcb-util-image
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: The LXQt desktop panel
uri:
- https://lxqt-project.org
license: LGPL-2.1 LGPL-2.1+
labels:
  BDEPEND: dev-util/ninja dev-util/cmake
  DEPEND: dev-libs/libqtxdg dev-libs/wayland dev-qt/qtbase:6[gui] dev-qt/qtsvg:6 dev-qt/qtwayland:6
    kde-frameworks/kwindowsystem:6[X] kde-plasma/layer-shell-qt:6 lxqt-base/liblxqt
    lxqt-base/lxqt-globalkeys lxqt-base/lxqt-menu-data x11-libs/libX11 cpuload? (
    sys-libs/libstatgrab ) kbindicator? ( x11-libs/libxkbcommon ) lm_sensors? ( sys-apps/lm_sensors
    ) mount? ( kde-frameworks/solid:6 ) networkmonitor? ( sys-libs/libstatgrab ) statusnotifier?
    ( dev-libs/libdbusmenu-lxqt dev-qt/qtbase:6 ) sysstat? ( lxqt-base/libsysstat
    ) tray? ( x11-libs/libxcb:= x11-libs/libXcomposite x11-libs/libXdamage x11-libs/libXrender
    x11-libs/libXtst x11-libs/xcb-util x11-libs/xcb-util-image ) volume? ( alsa? (
    media-libs/alsa-lib ) pulseaudio? ( media-sound/pulseaudio media-sound/pavucontrol-qt
    ) ) dev-util/lxqt-build-tools dev-qt/qttools:6[linguist] virtual/pkgconfig
  IUSE: +alsa colorpicker cpuload +desktopswitch +directorymenu dom +kbindicator +mainmenu
    +mount networkmonitor pulseaudio +quicklaunch lm_sensors +showdesktop +spacer
    +statusnotifier sysstat +taskbar tray +volume +worldclock
  RDEPEND: dev-libs/libqtxdg dev-libs/wayland dev-qt/qtbase:6[gui] dev-qt/qtsvg:6
    dev-qt/qtwayland:6 kde-frameworks/kwindowsystem:6[X] kde-plasma/layer-shell-qt:6
    lxqt-base/liblxqt lxqt-base/lxqt-globalkeys lxqt-base/lxqt-menu-data x11-libs/libX11
    cpuload? ( sys-libs/libstatgrab ) kbindicator? ( x11-libs/libxkbcommon ) lm_sensors?
    ( sys-apps/lm_sensors ) mount? ( kde-frameworks/solid:6 ) networkmonitor? ( sys-libs/libstatgrab
    ) statusnotifier? ( dev-libs/libdbusmenu-lxqt dev-qt/qtbase:6 ) sysstat? ( lxqt-base/libsysstat
    ) tray? ( x11-libs/libxcb:= x11-libs/libXcomposite x11-libs/libXdamage x11-libs/libXrender
    x11-libs/libXtst x11-libs/xcb-util x11-libs/xcb-util-image ) volume? ( alsa? (
    media-libs/alsa-lib ) pulseaudio? ( media-sound/pulseaudio media-sound/pavucontrol-qt
    ) )
  emerge.packages: lxqt-base/lxqt-panel
  kit: kde-kit
  original.package.name: lxqt-base/lxqt-panel
  original.package.slot: "0"
  original.package.version: 2.3.3
