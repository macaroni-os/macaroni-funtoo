name: lxqt-runner
version: 2.3.0
category: lxqt-base
requires:
- name: muParser
  version: '>=0'
  category: dev-cpp
- name: layer-shell-qt
  version: '>=0'
  category: kde-plasma-6
- name: lxqt-globalkeys
  version: '>=0'
  category: lxqt-base
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Tool used to launch programs quickly by typing their names
uri:
- https://lxqt-project.org
license: LGPL-2.1 LGPL-2.1+
labels:
  BDEPEND: dev-util/ninja dev-util/cmake
  DEPEND: dev-cpp/muParser dev-libs/libqtxdg dev-qt/qtbase:6[gui] kde-frameworks/kwindowsystem:6
    kde-plasma/layer-shell-qt:6 lxqt-base/liblxqt lxqt-base/lxqt-globalkeys dev-util/lxqt-build-tools
    dev-qt/qttools:6[linguist] virtual/pkgconfig
  RDEPEND: dev-cpp/muParser dev-libs/libqtxdg dev-qt/qtbase:6[gui] kde-frameworks/kwindowsystem:6
    kde-plasma/layer-shell-qt:6 lxqt-base/liblxqt lxqt-base/lxqt-globalkeys
  emerge.packages: lxqt-base/lxqt-runner
  kit: kde-kit
  original.package.name: lxqt-base/lxqt-runner
  original.package.slot: "0"
  original.package.version: 2.3.0
