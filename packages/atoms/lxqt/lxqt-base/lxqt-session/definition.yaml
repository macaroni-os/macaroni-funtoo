name: lxqt-session
version: 2.3.0
category: lxqt-base
use_flags:
- udev
requires:
- name: qtxdg-tools
  version: '>=0'
  category: app-misc
- name: layer-shell-qt
  version: '>=0'
  category: kde-plasma-6
- name: liblxqt
  version: '>=0'
  category: lxqt-base
- name: procps
  version: '>=0'
  category: sys-process
- name: libudev
  version: '>=0'
  category: virtual
- name: xdg-user-dirs
  version: '>=0'
  category: x11-misc
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: The LXQt session manager
uri:
- https://lxqt-project.org
license: LGPL-2.1 LGPL-2.1+
labels:
  BDEPEND: dev-util/ninja dev-util/cmake
  DEPEND: app-misc/qtxdg-tools dev-libs/libqtxdg dev-qt/qtbase:6[gui] kde-frameworks/kwindowsystem:6[X]
    kde-plasma/layer-shell-qt:6 lxqt-base/liblxqt sys-process/procps x11-libs/libX11
    x11-misc/xdg-user-dirs udev? ( virtual/libudev ) dev-util/lxqt-build-tools dev-qt/qttools:6[linguist]
  IUSE: +udev
  RDEPEND: app-misc/qtxdg-tools dev-libs/libqtxdg dev-qt/qtbase:6[gui] kde-frameworks/kwindowsystem:6[X]
    kde-plasma/layer-shell-qt:6 lxqt-base/liblxqt sys-process/procps x11-libs/libX11
    x11-misc/xdg-user-dirs udev? ( virtual/libudev )
  emerge.packages: lxqt-base/lxqt-session
  kit: kde-kit
  original.package.name: lxqt-base/lxqt-session
  original.package.slot: "0"
  original.package.version: 2.3.0
