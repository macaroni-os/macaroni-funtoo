shell:
- /bin/bash
- -c
install:
- '{{- $nvidia_version := ( index .Values.labels "original.package.version"  ) }}
  {{- $valid_version := ( index ( slice ( splitList "-" $nvidia_version ) 0 1 ) 0
  ) }} gpu-configurator nvidia configure --with-video-group {{ $valid_version }} --if-not-set
  || true'
- eval 'macaronictl env-update || true'
uninstall:
- '{{- $nvidia_version := ( index .Values.labels "original.package.version"  ) }}
  {{- $valid_version := ( index ( slice ( splitList "-" $nvidia_version ) 0 1 ) 0
  ) }} gpu-configurator nvidia configure --with-video-group {{ $valid_version }} --if-not-set
  --purge || true'
