name: libdbi-drivers
version: 0.9.0+3
category: dev-db
use_flags:
- -doc
- -firebird
- -mysql
- -postgres
- sqlite
requires:
- name: libdbi
  version: '>=0'
  category: dev-db
- name: sqlite
  version: '>=0'
  category: dev-db-3
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: The libdbi-drivers project maintains drivers for libdbi
uri:
- http://libdbi-drivers.sourceforge.net/
license: LGPL-2.1+
labels:
  BDEPEND: doc? ( app-text/openjade ) >=app-portage/elt-patches-20170815 || ( >=sys-devel/automake-1.16.5:1.16
    ) >=sys-devel/autoconf-2.71 >=sys-devel/libtool-2.4
  DEPEND: '>=dev-db/libdbi-0.9.0 firebird? ( dev-db/firebird ) mysql? ( dev-db/mysql-connector-c:=
    ) postgres? ( dev-db/postgresql:* ) sqlite? ( dev-db/sqlite:3 )'
  IUSE: doc firebird mysql oci8 postgres +sqlite static-libs
  RDEPEND: '>=dev-db/libdbi-0.9.0 firebird? ( dev-db/firebird ) mysql? ( dev-db/mysql-connector-c:=
    ) postgres? ( dev-db/postgresql:* ) sqlite? ( dev-db/sqlite:3 )'
  emerge.packages: dev-db/libdbi-drivers
  kit: dev-kit
  original.package.name: dev-db/libdbi-drivers
  original.package.slot: "0"
  original.package.version: 0.9.0
