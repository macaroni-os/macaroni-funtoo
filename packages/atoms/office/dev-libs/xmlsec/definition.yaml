name: xmlsec
version: 1.2.42
category: dev-libs
use_flags:
- -gcrypt
- -gnutls
- -libressl
- -test
- nss
- openssl
requires:
- name: libxslt
  version: '>=0'
  category: dev-libs
- name: nss
  version: '>=0'
  category: dev-libs
- name: openssl
  version: '>=0'
  category: dev-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Command line tool for signing, verifying, encrypting and decrypting XML
uri:
- https://www.aleksey.com/xmlsec
license: MIT
labels:
  BDEPEND: virtual/pkgconfig >=app-portage/elt-patches-20170815 || ( >=sys-devel/automake-1.16.5:1.16
    ) >=sys-devel/autoconf-2.71 >=sys-devel/libtool-2.4
  DEPEND: dev-libs/libxml2:= dev-libs/libxslt dev-libs/libltdl gcrypt? ( dev-libs/libgcrypt:=
    ) gnutls? ( net-libs/gnutls:= ) nss? ( dev-libs/nspr dev-libs/nss ) openssl? (
    dev-libs/openssl:= )
  IUSE: doc gcrypt gnutls http nss +openssl static-libs
  RDEPEND: dev-libs/libxml2:= dev-libs/libxslt dev-libs/libltdl gcrypt? ( dev-libs/libgcrypt:=
    ) gnutls? ( net-libs/gnutls:= ) nss? ( dev-libs/nspr dev-libs/nss ) openssl? (
    dev-libs/openssl:= )
  emerge.packages: dev-libs/xmlsec
  kit: security-kit
  original.package.name: dev-libs/xmlsec
  original.package.slot: "0"
  original.package.version: 1.2.42
