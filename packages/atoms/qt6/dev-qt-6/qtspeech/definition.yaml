    qml? ( dev-qt/qtdeclarative:6 ) speechd? ( app-accessibility/speech-dispatcher
    )
  IUSE: flite qml +speechd debug test
  RDEPEND: dev-qt/qtbase:6 dev-qt/qtmultimedia:6 flite? ( app-accessibility/flite
    ) qml? ( dev-qt/qtdeclarative:6 ) speechd? ( app-accessibility/speech-dispatcher
    )
  emerge.packages: dev-qt/qtspeech:6
  kit: qt-kit
  original.package.name: dev-qt/qtspeech
  original.package.slot: "6"
  original.package.version: 6.10.1
