name: qtspeech
version: 6.10.1
category: dev-qt-6
use_flags:
- flite
- qml
- speechd
requires:
- name: speech-dispatcher
  version: '>=0'
  category: app-accessibility
- name: qtmultimedia
  version: '>=0'
  category: dev-qt-6
annotations:
