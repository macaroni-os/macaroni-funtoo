name: forgejo
version: 12.0.3+1
category: www-apps
use_flags:
- filecaps
requires:
- name: git
  version: '>=0'
  category: dev-vcs
- name: pam
  version: '>=0'
  category: sys-libs
- name: tmpfiles
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: A painless self-hosted Git service
uri:
- https://forgejo.org/
labels:
  BDEPEND: dev-lang/go net-libs/nodejs >=dev-lang/go-1.12 app-arch/unzip virtual/pkgconfig
  DEPEND: sys-libs/pam filecaps? ( sys-libs/libcap ) sys-apps/shadow
  IUSE: systemd +filecaps
  RDEPEND: sys-libs/pam dev-vcs/git virtual/tmpfiles
  emerge.packages: www-apps/forgejo
  kit: net-kit
  original.package.name: www-apps/forgejo
  original.package.slot: "0"
  original.package.version: 12.0.3
