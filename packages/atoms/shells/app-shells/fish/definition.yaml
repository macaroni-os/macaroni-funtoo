name: fish
version: 4.6.0
category: app-shells
use_flags:
- -doc
- -test
- nls
requires:
- name: libpcre2
  version: '>=0'
  category: dev-libs
- name: ncurses
  version: '>=0'
  category: sys-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Friendly Interactive SHell
uri:
- http://fishshell.com/
license: GPL-2
labels:
  BDEPEND: dev-util/ninja dev-util/cmake >=virtual/rust-1.37.0
  DEPEND: sys-libs/ncurses nls? ( sys-devel/gettext ) dev-util/desktop-file-utils
    x11-misc/shared-mime-info
  IUSE: nls debug
  RDEPEND: sys-libs/ncurses
  emerge.packages: app-shells/fish
  kit: core-server-kit
  original.package.name: app-shells/fish
  original.package.slot: "0"
  original.package.version: 4.6.0
