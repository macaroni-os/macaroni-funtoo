  DEPEND: dev-libs/openssl sys-libs/zlib
  IUSE: debug
  RDEPEND: dev-libs/openssl sys-libs/zlib
  emerge.packages: app-shells/starship
  kit: core-server-kit
  original.package.name: app-shells/starship
  original.package.slot: "0"
  original.package.version: 1.24.2
