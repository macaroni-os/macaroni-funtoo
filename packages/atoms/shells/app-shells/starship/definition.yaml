name: starship
version: 1.24.2
category: app-shells
use_flags:
- -libressl
requires:
- name: zlib
  version: '>=0'
  category: sys-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: The minimal, blazing-fast, and infinitely customizable prompt for any
  shell
uri:
- https://github.com/starship/starship
license: ISC
labels:
