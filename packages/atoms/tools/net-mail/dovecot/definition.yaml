name: dovecot
version: 2.4.4
category: net-mail
use_flags:
- -ldap
- -lua
- -lucene
- -lzma
- -solr
- -ssl
- -textcat
- -unwind
- -zlib
- -zstd
- argon2
- bzip2
- caps
- kerberos
- lz4
- mysql
- pam
- postgres
- rpc
- sqlite
- tcpd
requires:
- name: bzip2
  version: '>=0'
  category: app-arch
- name: lz4
  version: '>=0'
  category: app-arch
- name: mysql-connector-c
  version: '>=0'
  category: dev-db
- name: postgresql
  version: '>=0'
  category: dev-db-16
- name: sqlite
  version: '>=0'
  category: dev-db-3
- name: libsodium
  version: '>=0'
  category: dev-libs
- name: libtirpc
  version: '>=0'
  category: net-libs
- name: rpcsvc-proto
  version: '>=0'
  category: net-libs
- name: mailbase
  version: '>=0'
  category: net-mail
- name: tcp-wrappers
  version: '>=0'
  category: sys-apps
- name: libcap
  version: '>=0'
  category: sys-libs
- name: krb5
  version: '>=0'
  category: virtual
- name: libiconv
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: An IMAP and POP3 server written with security primarily in mind
uri:
- https://www.dovecot.org/
license: LPGL-2.1 MIT
labels:
  BDEPEND: virtual/pkgconfig >=app-portage/elt-patches-20170815 || ( >=sys-devel/automake-1.16.5:1.16
    ) >=sys-devel/autoconf-2.71 >=sys-devel/libtool-2.4 ssl? ( dev-libs/openssl:0
    ) virtual/pkgconfig
  DEPEND: argon2? ( dev-libs/libsodium ) bzip2? ( app-arch/bzip2 ) caps? ( sys-libs/libcap
    ) kerberos? ( virtual/krb5 ) ldap? ( net-nds/openldap ) lua? ( dev-lua/lua:= )
    lucene? ( dev-cpp/clucene ) lzma? ( app-arch/xz-utils ) lz4? ( app-arch/lz4 )
    mysql? ( dev-db/mysql-connector-c:= ) pam? ( sys-libs/pam ) postgres? ( dev-db/postgresql
    ) rpc? ( net-libs/libtirpc net-libs/rpcsvc-proto ) solr? ( net-misc/curl dev-libs/expat
    ) sqlite? ( dev-db/sqlite ) dev-libs/openssl tcpd? ( sys-apps/tcp-wrappers ) textcat?
    ( app-text/libexttextcat ) unwind? ( sys-libs/libunwind ) zlib? ( sys-libs/zlib
    ) zstd? ( app-arch/zstd ) virtual/libiconv dev-libs/icu:= sys-apps/shadow
  IUSE: kerberos ldap lua mysql pam postgres sqlite bzip2 lzma lz4 zlib zstd argon2
