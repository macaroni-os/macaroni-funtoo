name: wireshark
version: 4.6.8
category: net-analyzer
use_flags:
- -bcg729
- -brotli
- -ciscodump
- -doc
- -ilbc
- -libxml2
- -lua
- -lua_single_target_lua5-2
- -lz4
- -maxminddb
- -qt5
- -sbc
- -sdjournal
- -selinux
- -smi
- -snappy
- -spandsp
- -sshdump
- -test
- filecaps
- http2
- kerberos
- lua_single_target_lua5-1
- minizip
- netlink
- opus
- pcap
- ssl
- zlib
- zstd
- -androiddump
- -dpauxmon
- -plugin-ifdemo
- -tfshark
- python_targets_python3_7
- -lua_single_target_lua5-1
- -lua
requires:
- name: zstd
  version: '>=0'
  category: app-arch
- name: glib
  version: '>=0'
  category: dev-libs-2
- name: libgcrypt
  version: '>=0'
  category: dev-libs
- name: libnl
  version: '>=0'
  category: dev-libs-3
- name: opus
  version: '>=0'
  category: media-libs
- name: c-ares
  version: '>=0'
  category: net-dns
- name: gnutls
  version: '>=0'
  category: net-libs
- name: libpcap
  version: '>=0'
  category: net-libs
- name: nghttp2
  version: '>=0'
  category: net-libs
- name: libcap
  version: '>=0'
  category: sys-libs
- name: zlib
  version: '>=0'
  category: sys-libs
- name: krb5
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: A network protocol analyzer formerly known as ethereal
uri:
- https://www.wireshark.org/
license: GPL-2
labels:
  BDEPEND: '|| ( dev-lang/python:3.8 dev-lang/python:3.9 dev-lang/python:3.7 dev-lang/python:3.10
    ) dev-lang/perl sys-devel/flex sys-devel/gettext virtual/pkgconfig doc? ( app-doc/doxygen
    app-text/asciidoctor dev-libs/libxslt ) gui? ( dev-qt/qttools:6[linguist] ) dev-util/ninja
    dev-util/cmake'
  DEPEND: '>=dev-libs/glib-2.50.0:2 dev-libs/libpcre2:= dev-libs/libxml2:= >=dev-libs/libgcrypt-1.8.0:=
    >=net-dns/c-ares-1.13.0:= media-libs/speexdsp brotli? ( app-arch/brotli:= ) ciscodump?
    ( >=net-libs/libssh-0.6:= ) filecaps? ( sys-libs/libcap ) gui? ( dev-qt/qtbase:6[gui]
    dev-qt/qt5compat:6 dev-qt/qtmultimedia:6 virtual/freedesktop-icon-theme x11-misc/xdg-utils
    ) http2? ( >=net-libs/nghttp2-1.11.0:= ) kerberos? ( virtual/krb5 ) lua? ( dev-lua/lua:5.3
    ) lz4? ( app-arch/lz4:= ) maxminddb? ( dev-libs/libmaxminddb:= ) minizip? ( sys-libs/zlib[minizip]
    ) netlink? ( dev-libs/libnl:3 ) opus? ( media-libs/opus ) pcap? ( net-libs/libpcap
    ) sbc? ( media-libs/sbc ) snappy? ( app-arch/snappy:= ) sshdump? ( >=net-libs/libssh-0.6:=
    ) ssl? ( >=net-libs/gnutls-3.5.8:=[pkcs11?] ) wifi? ( >=net-libs/libssh-0.6:=
    ) xxhash? ( dev-libs/xxhash ) zlib? ( sys-libs/zlib ) zstd? ( app-arch/zstd:=
    ) filecaps? ( sys-libs/libcap ) sys-apps/shadow dev-util/desktop-file-utils x11-misc/shared-mime-info'
  IUSE: androiddump brotli +capinfos +captype ciscodump +dftest doc dpauxmon +dumpcap
    +editcap +gui http2 kerberos lto lua lz4 maxminddb +mergecap +minizip +netlink
    opus pkcs11 +plugins +pcap +randpkt +randpktdump +reordercap sbc +sharkd snappy
    sshdump ssl +text2pcap +tshark +udpdump wifi xxhash zlib +zstd +filecaps
  RDEPEND: '>=dev-libs/glib-2.50.0:2 dev-libs/libpcre2:= dev-libs/libxml2:= >=dev-libs/libgcrypt-1.8.0:=
    >=net-dns/c-ares-1.13.0:= media-libs/speexdsp brotli? ( app-arch/brotli:= ) ciscodump?
    ( >=net-libs/libssh-0.6:= ) filecaps? ( sys-libs/libcap ) gui? ( dev-qt/qtbase:6[gui]
    dev-qt/qt5compat:6 dev-qt/qtmultimedia:6 virtual/freedesktop-icon-theme x11-misc/xdg-utils
    ) http2? ( >=net-libs/nghttp2-1.11.0:= ) kerberos? ( virtual/krb5 ) lua? ( dev-lua/lua:5.3
    ) lz4? ( app-arch/lz4:= ) maxminddb? ( dev-libs/libmaxminddb:= ) minizip? ( sys-libs/zlib[minizip]
    ) netlink? ( dev-libs/libnl:3 ) opus? ( media-libs/opus ) pcap? ( net-libs/libpcap
    ) sbc? ( media-libs/sbc ) snappy? ( app-arch/snappy:= ) sshdump? ( >=net-libs/libssh-0.6:=
    ) ssl? ( >=net-libs/gnutls-3.5.8:=[pkcs11?] ) wifi? ( >=net-libs/libssh-0.6:=
    ) xxhash? ( dev-libs/xxhash ) zlib? ( sys-libs/zlib ) zstd? ( app-arch/zstd:=
    )'
  emerge.packages: net-analyzer/wireshark
  kit: net-kit
  original.package.name: net-analyzer/wireshark
  original.package.slot: "0"
  original.package.version: 4.6.8
