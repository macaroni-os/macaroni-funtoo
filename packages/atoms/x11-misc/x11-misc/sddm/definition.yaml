name: sddm
version: 0.21.0
category: x11-misc
use_flags:
- -qt5
- -systemd
- elogind
- pam
requires:
- name: qtbase
  version: '>=0'
  category: dev-qt-6
- name: qtdeclarative
  version: '>=0'
  category: dev-qt-6
- name: elogind
  version: '>=0'
  category: sys-auth
- name: pam
  version: '>=0'
  category: sys-libs
- name: upower
  version: '>=0'
  category: sys-power
- name: libxcb
  version: '>=0'
  category: x11-libs
- name: xcb
  version: '>=0'
  category: x11-misc
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: QML based X11 and Wayland display manager
uri:
- https://github.com/sddm/sddm
license: GPL-2.0
labels:
  BDEPEND: virtual/pkgconfig dev-util/ninja >=dev-util/cmake-3.9.6 virtual/pkgconfig
  DEPEND: qt5? ( dev-qt/qtcore:5 dev-qt/qtdbus:5 dev-qt/qtdeclarative:5 dev-qt/qtgui:5
    dev-qt/qtnetwork:5 ) !qt5? ( dev-qt/qtbase:6[gui] dev-qt/qtdeclarative:6 ) sys-libs/pam
    x11-libs/libXau x11-libs/libxcb:= elogind? ( sys-auth/elogind ) pam? ( sys-libs/pam
    ) systemd? ( sys-apps/systemd:= ) !systemd? ( sys-power/upower ) dev-python/docutils
    kde-frameworks/extra-cmake-modules qt5? ( dev-qt/linguist-tools:5 ) sys-apps/shadow
  IUSE: elogind +pam systemd qt5
  RDEPEND: qt5? ( dev-qt/qtcore:5 dev-qt/qtdbus:5 dev-qt/qtdeclarative:5 dev-qt/qtgui:5
    dev-qt/qtnetwork:5 ) !qt5? ( dev-qt/qtbase:6[gui] dev-qt/qtdeclarative:6 ) sys-libs/pam
    x11-libs/libXau x11-libs/libxcb:= elogind? ( sys-auth/elogind ) pam? ( sys-libs/pam
    ) systemd? ( sys-apps/systemd:= ) !systemd? ( sys-power/upower ) x11-misc/xcb
  emerge.packages: x11-misc/sddm
  kit: desktop-kit
  original.package.name: x11-misc/sddm
  original.package.slot: "0"
  original.package.version: 0.21.0
