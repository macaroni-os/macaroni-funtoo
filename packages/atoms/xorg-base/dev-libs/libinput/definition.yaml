name: libinput
version: 1.30.1
category: dev-libs
use_flags:
- input_devices_wacom
requires:
- name: libwacom
  version: '>=0'
  category: dev-libs
- name: mtdev
  version: '>=0'
  category: sys-libs
- name: libudev
  version: '>=0'
  category: virtual
- name: udev
  version: '>=0'
  category: virtual
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Library to handle input devices in Wayland
uri:
- https://www.freedesktop.org/wiki/Software/libinput
- https://gitlab.freedesktop.org/libinput/libinput
license: MIT
labels:
  BDEPEND: '>=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2'
  DEPEND: input_devices_wacom? ( dev-libs/libwacom ) >=dev-libs/libevdev-1.10.0 sys-libs/mtdev
    virtual/libudev:= virtual/udev
  IUSE: input_devices_wacom
  RDEPEND: input_devices_wacom? ( dev-libs/libwacom ) >=dev-libs/libevdev-1.10.0 sys-libs/mtdev
    virtual/libudev:= virtual/udev
  emerge.packages: dev-libs/libinput
  kit: xorg-kit
  original.package.name: dev-libs/libinput
  original.package.slot: "0"
  original.package.version: 1.30.1
