    ( media-libs/vulkan-loader ) wayland? ( dev-libs/wayland gui-libs/libdecor x11-libs/libxkbcommon
    ) X? ( x11-libs/libX11 vulkan? ( x11-libs/libxcb:= x11-libs/libxkbcommon ) )
  emerge.packages: x11-apps/mesa-progs
