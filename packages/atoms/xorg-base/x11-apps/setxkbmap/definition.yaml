name: setxkbmap
version: 1.3.4
category: x11-apps
use_flags:
- -ppc-aix
- -x86-winnt
requires:
- name: xkeyboard-config
  version: '>=0'
  category: x11-misc
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Controls the keyboard layout of a running X server
uri:
- https://www.x.org/wiki/
- https://gitlab.freedesktop.org/xorg/app/setxkbmap
license: MIT
labels:
  BDEPEND: virtual/pkgconfig >=app-portage/elt-patches-20170815 || ( >=sys-devel/automake-1.16.5:1.16
    ) >=sys-devel/autoconf-2.71 >=sys-devel/libtool-2.4
  DEPEND: x11-libs/libxkbfile x11-libs/libX11 sys-devel/autoconf sys-devel/automake
    sys-devel/libtool sys-devel/m4 x11-misc/util-macros x11-base/xorg-proto
  RDEPEND: x11-libs/libxkbfile x11-libs/libX11
  emerge.packages: x11-apps/setxkbmap
  kit: xorg-kit
  original.package.name: x11-apps/setxkbmap
  original.package.slot: "0"
  original.package.version: 1.3.4
