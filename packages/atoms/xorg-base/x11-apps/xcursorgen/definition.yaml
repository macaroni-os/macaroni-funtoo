name: xcursorgen
version: 1.0.9
category: x11-apps
use_flags:
- -ppc-aix
- -x86-winnt
requires:
- name: libpng
  version: '>=0'
  category: media-libs
- name: libX11
  version: '>=0'
  category: x11-libs
- name: libXcursor
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: create an X cursor file from a collection of PNG images
uri:
- https://www.x.org/wiki/
- https://gitlab.freedesktop.org/xorg/app/xcursorgen
license: MIT
labels:
  BDEPEND: virtual/pkgconfig >=app-portage/elt-patches-20170815 || ( >=sys-devel/automake-1.16.5:1.16
    ) >=sys-devel/autoconf-2.71 >=sys-devel/libtool-2.4
  DEPEND: x11-libs/libX11 x11-libs/libXcursor media-libs/libpng:0= sys-devel/autoconf
    sys-devel/automake sys-devel/libtool sys-devel/m4 x11-misc/util-macros x11-base/xorg-proto
  RDEPEND: x11-libs/libX11 x11-libs/libXcursor media-libs/libpng:0=
  emerge.packages: x11-apps/xcursorgen
  kit: xorg-kit
  original.package.name: x11-apps/xcursorgen
  original.package.slot: "0"
  original.package.version: 1.0.9
