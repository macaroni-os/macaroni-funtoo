name: xhost
version: 1.0.10
category: x11-apps
use_flags:
- -ppc-aix
- -x86-winnt
requires:
- name: libX11
  version: '>=0'
  category: x11-libs
- name: libXau
  version: '>=0'
  category: x11-libs
- name: libXmu
  version: '>=0'
  category: x11-libs
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Controls host and/or user access to a running X server
uri:
- https://www.x.org/wiki/
- https://gitlab.freedesktop.org/xorg/app/xhost
license: MIT
labels:
  BDEPEND: virtual/pkgconfig >=app-portage/elt-patches-20170815 || ( >=sys-devel/automake-1.16.5:1.16
    ) >=sys-devel/autoconf-2.71 >=sys-devel/libtool-2.4
  DEPEND: x11-libs/libX11 x11-libs/libXmu x11-libs/libXau sys-devel/autoconf sys-devel/automake
    sys-devel/libtool sys-devel/m4 x11-misc/util-macros x11-base/xorg-proto
  IUSE: ipv6
  RDEPEND: x11-libs/libX11 x11-libs/libXmu x11-libs/libXau
  emerge.packages: x11-apps/xhost
  kit: xorg-kit
  original.package.name: x11-apps/xhost
  original.package.slot: "0"
  original.package.version: 1.0.10
