  DEPEND: x11-apps/xauth x11-libs/libX11 sys-devel/autoconf sys-devel/automake sys-devel/libtool
    sys-devel/m4 x11-misc/util-macros x11-base/xorg-proto
  IUSE: +minimal
  RDEPEND: x11-apps/xauth x11-libs/libX11
  emerge.packages: x11-apps/xinit
  kit: xorg-kit
  original.package.name: x11-apps/xinit
  original.package.slot: "0"
  original.package.version: 1.4.4
