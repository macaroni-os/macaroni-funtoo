name: xinit
version: 1.4.4
category: x11-apps
use_flags:
- -ppc-aix
- -x86-winnt
requires:
- name: xauth
  version: '>=0'
  category: x11-apps
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: X Window System initializer
uri:
- https://www.x.org/wiki/
- https://gitlab.freedesktop.org/xorg/app/xinit
license: MIT GPL-2
labels:
