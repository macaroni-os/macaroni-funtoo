name: xorg-server
version: 21.1.21+3
category: x11-base
use_flags:
- -selinux
- -systemd
- -unwind
- elogind
- kdrive
- minimal
- udev
- xephyr
- xnest
- xorg
- xnest
- suid
- xvfb
- xcsecurity
requires:
- name: libbsd
  version: '>=0'
  category: dev-libs
- name: libglvnd
  version: '>=0'
  category: media-libs
- name: dbus
  version: '>=0'
  category: sys-apps
- name: flex
  version: '>=0'
  category: sys-devel
- name: xinit
  version: '>=0'
  category: x11-apps
- name: libXv
  version: '>=0'
  category: x11-libs
- name: libdrm
  version: '>=0'
  category: x11-libs
- name: libxshmfence
  version: '>=0'
  category: x11-libs
- name: xcb-util-image
  version: '>=0'
  category: x11-libs
- name: xcb-util-keysyms
  version: '>=0'
  category: x11-libs
- name: xcb-util-renderutil
  version: '>=0'
  category: x11-libs
- name: xcb-util-wm
  version: '>=0'
  category: x11-libs
- name: xkeyboard-config
  version: '>=0'
  category: x11-misc
- name: xwayland
  version: '>=0'
  category: x11-base
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: x.org X server
uri:
- https://www.x.org/wiki
license: MIT
labels:
  BDEPEND: media-fonts/font-util >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: dev-libs/libbsd dev-libs/openssl media-libs/libglvnd[X] sys-devel/flex x11-apps/xkbcomp
    x11-base/xorg-proto x11-libs/libXau x11-libs/libXdmcp x11-libs/libXfont2 x11-libs/libdrm
    x11-libs/libpciaccess x11-libs/libxkbfile x11-libs/libxshmfence x11-libs/pixman
    x11-libs/xtrans x11-misc/xkeyboard-config elogind? ( sys-apps/dbus sys-auth/elogind[pam]
    ) kdrive? ( x11-libs/libXext x11-libs/libXv ) udev? ( virtual/libudev ) unwind?
    ( sys-libs/libunwind ) xephyr? ( x11-libs/libxcb x11-libs/xcb-util x11-libs/xcb-util-image
    x11-libs/xcb-util-keysyms x11-libs/xcb-util-renderutil x11-libs/xcb-util-wm )
    xnest? ( x11-libs/libXext x11-libs/libX11 ) xorg? ( x11-apps/xinit x11-libs/libxcvt
    ) !minimal? ( x11-libs/libXext x11-libs/libX11 media-libs/mesa[X(+),egl(+),gbm(+)]
    media-libs/libepoxy[X,egl(+)] ) systemd? ( sys-apps/dbus sys-apps/systemd )
  IUSE: kdrive xephyr xnest xorg xvfb debug +elogind minimal selinux +suid +udev unwind
    xcsecurity systemd
  RDEPEND: dev-libs/libbsd dev-libs/openssl media-libs/libglvnd[X] sys-devel/flex
    x11-apps/xkbcomp x11-base/xorg-proto x11-libs/libXau x11-libs/libXdmcp x11-libs/libXfont2
    x11-libs/libdrm x11-libs/libpciaccess x11-libs/libxkbfile x11-libs/libxshmfence
    x11-libs/pixman x11-libs/xtrans x11-misc/xkeyboard-config elogind? ( sys-apps/dbus
    sys-auth/elogind[pam] ) kdrive? ( x11-libs/libXext x11-libs/libXv ) udev? ( virtual/libudev
    ) unwind? ( sys-libs/libunwind ) xephyr? ( x11-libs/libxcb x11-libs/xcb-util x11-libs/xcb-util-image
    x11-libs/xcb-util-keysyms x11-libs/xcb-util-renderutil x11-libs/xcb-util-wm )
    xnest? ( x11-libs/libXext x11-libs/libX11 ) xorg? ( x11-apps/xinit x11-libs/libxcvt
    ) !minimal? ( x11-libs/libXext x11-libs/libX11 media-libs/mesa[X(+),egl(+),gbm(+)]
    media-libs/libepoxy[X,egl(+)] ) systemd? ( sys-apps/dbus sys-apps/systemd ) selinux?
    ( sec-policy/selinux-xserver )
  emerge.packages: x11-base/xorg-server
  kit: xorg-kit
  original.package.name: x11-base/xorg-server
  original.package.slot: "0"
  original.package.version: 21.1.21
