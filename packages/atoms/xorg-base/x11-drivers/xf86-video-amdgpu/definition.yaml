name: xf86-video-amdgpu
version: 25.0.0+1
category: x11-drivers
use_flags:
- udev
requires:
- name: mesa
  version: '>=0'
  category: media-libs
- name: libudev
  version: '>=0'
  category: virtual
- name: xorg-server
  version: '>=0'
  category: x11-base
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: Accelerated Open Source driver for AMDGPU cards
uri:
- https://www.x.org/wiki/
- https://gitlab.freedesktop.org/xorg/driver/xf86-video-amdgpu
license: MIT
labels:
  BDEPEND: virtual/pkgconfig >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: media-libs/mesa x11-base/xorg-server udev? ( virtual/libudev:= ) x11-libs/libpciaccess
    x11-libs/libdrm[video_cards_amdgpu] x11-base/xorg-proto
  IUSE: udev
  RDEPEND: media-libs/mesa x11-base/xorg-server udev? ( virtual/libudev:= ) x11-libs/libpciaccess
    x11-libs/libdrm[video_cards_amdgpu]
  emerge.packages: x11-drivers/xf86-video-amdgpu
  kit: core-gl-kit
  original.package.name: x11-drivers/xf86-video-amdgpu
  original.package.slot: "0"
  original.package.version: 25.0.0
