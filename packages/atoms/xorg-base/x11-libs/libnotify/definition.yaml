name: libnotify
version: 0.8.8+3
category: x11-libs
use_flags:
- -test
- introspection
- X
- sql
- sqlite
requires:
- name: eselect-notify-send
  version: '>=0'
  category: app-eselect
- name: gdk-pixbuf
  version: '>=0'
  category: x11-libs-2
annotations:
  subsets:
    rules:
      devel:
      - ^/usr/include/
      portage:
      - ^/var/db/pkg/
description: A library for sending desktop notifications
uri:
- https://git.gnome.org/browse/libnotify
license: LGPL-2.1+
labels:
  BDEPEND: virtual/pkgconfig >=dev-util/meson-0.48.2 >=dev-util/ninja-1.7.2
  DEPEND: app-eselect/eselect-notify-send dev-libs/glib:2 x11-libs/gdk-pixbuf:2 introspection?
    ( dev-libs/gobject-introspection:= ) dev-libs/gobject-introspection-common dev-util/gtk-doc-am
    app-text/docbook-xsl-ns-stylesheets
  IUSE: +introspection
  RDEPEND: app-eselect/eselect-notify-send dev-libs/glib:2 x11-libs/gdk-pixbuf:2 introspection?
    ( dev-libs/gobject-introspection:= )
  emerge.packages: x11-libs/libnotify
  kit: xorg-kit
  original.package.name: x11-libs/libnotify
  original.package.slot: "0"
  original.package.version: 0.8.8
