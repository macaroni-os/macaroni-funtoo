image: scratch
env:
- LUET_YES=true
- LUET_NOLOCK=true
- HTTP_TIMEOUT=0
- 'GENTOO_MIRRORS="https://distfiles.macaronios.org https://dl.macaronios.org/repos/distfiles https://distfiles.macaronios.org/mark-distfiles"'
copy:
  - package:
      category: seed
      name: macaroni-funtoo-stage
      version: ">=0"
    source: "/macaroni-funtoo"
    destination: "/"
# Set this to prelude when this is fixed: https://github.com/mudler/luet/issues/254

# NOTE: I dunno why luet link is not available. Probably a docker issue.
steps:
- >-
  if [ ! -e /etc/passwd ] ; then touch /etc/passwd ; fi &&
  if [ ! -e /etc/shadow ] ; then touch /etc/shadow ; fi &&
  if [ ! -e /etc/group ] ; then touch /etc/group ; fi &&
  if [ ! -e /etc/gshadow ] ; then touch /etc/gshadow ; fi &&
  if [ ! -d /tmp ] ; then mkdir /tmp ; fi &&
  if [ ! -d /var ] ; then mkdir /var ; fi &&
  if [ ! -d /root ] ; then mkdir /root ; fi &&
  chmod a+x /var &&
  chmod a+rwx /tmp &&
  ls -l /etc/ &&
  ls -l /etc/anise &&
  cd /etc/ &&
  ln -s anise/ luet &&
  ls -l /etc/ &&
  cat /etc/luet/luet.yaml &&
  anise repo update
- anise install virtual-entities/base --force
- >-
  anise install --force
  system/luet-devkit
  app-misc/yq-go
  app-misc/jq
  app-admin/macaronictl
  dev-util/pkgs-checker
  kernel-6.1/macaroni-sources &&
  eselect kernel set 1 &&
  anise cleanup

# Using steps to trace what files are generated
# by gcc-config/binutils-config.
# steps:
# sed -e 's|\[\[ \! -w ${EROOT}.*|# Check dropped for error with docker|g' -i /usr/bin/gcc-config &&
- >-
  anise miner ri virtual/base virtual/sh &&
  anise repo update && anise upgrade &&
  anise i toolchain/base-extra
  toolchain/base-python
  toolchain/base-tools
  toolchain/base-tools2
  toolchain/base-xorg
  toolchain/base-xorg2
  toolchain/fonts
  toolchain/base-gtk
  toolchain/base-media
  toolchain/base-gtk2
  toolchain/base-editors
  &&
  anise cleanup --purge-repos &&
  /usr/bin/gcc-config 1 &&
  eselect gcc set 1 &&
  mkdir -p /var/lib/portage &&
  epro list &&
  eval 'rm /etc/localtime || true' &&
  ln -s /usr/share/zoneinfo/Europe/Rome /etc/localtime &&
  macaronictl env-update &&
  eval 'locale-gen || true' &&
  build-docbook-catalog &&
  whip h eclass_db.db_fix_so &&
  eselect rust set 1 &&
  cd / && rm -rf /luetbuild &&
  eval 'mkdir -p /run || true' &&
  mkdir /layer

# build-docbook-catalog is needed to use xsltproc and build gdbus-codegen, glib-utils, etc.

package_dir: /layer
