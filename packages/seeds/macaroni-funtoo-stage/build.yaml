image: "alpine"
prelude:
- >-
  export ANISE_YES=true &&
  export ANISE_NOLOCK=true &&
  export ANISE_VERSION=0.45.4 &&
  ANISE_ARCH=x86_64 &&
  apk add wget bash &&
  mkdir /macaroni-eagle &&
  wget https://github.com/macaroni-os/anise/releases/download/v${ANISE_VERSION}/anise-v${ANISE_VERSION}-linux-x86_64 -O /usr/bin/anise &&
  chmod a+x /usr/bin/anise &&
  anise install --force --config ./anise.yaml --sync-repos
  repository/macaroni-eagle-dev
  repository/macaroni-commons-dev
  repository/mark &&
  anise repo update --force --config ./anise.yaml &&
  anise install --force --config ./anise.yaml --skip-finalizers
  app-admin/anise
  toolchain/base
  toolchain/meta-repo
  toolchain/meta-geaaru-kit
  app-admin/whip
  app-admin/entities
  sys-apps/whip-catalog
  app-misc/jq-bin
  macaroni/entities-catalog
  app-misc/yq4-bin
  app-misc/yq3-bin
  dev-util/pkgs-checker &&
  anise cleanup --config ./anise.yaml &&
  mkdir -p /macaroni-eagle/etc/luet &&
  /macaroni-eagle/usr/bin/yq w ./luet.yaml system.rootfs "/" -i &&
  cp ./luet.yaml /macaroni-funtoo/etc/luet/ &&
  cd /macaroni-funtoo/bin &&
  ln -s bash sh &&
  cd - &&
  touch /macaroni-funtoo/etc/passwd &&
  touch /macaroni-funtoo/etc/shadow &&
  touch /macaroni-funtoo/etc/group &&
  touch /macaroni-funtoo/etc/gshadow &&
  /macaroni-funtoo/usr/bin/entities merge -s /macaroni-funtoo/usr/share/macaroni/entities/ -a
  --users-file /macaroni-funtoo/etc/passwd
  --shadow-file /macaroni-funtoo/etc/shadow
  --groups-file /macaroni-funtoo/etc/group
  --gshadow-file /macaroni-funtoo/etc/gshadow
# We need to run entities before base image to set users/groups
# and to avoid errors related with user identification
