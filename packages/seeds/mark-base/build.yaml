requires:
- category: "seed"
  name: "funtoo-kit-geaaru"
  version: ">=0"
env:
- JOBS=10
prelude:
- >-
  cp -rvf package.use /etc/portage/ &&
  cp -v make.conf /etc/portage &&
  epro flavor minimal &&
  epro mix-in +btrfs &&
  epro list &&
  echo "UTC" > /etc/timezone
# We use now stage3 tarball from mark-stages that already
# contains macaroni repos, entities and entities-catalog.
# I disable the terragon repos to avoid upgrade of the packages
# to handle with portage.
- >-
  anise subsets enable devel portage &&
  anise repo list &&
  anise repo disable macaroni-terragon-dev &&
  anise upgrade --sync-repos &&
  anise cleanup --purge-repos &&
  rm -rf /etc/passwd /etc/group /etc/passwd /etc/shadow &&
  entities merge -s /usr/share/macaroni/entities -a
#steps:
- >-
  emerge --unmerge
  sys-fs/lvm2
  virtual/udev
  virtual/libudev
  virtual/dev-manager
  virtual/service-manager
  sys-apps/gentoo-systemd-integration
  sys-apps/sysvinit
  sys-fs/eudev
  net-dns/openresolv
  sys-apps/corenetwork
  sys-apps/opentmpfiles
  virtual/udev
  virtual/tmpfiles
  sys-apps/openrc
  net-misc/dhcpcd
  sys-apps/usbutils
  sys-apps/pciutils
  sys-apps/systemd-tmpfiles
  sys-fs/dosfstools
  app-emulation/open-vm-tools
  &&
  export FEATURES="-collision-protect -sandbox -usersandbox -ipc-sandbox -pid-sandbox -network-sandbox" &&
  unset RELEASE &&
  emerge --nodeps -j sys-apps/portage &&
  emerge -1 -t -j $JOBS sys-apps/systemd &&
  emerge -1uDN -t -j $JOBS @system &&
  emerge -t -j $JOBS -D @world &&
  emerge -t -j $JOBS net-misc/curl dev-util/cmake dev-python/zipp &&
  rm -rf /var/cache/portage/distfiles/*
