requires:
  - name: mark-stage3
    category: "seed"
    version: ">=0"
env:
- JOBS=10
- GIT_HISTORY_ENTRIES=30000
- FEATURES="-sandbox -usersandbox -ipc-sandbox -pid-sandbox -network-sandbox"
- LUET_YES=true
- LUET_NOLOCK=true
prelude:
- >-
  anise subsets enable portage devel &&
  anise repo list &&
  anise repo disable mark macaroni-terragon macaroni-commons &&
  anise i --sync-repos repository/mark-dev repository/macaroni-commons-dev repository/macaroni-terragon-dev &&
  anise rm repository/macaroni-terragon repository/mark repository/macaroni-commons -y &&
  anise install --sync-repos
  dev-util/pkgs-checker app-misc/yq-go app-misc/jq system/luet-devkit portage app-admin/macaronictl
  mark-devkit app-admin/anise-portage-converter app-admin/entities --nodeps &&
  anise cleanup &&
  mv kits-versions / &&
  rm -rf /var/git/meta-repo/ &&
  mkdir -p /tmp/ && chmod a+rw /tmp &&
  sed -e 's|^release.*|release = {{ ( index .Values.labels "mark-release" ) }}|g' /etc/ego.conf  -i &&
  ego sync &&
  ego profile arch x86-64bit &&
  ego profile build mark &&
  ego profile subarch generic_64 &&
  ego profile flavor core &&
  cd /var/git/meta-repo/kits &&
  chown root:root -R /var/git/meta-repo/kits &&
  rm -rf * &&
  mark-devkit kit clone --specfile /kits-versions/kits.yaml
  --to /var/git/meta-repo/kits --deep $GIT_HISTORY_ENTRIES
  --concurrency $JOBS
  --generate-reposcan-files --kit-cache-dir /kit-cache/ &&
  cp /kits-versions/kits.yaml /kit-cache/ &&
  mkdir /layer

