image: "alpine"
env:
- ANISE_YES=true
- HTTP_TIMEOUT=0
- STAGE_VERSION={{ ( index .Values.labels "package.version" ) }}
- RELEASE={{ ( index .Values.labels "stage3.release" ) }}
package_dir: /layer
prelude:
- apk --no-cache add ca-certificates tar wget xz rsync curl
- curl https://raw.githubusercontent.com/macaroni-os/anise/refs/heads/geaaru/contrib/config/get_anise_root.sh | sh
- >-
  anise install -y repository/macaroni-distfiles &&
  anise repo update
- |
  mkdir /{{ .Values.name }}/etc -p && \
  anise install -y =${RELEASE}/stage3-amd64-{{ ( index .Values.labels "distfiles.version" ) }} && anise cleanup && \
  export BUILDPATH=`pwd` && \
  cd /{{ .Values.name }} && tar xJpf /collections/mark/stage3-${RELEASE}.tar.xz --xattrs --numeric-owner && anise rm ${RELEASE}/stage3-amd64 && anise cleanup && \
  cp ${BUILDPATH}/ego.conf /{{ .Values.name }}/etc/ && \
  rm -rf /{{ .Values.name }}/lib64/modules/* && \
  rsync -A -a --delete --numeric-ids --recursive -d -H --one-file-system --xattrs --exclude '/{{ .Values.name }}/*'  --exclude '/etc/resolv.conf'  --exclude '/etc/hostname'  --exclude '/sys/' --exclude '/etc/hosts'  --exclude '/sys/*' --exclude '/proc/*' --exclude '/dev/pts/*' /{{ .Values.name }}/ / && \
  rm -rf /var/git/meta-repo/ -rf && \
  rm -rf /{{ .Values.name }} && \
  mkdir /layer
