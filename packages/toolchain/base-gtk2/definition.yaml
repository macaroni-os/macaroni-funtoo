category: toolchain
name: base-gtk2
version: "1"
description: "Virtual package to install portage meta data of the base-gtk2 packages"
requires:
  - name: gcab
    category: app-arch
    version: '>=0'
  - name: zopfli
    category: app-arch
    version: '>=0'
  - name: appstream-glib
    category: dev-libs
    version: '>=0'
  - name: libevent
    category: dev-libs
    version: '>=0'
  - name: libyaml
    category: dev-libs
    version: '>=0'
  - name: snowball-stemmer
    category: dev-libs
    version: '>=0'
  - name: dconf
    category: gnome-base
    version: '>=0'
  - name: cantarell
    category: media-fonts
    version: '>=0'
  - name: noto-emoji
    category: media-fonts
    version: '>=0'
  - name: avahi
    category: net-dns
    version: '>=0'
  - name: cups
    category: net-print
    version: '>=0'
