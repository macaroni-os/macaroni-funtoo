artefacts:


- tree: packages/atoms/base-gnome
  uses:
    disabled:
      - examples
      - static-libs
      - test
      - selinux
      - doc
      - cjk
      - jadetex
  packages:
    - app-text/docbook-sgml-dtd:4.1
    - app-text/docbook-sgml-dtd:4.0
    - app-text/docbook-sgml-dtd:4.2
    - app-text/docbook-sgml-dtd:3.1
    - app-text/docbook-sgml-dtd:4.4
  finalizer:
    shell:
      - "/bin/bash"
      - "-c"
    install:
      - >-
        slot={{ ( index .Values.labels "original.package.slot" ) }}
        SGML_SOURCE="/etc/sgml/sgml-docbook-${slot}.cat"
        SGML_DESTINATIONS="/usr/share/sgml/docbook/sgml-dtd-${slot}/catalog /etc/sgml/sgml-docbook.cat"
        whip h sgml.postinst || true
    uninstall:
      - >-
        slot={{ ( index .Values.labels "original.package.slot" ) }}
        SGML_SOURCE="/etc/sgml/sgml-docbook-${slot}.cat"
        SGML_DESTINATIONS="/usr/share/sgml/docbook/sgml-dtd-${slot}/catalog /etc/sgml/sgml-docbook.cat"
        whip h sgml.postrm || true

- tree: packages/atoms/base-gnome
  uses:
    disabled:
      - examples
      - static-libs
      - test
      - selinux
      - doc
      - cjk
      - jadetex
  packages:
    # TODO: Move this to fonts if possible
    - media-fonts/unifont
    - media-fonts/source-pro
    - gnome-base/adrien-gdm-keyboard
    - app-text/docbook-xml-simple-dtd:0
    - sys-libs/liburing
    - dev-perl/Parse-Yapp
    - dev-libs/libpwquality
    - sys-apps/bubblewrap
    - x11-libs/startup-notification
    - dev-libs/libsass
    - dev-lang/sassc


- tree: packages/atoms/base-gnome
  uses:
    disabled:
      - examples
      - static-libs
      - test
      - selinux
      - doc
      - cjk
      - jadetex
  packages:
    - app-text/openjade
  finalizer:
    shell:
      - "/bin/bash"
      - "-c"
    install:
      - >-
        pv={{ .Values.version }}
        pv=${pv%\+*}
        SGML_SOURCE_CATALOG="/etc/sgml/openjade-${pv}.cat"
        SGML_CENTRALIZED_CATALOG="/usr/share/sgml/openjade-${pv}/catalog"
        whip h sgml.sgml_cat_install
      - >-
        pv={{ .Values.version }}
        pv=${pv%\+*}
        SGML_SOURCE_CATALOG="/etc/sgml/openjade-${pv}.cat"
        SGML_CENTRALIZED_CATALOG="/usr/share/sgml/openjade-${pv}/dsssl/catalog"
        whip h sgml.sgml_cat_install

      - >-
        pv={{ .Values.version }}
        pv=${pv%\+*}
        SGML_SOURCE_CATALOG="/etc/sgml/sgml-docbook.cat"
        SGML_CENTRALIZED_CATALOG="/etc/sgml/openjade-${pv}.cat"
        whip h sgml.sgml_cat_install

    uninstall:
      - >-
        pv={{ .Values.version }}
        pv=${pv%\+*}
        SGML_SOURCE_CATALOG="/etc/sgml/openjade-${pv}.cat"
        SGML_CENTRALIZED_CATALOG="/usr/share/sgml/openjade-${pv}/catalog"
        whip h sgml.sgml_cat_remove
      - >-
        pv={{ .Values.version }}
        pv=${pv%\+*}
        SGML_SOURCE_CATALOG="/etc/sgml/openjade-${pv}.cat"
        SGML_CENTRALIZED_CATALOG="/usr/share/sgml/openjade-${pv}/dsssl/catalog"
        whip h sgml.sgml_cat_remove

      - >-
        pv={{ .Values.version }}
        pv=${pv%\+*}
        SGML_SOURCE_CATALOG="/etc/sgml/sgml-docbook.cat"
        SGML_CENTRALIZED_CATALOG="/etc/sgml/openjade-${pv}.cat"
        whip h sgml.sgml_cat_remove


