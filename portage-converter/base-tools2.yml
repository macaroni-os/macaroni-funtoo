build_template_file: ../templates/build-pkg-uses-subsets2.yaml.tmpl

global_annotations:
  subsets:
    rules:
      devel:
        - "^/usr/include/"
      portage:
        - "^/var/db/pkg/"

artefacts:

- tree: packages/atoms/base-tools2
  mutations:
    buildtime_deps:
      packages:
        - category: seed
          name: macaroni-funtoo-race3
  uses:
    disabled:
    - nios2
    - sh
    enabled:
    - abi_x86_64
  packages:
    - dev-libs/libpthread-stubs
      #    - x11-libs/libXau



- tree: packages/atoms/base-tools2
  uses:
    disabled:
    - debug
    - nios2
    - sh
    enabled:
    - asn1
    - libffi
    - trust
  packages:
  - app-crypt/p11-kit

- tree: packages/atoms/base-tools2
  mutations:
    runtime_deps:
      # $# ldd /sbin/ss
      # libtirpc.so.3 => not found
      packages:
        - category: net-libs
          name: libtirpc
  uses:
    disabled:
    - atm
    - elf
    - libbsd
    - minimal
    - nios2
    - selinux
    - sh
    enabled:
    - caps
    - bpf
    - berkdb
    - iptables
    - ipv6
  packages:
  - sys-apps/iproute2

- tree: packages/atoms/base-tools2
  uses:
    enabled:
      - dbus
    disabled:
      - netlink
      - bluetooth
  packages:
    - sys-process/procs

- tree: packages/atoms/base-tools2
  mutations:
    uses:
      # Needed for tcpreplay
      - libopts
  uses:
    disabled:
      - static-libs
  packages:
    - sys-devel/autogen

- tree: packages/atoms/base-tools2
  mutations:
    buildtime_deps:
      packages:
        - category: seed
          name: macaroni-funtoo-race3
  uses:
    disabled:
      - static
  packages:
    - net-misc/vconfig
    - net-analyzer/tcping
    - net-misc/ethertypes
    - sys-apps/ethtool

- tree: packages/atoms/base-tools2
  uses:
    disabled:
    - doc
    - nios2
    - sh
  packages:
  - dev-lang/nasm
  - app-shells/bash-completion

- tree: packages/atoms/base-tools2
  mutations:
    buildtime_deps:
      packages:
        - category: seed
          name: macaroni-funtoo-race3
  uses:
    disabled:
    - nios2
    - sh
    - static-libs
  packages:
  - app-crypt/libmd
  - app-shells/gentoo-bashcomp
  - sys-apps/miscfiles

- tree: packages/atoms/base-tools2
  uses:
    disabled:
    - nios2
    - sh
    - static-libs
    enabled:
    - abi_x86_64
  packages:
  - dev-libs/libbsd

- tree: packages/atoms/base-tools2
  packages:
    - dev-scheme/guile:12
  finalizer:
    shell:
      - "/bin/bash"
      - "-c"
    install:
      # The ccache files must be a date more updated of the scm files.
      # Without this guile tool is pretty broken.
      - >-
        cd /usr/lib64/guile/2.2/ccache/ &&
        for i in $(find . | grep '.go$' ) ; do touch $i ; done || true


include_layers:
- layers/macaroni-funtoo-race3.yaml

trees:
- ../packages/seeds
- ../packages/virtual
- ../packages/entities
- ../packages/atoms/base
- ../packages/atoms/base-extra
- ../packages/atoms/base-python
