build_template_file: ../templates/build-pkg-uses-subsets3.yaml.tmpl

global_annotations:
  subsets:
    rules:
      devel:
        - "^/usr/include/"
      portage:
        - "^/var/db/pkg/"

artefacts:

- tree: packages/atoms/java
  uses:
    enabled:
      - alsa
    disabled:
      - selinux
      - cups
      # GUI needs libawt_xawt.so
      - headless-awt
      #- system-java
  packages:
    - dev-java/openjdk-jre-bin:8
    - dev-java/openjdk-jre-bin:11
    - dev-java/openjdk-jre-bin:17
    - dev-java/openjdk-jre-bin:20
    - dev-java/openjdk-jre-bin:21
    - dev-java/openjdk-bin:8
    - dev-java/openjdk-bin:11
    - dev-java/openjdk-bin:17
    - dev-java/openjdk-bin:20
    - dev-java/openjdk-bin:21
    - dev-java/maven-bin:3.9
    - app-eselect/eselect-java

- tree: packages/atoms/java
  uses:
    disabled:
      - static-libs
  packages:
    - app-eselect/eselect-java:0
    - sys-apps/baselayout-java:0

- tree: packages/atoms/java
  uses:
    enabled:
      - python_targets_python3_9
  packages:
    - dev-java/java-config:2

- tree: packages/atoms/java
  mutations:
    buildtime_deps:
      packages:
        - category: seed
          name: macaroni-funtoo-race16
  packages:
    - virtual/jre:1.8
    - virtual/jre:11
    - dev-libs/libffi-compat:6

- tree: packages/atoms/java
  mutations:
    buildtime_deps:
      packages:
        - category: dev-java-8
          name: openjdk-bin
  packages:
    - virtual/jdk:1.8

- tree: packages/atoms/java
  mutations:
    runtime_deps:
      packages:
        - category: dev-java-11
          name: openjdk-bin
    buildtime_deps:
      packages:
        - category: dev-java-11
          name: openjdk-bin
  packages:
    - virtual/jdk:11

- tree: packages/atoms/java
  mutations:
    runtime_deps:
      packages:
        - category: dev-java-17
          name: openjdk-bin
    buildtime_deps:
      packages:
        - category: dev-java-17
          name: openjdk-bin
  packages:
    - virtual/jdk:17

- tree: packages/atoms/java
  mutations:
    runtime_deps:
      packages:
        - category: dev-java-17
          name: openjdk-jre-bin
    buildtime_deps:
      packages:
        - category: dev-java-17
          name: openjdk-jre-bin
  packages:
    - virtual/jre:17

- tree: packages/atoms/java
  replacements:
    ignore:
      - name: oracle-jdk-bin
        category: dev-java
  mutations:
    runtime_deps:
      packages:
        - category: dev-java-20
          name: openjdk-bin
    buildtime_deps:
      packages:
        - category: dev-java-20
          name: openjdk-bin
  packages:
    - virtual/jdk:20

- tree: packages/atoms/java
  replacements:
    ignore:
      - name: oracle-jdk-bin
        category: dev-java
  mutations:
    runtime_deps:
      packages:
        - category: dev-java-21
          name: openjdk-bin
    buildtime_deps:
      packages:
        - category: dev-java-21
          name: openjdk-bin
  packages:
    - virtual/jdk:21

- tree: packages/atoms/java
  replacements:
    ignore:
      - name: oracle-jdk-bin
        category: dev-java-20
  mutations:
    runtime_deps:
      packages:
        - category: dev-java-20
          name: openjdk-jre-bin
    buildtime_deps:
      packages:
        - category: dev-java-20
          name: openjdk-jre-bin
  packages:
    - virtual/jre:20

- tree: packages/atoms/java
  replacements:
    ignore:
      - name: oracle-jdk-bin
        category: dev-java-21
  mutations:
    runtime_deps:
      packages:
        - category: dev-java-21
          name: openjdk-jre-bin
    buildtime_deps:
      packages:
        - category: dev-java-21
          name: openjdk-jre-bin
  packages:
    - virtual/jre:21

- tree: packages/atoms/java
  mutations:
    conflicts:
      - category: dev-java
        name: ant-core
        version: '<=1.10.5'
    provides:
      - category: dev-java
        name: ant-core
        version: 1.10.13
  packages:
    - dev-java/ant-bin:1.10

- tree: packages/atoms/java
  uses:
    disabled:
      - sources
  packages:
    - media-gfx/plantuml

- tree: packages/atoms/java
  mutations:
    buildtime_deps:
      packages:
        - category: seed
          name: macaroni-funtoo-race16
  packages:
    - app-eselect/eselect-gradle

- tree: packages/atoms/java
  uses:
    disabled:
      - doc
      - examples
      - source
  packages:
    - dev-java/gradle-bin:3.4.1

