build_template_file: ../templates/build-pkg-uses-subsets3.yaml.tmpl

global_annotations:
  subsets:
    rules:
      devel:
        - "^/usr/include/"
      portage:
        - "^/var/db/pkg/"

artefacts:


- tree: packages/atoms/nvidia
  mutations:
    buildtime_deps:
      packages:
        - category: seed
          name: macaroni-funtoo-race14
  packages:
    - sys-kernel/dummy-sources
    - app-emulation/libnvidia-container-bin

- tree: packages/atoms/nvidia
  packages:
    - dev-util/opencl-headers
    - sys-power/acpid

- tree: packages/atoms/nvidia
  replacements:
    runtime_deps:
      ignore:
        - category: dev-util
          name: opencl-headers
  packages:
    - dev-libs/ocl-icd

- tree: packages/atoms/nvidia
  mutations:
    buildtime_deps:
      packages:
        - category: sys-kernel
          name: dummy-sources
  packages:
    - virtual/linux-sources

- tree: packages/atoms/nvidia
  packages:
    - app-misc/rdfind

- tree: packages/atoms/nvidia
  packages:
    - sys-kernel/linux-firmware

- tree: packages/atoms/nvidia
  mutations:
    runtime_deps:
      packages:
        - category: app-admin
          name: gpu-configurator
    provides:
      - category: x11-drivers
        name: nvidia-drivers
        version: '550.107.02'
    conflicts:
      - category: x11-drivers
        name: nvidia-drivers
        version: '<550.107.02'
    uses:
      - static-libs
      - acpi
  # NOTE: static-libs is needed for xfce4-sensors-plugin
  uses:
    disabled:
      - debug
      - test
      - doc
  packages:
    - x11-drivers/nvidia-drivers:550
  finalizer:
    shell:
      - "/bin/bash"
      - "-c"
    install:
      - >-
        gpu-configurator nvidia configure --with-video-group
        {{ ( index .Values.labels "original.package.version" ) }} --if-not-set || true

      - eval 'macaronictl env-update || true'
      # NOTE: This is created by the file for systemd-tmpfiles package
      #       on build.yaml
      # Create SidebandSocketPath directory
      # - >-
      #  eval 'mkdir /var/run/nvidia-xdriver || true' &&
      #  chmod ug+rwx /var/run/nvidia-xdriver/ &&
      #  chown root:video /var/run/nvidia-xdriver/
      # Add this row to default nvidia class
      # Option         "SidebandSocketPath" "/var/run/nvidia-xdriver/"
    uninstall:
      - >-
        gpu-configurator nvidia configure --with-video-group
        {{ ( index .Values.labels "original.package.version" ) }} --if-not-set --purge || true

- tree: packages/atoms/nvidia
  mutations:
    runtime_deps:
      packages:
        - category: app-admin
          name: gpu-configurator
    uses:
      - static-libs
      - acpi
  # NOTE: static-libs is needed for xfce4-sensors-plugin
  uses:
    disabled:
      - debug
      - test
      - doc
  packages:
    - x11-drivers/nvidia-drivers:535
    - x11-drivers/nvidia-drivers:555
    - x11-drivers/nvidia-drivers:560
    - x11-drivers/nvidia-drivers:565
    - x11-drivers/nvidia-drivers:570
    - x11-drivers/nvidia-drivers:575
    - x11-drivers/nvidia-drivers:580
  finalizer:
    shell:
      - "/bin/bash"
      - "-c"
    install:
      - >-
        gpu-configurator nvidia configure --with-video-group
        {{ ( index .Values.labels "original.package.version" ) }} --if-not-set || true
      - eval 'macaronictl env-update || true'
      # NOTE: This is created by the file for systemd-tmpfiles package
      #       on build.yaml
      # Create SidebandSocketPath directory
      # - >-
      #  eval 'mkdir /var/run/nvidia-xdriver || true' &&
      #  chmod ug+rwx /var/run/nvidia-xdriver/ &&
      #  chown root:video /var/run/nvidia-xdriver/
      # Add this row to default nvidia class
      # Option         "SidebandSocketPath" "/var/run/nvidia-xdriver/"
    uninstall:
      - >-
        gpu-configurator nvidia configure --with-video-group
        {{ ( index .Values.labels "original.package.version" ) }} --if-not-set --purge || true


