      devel:
        - "^/usr/include/"
      portage:
        - "^/var/db/pkg/"

artefacts:

- tree: packages/atoms/base-qt6
  mutations:
    uses:
      - networkmanager
  uses:
    disabled:
      - static-libs
      - debug
      - sh
      - nios2
      - ofono
      - systemd
      - doc
      - examples
  packages:
  - net-misc/connman

- tree: packages/atoms/base-qt6
  uses:
    disabled:
    - gconf
    - nios2
    - python_targets_python3_8
    - python_targets_python3_7
    - python_targets_python2_7
    - sh
    - test
    - kde
    enabled:
    - X
    - wayland
    - emoji
    - gtk
    - gtk2
    - gtk3
    - gtk4
    - gui
    - libnotify
    - introspection
    - appindicator
    - nls
    - python
    - python_targets_python3_9
    - unicode
  packages:
  - app-i18n/ibus

- tree: packages/atoms/base-qt6
  mutations:
    buildtime_deps:
      packages:
        - category: seed
          name: macaroni-funtoo-race9
  uses:
    disabled:
    - examples
    - nios2
    - sh
    - test
    - old-kernel
    - debug
  packages:
    - app-i18n/unicode-emoji

- tree: packages/atoms/base-qt6
  uses:
    disabled:
    - examples
    - nios2
    - sh
    - test
    - old-kernel
    - debug
  packages:
    - app-i18n/unicode-cldr
    - app-i18n/unicode-data

- tree: packages/atoms/base-qt6
  mutations:
    runtime_deps:
      packages:
        - category: macaroni
          name: entities-catalog
  uses:
    disabled:
    - nios2
    - sh
    enabled:
    - introspection
    - modemmanager
    - zeroconf
  packages:
  - app-misc/geoclue:2.0
  finalizer:
    shell:
      - "/bin/bash"
      - "-c"
    install:
      - >-
        eval 'mkdir -p /var/lib/geoclue || true' &&
        entities merge --specs-dir /usr/share/macaroni/entities/
        -e geoclue

- tree: packages/atoms/base-qt6
  packages:
    - app-text/scrollkeeper-dtd:1.0
  finalizer:
    shell:
      - "/bin/bash"
      - "-c"
    install:
      - >-
        DTD_FILE="scrollkeeper-omf.dtd"
        DOC_TYPE=public
        DOC_DESCR="-//OMF//DTD Scrollkeeper OMF Variant V1.0//EN"
        DTD_FILE=usr/share/xml/scrollkeeper/dtds/${DTD_FILE}
        TARGET_CATALOG=etc/xml/catalog
        whip h xmlcatalog.cat_install || true
      - >-
        DTD_FILE="scrollkeeper-omf.dtd"
        SRC_URI="http://scrollkeeper.sourceforge.net/dtds/scrollkeeper-omf-1.0/${DTD_FILE}"
        DOC_TYPE=system
        DOC_DESCR="${SRC_URI}"
        DTD_FILE=usr/share/xml/scrollkeeper/dtds/${DTD_FILE}
        TARGET_CATALOG=etc/xml/catalog
        whip h xmlcatalog.cat_install || true

    uninstall:
      - >-
        DTD_FILE="scrollkeeper-omf.dtd"
        DTD_FILE=usr/share/xml/scrollkeeper/dtds/${DTD_FILE}
        TARGET_CATALOG=etc/xml/catalog
        whip h xmlcatalog.cat_remove || true

