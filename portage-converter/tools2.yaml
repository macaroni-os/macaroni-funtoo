build_template_file: ../templates/build-pkg-uses-subsets3.yaml.tmpl

global_annotations:
  subsets:
    rules:
      devel:
        - "^/usr/include/"
      portage:
        - "^/var/db/pkg/"

artefacts:

- tree: packages/atoms-extra/tools2
  mutations:
    uses:
      # Macaroni os patch
      - blas
  uses:
    disabled:
      - debug
      - test
      - doc
      - static-libs
      - ldap
      - libressl
      - libssh2
  packages:
    - net-analyzer/nmap

- tree: packages/atoms-extra/tools2
  mutations:
    uses:
      - "-gdm"
  uses:
    disabled:
      - debug
      - gtk
      - gdm
      - doc
  packages:
    - sys-boot/plymouth

- tree: packages/atoms-extra/tools2
  mutations:
    uses:
      - "-gtk"
  uses:
    disabled:
      - debug
      - gtk
      - gdm
      - doc
  packages:
    - sys-boot/plymouth-openrc-plugin

include_layers:
- layers/macaroni-mark-race11.yaml

trees:
- ../packages/seeds
